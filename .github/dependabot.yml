version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    exclude-paths:
      - fixtures/**
      - test-cases/**
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      oxc-dependencies:
        patterns:
          - "oxc_*"
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "oxc_*"

  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - fixtures/**
      - test-cases/**
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # typescript stays on 6.0.3. TypeScript 7 makes the typescript-eslint parser
    # throw on load, so Dependabot must not open that major.
    # https://github.com/typescript-eslint/typescript-eslint/issues/12518
    # Related: https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - fixtures/**
      - test-cases/**
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"

  # exclude-paths on the root entries skips version updates for saved fixtures.
  # Security updates ignore that list and still open pull requests. These entries
  # own fixtures/ and test-cases/ and ignore every dependency, including security
  # updates, with an explicit versions range. A fixture whose behavior depends on
  # a real package version needs its own entry, recorded in
  # tests/js/dependabot-config.test.js, instead of this ignore.
  - package-ecosystem: npm
    directories:
      - /fixtures
      - /fixtures/**
      - /test-cases
      - /test-cases/**
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        versions:
          - ">= 0"

  - package-ecosystem: cargo
    directories:
      - /fixtures
      - /fixtures/**
      - /test-cases
      - /test-cases/**
    schedule:
      interval: weekly
      day: monday
      time: "09:50"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        versions:
          - ">= 0"
