name: Mimalloc evaluation summary

on: workflow_call

permissions:
  contents: read

jobs:
  summarize:
    name: Validate paired measurements
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download all paired samples
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mimalloc-sample-*
          path: measurements
          merge-multiple: true
      - name: Require complete parity and report paired statistics
        timeout-minutes: 2
        run: python3 scripts/performance/mimalloc-report.py summarize measurements
      - name: Upload summary
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mimalloc-summary
          path: measurements/summary.json
          if-no-files-found: warn
          retention-days: 7
