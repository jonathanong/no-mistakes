name: Temporary compiler experiment

on:
  push:
    branches:
      - codex/pgo-codegen-20261012
    paths:
      - .github/workflows/compiler-experiment.yml
      - .github/scripts/compiler-experiment.py

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lld
            opt: "3"
            rustflags: -D warnings -C link-arg=-fuse-ld=lld
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build production CLI and addon
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.variant }}' == lld ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y lld
            command -v ld.lld
            ld.lld --version > experiment-linker-version.txt
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/no-mistakes/Cargo.toml')
          source = path.read_text()
          before = 'crate-type = ["rlib"]'
          assert source.count(before) == 1
          path.write_text(source.replace(before, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          mkdir -p experiment
          /usr/bin/time -v -o experiment/build.time \
            env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
              --target aarch64-unknown-linux-gnu -p no-mistakes
          binary=target/aarch64-unknown-linux-gnu/release/no-mistakes
          addon=target/aarch64-unknown-linux-gnu/release/libno_mistakes.so
          test -s "$addon"
          cp "$binary" experiment/no-mistakes
          sha256sum "$binary" "$addon" > experiment/hashes.txt
          stat -c '%n %s' "$binary" "$addon" > experiment/sizes.txt
          rustc -Vv > experiment/rustc.txt
          lscpu > experiment/cpu.txt
          git rev-parse HEAD > experiment/source-commit.txt
          env | sort | grep -E '^(CARGO_PROFILE_RELEASE_|RUSTFLAGS=|ImageOS=|ImageVersion=|RUNNER_ARCH=)' > experiment/environment.txt
          if [[ -f experiment-linker-version.txt ]]; then
            cp experiment-linker-version.txt experiment/linker-version.txt
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-${{ matrix.variant }}
          path: experiment/
          retention-days: 3
          compression-level: 0

  measure:
    name: Measure matched binaries
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38333004819 --repo jonathanong/no-mistakes --name codegen-baseline --dir "$RUNNER_TEMP/compiler-experiment/baseline"
      - name: Download exact opt2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38333310090 --repo jonathanong/no-mistakes --name compiler-opt2 --dir "$RUNNER_TEMP/compiler-experiment/compiler-opt2"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: compiler-*
          path: ${{ runner.temp }}/compiler-experiment
      - name: Run balanced checks
        run: python .github/scripts/compiler-experiment.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: compiler-measurements
          path: ${{ runner.temp }}/compiler-experiment/measurements/
          retention-days: 3
