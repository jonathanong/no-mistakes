name: Native build timings

# Manual compile of the two slowest questions in a release: darwin and
# linux-x64. Same profile, cache key, and cargo command as Release. This
# workflow does not prepare a version, tag, or publish.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-build-timings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Time ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            addon: libno_mistakes.dylib
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            addon: libno_mistakes.so
    env:
      NM_TARGET: ${{ matrix.target }}
      NM_ADDON: ${{ matrix.addon }}
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          prefix-key: v1-rust-release
          shared-key: release-${{ matrix.target }}
          cache-bin: "false"

      - name: Add swap
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h /
          avail_gb=$(( $(df --output=avail -B1 / | tail -1 | tr -dc '0-9') / 1073741824 ))
          size_gb=16
          if [ "$avail_gb" -lt $((size_gb + 4)) ]; then
            size_gb=$((avail_gb - 4))
          fi
          if [ "$size_gb" -lt 1 ]; then
            echo "not enough free disk for swap"
            exit 0
          fi
          sudo swapoff -a || true
          sudo fallocate -l "${size_gb}G" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build CLI and N-API addon
        timeout-minutes: 90
        shell: bash
        run: bash .github/scripts/cargo-release-build.sh

      - name: Upload Cargo timings
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: error
