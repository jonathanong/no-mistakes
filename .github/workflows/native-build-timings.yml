name: Native build timings

# Isolated Windows release build measurement.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-build-timings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Time x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      NM_TARGET: x86_64-pc-windows-msvc
      NM_ADDON: no_mistakes.dll
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 2
        continue-on-error: true
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command @'
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }
          '@

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          targets: ${{ env.NM_TARGET }}

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          prefix-key: v1-rust-release
          shared-key: release-${{ env.NM_TARGET }}
          cache-bin: "false"
          save-if: "false"

      - name: Build CLI and N-API addon
        timeout-minutes: 90
        shell: bash
        run: bash .github/scripts/cargo-release-build.sh

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Validate CLI and load addon
        timeout-minutes: 3
        shell: bash
        run: |
          version=$(node -p "require('./packages/no-mistakes/package.json').version")
          cli_version=$(target/"$NM_TARGET"/release/no-mistakes.exe --version)
          test "$cli_version" = "no-mistakes $version"
          echo "$cli_version"
          bash .github/scripts/stage-release-addon.sh "$version"

      - name: Upload Cargo timings
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-timings-${{ env.NM_TARGET }}
          path: target/cargo-timings/*.html
          if-no-files-found: error
