name: Temporary codegen consumer experiment

on:
  push:
    branches:
      - codex/pgo-codegen-20261012
    paths:
      - .github/workflows/codegen-consumer-experiment.yml
      - .github/scripts/codegen-consumer-experiment.py

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Consumer ${{ matrix.fixture.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: acceptance
            commit: 22edf4bfe0a782ac0d030c916dedfd6f8acb499c
            tree: e848d7ad03e0c0fca7ec70eb0f678653f70c278b
          - name: reported-pair
            commit: 92d0a2061bde8d260aa0b86a2d71110ece1a43ca
            tree: 11815b62e69a39be94ed790e8984994f50113cd3
    steps:
      - name: Checkout experiment harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout pinned public consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: ${{ matrix.fixture.commit }}
          path: fixture
          persist-credentials: false
      - name: Install consumer Node
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false
      - name: Install consumer pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json
      - name: Install pinned consumer dependencies
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn
      - name: Install pinned consumer CI tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          working_directory: fixture
      - name: Download same-source fat and Thin binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38333004819 --repo jonathanong/no-mistakes \
            --name codegen-baseline --dir "$RUNNER_TEMP/codegen-consumer/baseline"
          gh run download 38333004819 --repo jonathanong/no-mistakes \
            --name codegen-thin --dir "$RUNNER_TEMP/codegen-consumer/thin"
      - name: Run balanced exact consumer check
        env:
          EXPECTED_TREE: ${{ matrix.fixture.tree }}
          EXPECTED_COMMIT: ${{ matrix.fixture.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python harness/.github/scripts/codegen-consumer-experiment.py
      - name: Upload logs and samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codegen-consumer-${{ matrix.fixture.name }}
          path: ${{ runner.temp }}/codegen-consumer/measurements/
          if-no-files-found: warn
          retention-days: 3
