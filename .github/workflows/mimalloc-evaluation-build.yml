name: Mimalloc evaluation build

on: workflow_call

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            variant: system
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            variant: mimalloc
          - target: aarch64-apple-darwin
            runner: macos-15
            variant: system
          - target: aarch64-apple-darwin
            runner: macos-15
            variant: mimalloc
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '16' }}
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
      - name: Restore release compilation cache
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: mimalloc-evaluation
          key: ${{ matrix.target }}
          cache-bin: "false"
      - name: Record host memory and CPU
        timeout-minutes: 1
        run: free -m || vm_stat; nproc || sysctl -n hw.logicalcpu; df -h .
      - name: Build release CLI and addon
        # Match release.yml build-native: 45m compile inside an 80m job.
        timeout-minutes: 45
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash scripts/performance/mimalloc-build.sh "${{ matrix.variant }}" "$RUNNER_TEMP"
      - name: Upload immutable CLI, addon, and provenance
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mimalloc-${{ matrix.target }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Cargo timings
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mimalloc-cargo-timings-${{ matrix.target }}-${{ matrix.variant }}
          path: target/cargo-timings
          if-no-files-found: warn
          retention-days: 7
      - name: Delete owned Cargo outputs after artifact retention
        if: always()
        timeout-minutes: 3
        env:
          VARIANT: ${{ matrix.variant }}
        run: rm -rf "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/probe-target-$VARIANT"
