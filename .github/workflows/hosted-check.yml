name: Hosted full-check performance

on:
  schedule:
    - cron: "23 8 * * 1"
  pull_request:
    paths:
      - ".github/workflows/hosted-check.yml"
      - ".github/scripts/hosted-check*.cjs"
      - ".github/scripts/hosted-check-budgets.json"
      - ".github/scripts/hosted-check*.json"
      - "tests/js/hosted-check*.test.js"
      - "fixtures/hosted-check/**"
  workflow_dispatch:
    inputs:
      candidateRef:
        description: "Exact 40-character candidate source commit"
        required: false
      baselineRef:
        description: "Optional exact 40-character source baseline; default is published 0.86.2"
        required: false
      diagnosticsMode:
        description: "Source comparisons: diagnostics off, on, or both"
        type: choice
        options: ["off", "on", "both"]
        default: "off"
      artifactRunId:
        description: "Optional registered run with immutable matching production artifacts; no rebuild"
        required: false
      expectedFindings:
        description: "Matched-only expected findings contract; checks still fail on exit 1"
        type: boolean
        default: false
      calibrate:
        description: "Record variance and proposed budgets without enforcing stored limits"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: read
    name: ${{ matrix.variant == 'baseline' && 'Build production baseline CLI' || 'Build production candidate CLI' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.baselineRef && '["current", "baseline"]' || '["current"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    env:
      CANDIDATE_REF: ${{ matrix.variant == 'baseline' && inputs.baselineRef || inputs.candidateRef || github.event.pull_request.head.sha || github.sha }}
      BASELINE_REF: ${{ inputs.baselineRef }}
      DIAGNOSTICS_MODE: ${{ inputs.diagnosticsMode || 'off' }}
      ARTIFACT_RUN_ID: ${{ inputs.artifactRunId }}
      ARTIFACT_VARIANT: ${{ matrix.variant }}
      EXPECTED_FINDINGS: ${{ inputs.expectedFindings || false }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Validate exact source pin
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$BASELINE_REF" || "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTICS_MODE" =~ ^(off|on|both)$ ]]
          if [[ "$DIAGNOSTICS_MODE" != off || "$EXPECTED_FINDINGS" == true ]]; then test -n "$BASELINE_REF"; fi
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test -n "$BASELINE_REF"
          fi

      - name: Checkout candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          persist-credentials: false

      - name: Checkout artifact reuse verifier
        if: ${{ inputs.artifactRunId != '' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: reuse-harness
          persist-credentials: false

      - name: Select registered immutable artifact
        if: ${{ inputs.artifactRunId != '' }}
        id: reuse
        timeout-minutes: 1
        run: node reuse-harness/.github/scripts/hosted-check-reuse.cjs select "$ARTIFACT_RUN_ID" "$ARTIFACT_VARIANT" "$CANDIDATE_REF"

      - name: Download registered production bytes
        if: ${{ inputs.artifactRunId != '' }}
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact-id }}
          run-id: ${{ inputs.artifactRunId }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: production-cli

      - name: Verify unchanged bytes and original source-build provenance
        if: ${{ inputs.artifactRunId != '' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          node reuse-harness/.github/scripts/hosted-check-reuse.cjs verify "$ARTIFACT_RUN_ID" "$ARTIFACT_VARIANT" "$CANDIDATE_REF" production-cli "$GITHUB_WORKSPACE" | tee reuse-verification.json

      - name: Preserve reuse verification separately from original artifact
        if: ${{ inputs.artifactRunId != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-reuse-verification-${{ matrix.variant }}
          path: reuse-verification.json
          if-no-files-found: error

      - name: Install production Rust compiler
        if: ${{ inputs.artifactRunId == '' }}
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache production build
        if: ${{ inputs.artifactRunId == '' }}
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: hosted-full-check-production
          shared-key: release-x86_64-unknown-linux-gnu
          cache-bin: "false"

      - name: Build with official x86 release flags and default features
        if: ${{ inputs.artifactRunId == '' }}
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          # Keep fat LTO and Mermaid: swap protects the cold production link.
          sudo fallocate -l 8G /mnt/no-mistakes-hosted.swap
          sudo chmod 600 /mnt/no-mistakes-hosted.swap
          sudo mkswap /mnt/no-mistakes-hosted.swap
          sudo swapon /mnt/no-mistakes-hosted.swap
          mkdir -p production-cli
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          manifest = Path('crates/no-mistakes/Cargo.toml')
          source = manifest.read_text()
          original = 'crate-type = ["rlib"]'
          if original not in source:
              raise SystemExit('unexpected production crate-type')
          provenance = {
              'commit': run('git', 'rev-parse', 'HEAD'),
              'tree': run('git', 'rev-parse', 'HEAD^{tree}'),
              'rustc': run('rustc', '-Vv'), 'cargo': run('cargo', '-V'),
              'sourceVersion': run('git', 'show', 'HEAD:crates/no-mistakes/Cargo.toml'),
              'command': 'NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked --target x86_64-unknown-linux-gnu -p no-mistakes',
              'features': 'default (including mermaid-validation)',
              'lto': 'fat', 'codegenUnits': 1, 'buildJobs': 1,
              'rustflags': os.environ.get('RUSTFLAGS', ''),
              'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'),
              'releaseManifestPatch': 'rlib plus cdylib, identical to release.yml',
              'cargoLockSha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
              'sourceManifestSha256': hashlib.sha256(source.encode()).hexdigest(),
              'baselineSourceCommit': os.environ.get('BASELINE_REF') or '4dd9fcc2e74d45d2a84ff12ceec05d37c3e286ac',
              'baselineCompiler': 'matching source build; verify both provenance records' if os.environ.get('BASELINE_REF') else 'published npm binary; build compiler not independently established',
          }
          Path('production-cli/provenance.json').write_text(json.dumps(provenance, indent=2))
          manifest.write_text(source.replace(original, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked --target x86_64-unknown-linux-gnu -p no-mistakes
          cp target/x86_64-unknown-linux-gnu/release/no-mistakes production-cli/no-mistakes
          # Probe the runtime CPU policy with the exact num_cpus dependency.
          cat > /tmp/hosted-cpu-probe.rs <<'RS'
          fn main() { println!("{}", num_cpus::get()); }
          RS
          cpu_library=$(find target/x86_64-unknown-linux-gnu/release/deps -name 'libnum_cpus-*.rlib' -print -quit)
          test -n "$cpu_library"
          rustc /tmp/hosted-cpu-probe.rs --edition=2021 --target x86_64-unknown-linux-gnu \
            -L dependency=target/x86_64-unknown-linux-gnu/release/deps \
            --extern "num_cpus=$cpu_library" -o production-cli/cpu-probe
          python - <<'PYBUILD'
          from pathlib import Path
          import hashlib, json, subprocess
          directory = Path('production-cli')
          provenance = json.loads((directory / 'provenance.json').read_text())
          fingerprints = list(Path('target/x86_64-unknown-linux-gnu/release/.fingerprint').glob('no-mistakes-*/lib-no_mistakes.json'))
          if len(fingerprints) != 1:
              raise SystemExit('expected one production library fingerprint')
          provenance.update({
              'effectiveBuildManifestSha256': hashlib.sha256(Path('crates/no-mistakes/Cargo.toml').read_bytes()).hexdigest(),
              'libraryFingerprint': json.loads(fingerprints[0].read_text()),
              'binarySha256': hashlib.sha256((directory / 'no-mistakes').read_bytes()).hexdigest(),
              'binaryVersion': subprocess.check_output([str(directory / 'no-mistakes'), '--version'], text=True).strip(),
          })
          (directory / 'provenance.json').write_text(json.dumps(provenance, indent=2))
          PYBUILD
          sha256sum production-cli/no-mistakes > production-cli/SHA256SUMS
          production-cli/no-mistakes --version

      - name: Upload pinned production CLI
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.variant == 'baseline' && 'hosted-baseline-cli' || 'hosted-production-cli' }}
          path: production-cli/
          if-no-files-found: error

  sample:
    name: ${{ matrix.fixture.name }} jobs ${{ matrix.jobs }} pair ${{ matrix.sample }}${{ matrix.diagnostics == 'on' && ' (diagnostics on)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    # 22 minutes for two capped commands, plus setup and artifact upload.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.baselineRef && 72 || 6 }}
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
        jobs: ["1", "4", "auto"]
        diagnostics: ${{ fromJSON(inputs.diagnosticsMode == 'both' && '["off", "on"]' || inputs.diagnosticsMode == 'on' && '["on"]' || '["off"]') }}
        fixture:
          - name: acceptance
            commit: 22edf4bfe0a782ac0d030c916dedfd6f8acb499c
            tree: e848d7ad03e0c0fca7ec70eb0f678653f70c278b
          - name: passing-failing
            commit: 92d0a2061bde8d260aa0b86a2d71110ece1a43ca
            tree: 11815b62e69a39be94ed790e8984994f50113cd3
    steps:
      - name: Checkout measurement harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact public consumer tree
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: ${{ matrix.fixture.commit }}
          path: fixture
          persist-credentials: false

      # Match the consumer's setup-node-pnpm action, scoped to this checkout.
      - name: Install consumer Node
        timeout-minutes: 5
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false

      - name: Install consumer pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json

      - name: Install complete pinned consumer dependencies
        timeout-minutes: 10
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn

      - name: Install pinned consumer CI tools
        timeout-minutes: 5
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          working_directory: fixture

      - name: Download candidate CLI
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-production-cli
          path: production-cli

      - name: Download optional source baseline CLI
        if: ${{ inputs.baselineRef != '' }}
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-baseline-cli
          path: baseline-cli

      - name: Measure both exact public commands with a 600-second collection cap
        # Two 600-second commands + two 5-second kill grace periods + overhead.
        timeout-minutes: 22
        env:
          SAMPLE_NUMBER: ${{ matrix.sample }}
          HOSTED_CHECK_BASELINE_REF: ${{ inputs.baselineRef }}
          HOSTED_CHECK_CANDIDATE_REF: ${{ inputs.candidateRef || github.event.pull_request.head.sha || github.sha }}
          HOSTED_CHECK_BASELINE_ARTIFACT: baseline-cli
          HOSTED_CHECK_DIAGNOSTICS: ${{ matrix.diagnostics }}
          HOSTED_CHECK_JOBS: ${{ matrix.jobs }}
          HOSTED_CHECK_EXPECTED_FINDINGS: ${{ inputs.expectedFindings || false }}
          EXPECTED_TREE: ${{ matrix.fixture.tree }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x production-cli/no-mistakes production-cli/cpu-probe
          if [[ -f baseline-cli/no-mistakes ]]; then chmod +x baseline-cli/no-mistakes; fi
          node harness/.github/scripts/hosted-check.cjs measure fixture production-cli measurements "$SAMPLE_NUMBER" "$EXPECTED_TREE"

      - name: Upload measurements, provenance, and raw logs
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-check-${{ matrix.fixture.name }}-${{ matrix.jobs }}-${{ matrix.sample }}${{ matrix.diagnostics == 'on' && '-on' || '' }}
          path: |
            measurements/*.json
            measurements/*.txt
            measurements/*.stdout
            measurements/*.stderr
            measurements/*.time
          if-no-files-found: error

  summarize:
    name: Summarize hosted samples
    if: ${{ always() }}
    needs: [build, sample]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download measurements
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hosted-check-*
          path: measurements

      - name: Report max and empirical p95; enforce complete candidate results
        timeout-minutes: 1
        env:
          HOSTED_CHECK_CALIBRATE: ${{ inputs.calibrate || false }}
          HOSTED_CHECK_EXPECTED_FINDINGS: ${{ inputs.expectedFindings || false }}
          HOSTED_CHECK_BASELINE_REF: ${{ inputs.baselineRef }}
          HOSTED_CHECK_CANDIDATE_REF: ${{ inputs.candidateRef || github.event.pull_request.head.sha || github.sha }}
          HOSTED_CHECK_DIAGNOSTICS_MODE: ${{ inputs.diagnosticsMode || 'off' }}
        run: node .github/scripts/hosted-check.cjs summarize measurements

      - name: Upload summary
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-summary
          path: |
            measurements/summary.*
            measurements/proposed-budgets.json
          if-no-files-found: error
