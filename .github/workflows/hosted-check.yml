name: Hosted full-check performance

on:
  schedule:
    - cron: "23 8 * * 1"
  pull_request:
    paths:
      - ".github/workflows/hosted-check.yml"
      - ".github/scripts/hosted-check*.cjs"
      - ".github/scripts/hosted-check-budgets.json"
      - "tests/js/hosted-check.test.js"
  workflow_dispatch:
    inputs:
      candidateRef:
        description: "Exact 40-character candidate source commit"
        required: false
      calibrate:
        description: "Record variance and proposed budgets without enforcing stored limits"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production candidate CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    env:
      CANDIDATE_REF: ${{ inputs.candidateRef || github.event.pull_request.head.sha || github.sha }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Validate exact source pin
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          persist-credentials: false

      - name: Install production Rust compiler
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache production build
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: hosted-full-check-production
          shared-key: release-x86_64-unknown-linux-gnu
          cache-bin: "false"

      - name: Build with official x86 release flags and default features
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          # Keep fat LTO and Mermaid: swap protects the cold production link.
          sudo fallocate -l 8G /mnt/no-mistakes-hosted.swap
          sudo chmod 600 /mnt/no-mistakes-hosted.swap
          sudo mkswap /mnt/no-mistakes-hosted.swap
          sudo swapon /mnt/no-mistakes-hosted.swap
          mkdir -p production-cli
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          manifest = Path('crates/no-mistakes/Cargo.toml')
          source = manifest.read_text()
          original = 'crate-type = ["rlib"]'
          if original not in source:
              raise SystemExit('unexpected production crate-type')
          provenance = {
              'commit': run('git', 'rev-parse', 'HEAD'),
              'tree': run('git', 'rev-parse', 'HEAD^{tree}'),
              'rustc': run('rustc', '-Vv'), 'cargo': run('cargo', '-V'),
              'sourceVersion': run('git', 'show', 'HEAD:crates/no-mistakes/Cargo.toml'),
              'command': 'NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked --target x86_64-unknown-linux-gnu -p no-mistakes',
              'features': 'default (including mermaid-validation)',
              'lto': 'fat', 'codegenUnits': 1, 'buildJobs': 1,
              'rustflags': os.environ.get('RUSTFLAGS', ''),
              'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'),
              'releaseManifestPatch': 'rlib plus cdylib, identical to release.yml',
              'baselineSourceCommit': '4dd9fcc2e74d45d2a84ff12ceec05d37c3e286ac',
              'baselineCompiler': 'published npm binary; build compiler not independently established',
          }
          Path('production-cli/provenance.json').write_text(json.dumps(provenance, indent=2))
          manifest.write_text(source.replace(original, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked --target x86_64-unknown-linux-gnu -p no-mistakes
          cp target/x86_64-unknown-linux-gnu/release/no-mistakes production-cli/no-mistakes
          # Probe the runtime CPU policy with the exact num_cpus dependency.
          cat > /tmp/hosted-cpu-probe.rs <<'RS'
          fn main() { println!("{}", num_cpus::get()); }
          RS
          cpu_library=$(find target/x86_64-unknown-linux-gnu/release/deps -name 'libnum_cpus-*.rlib' -print -quit)
          test -n "$cpu_library"
          rustc /tmp/hosted-cpu-probe.rs --edition=2021 --target x86_64-unknown-linux-gnu \
            -L dependency=target/x86_64-unknown-linux-gnu/release/deps \
            --extern "num_cpus=$cpu_library" -o production-cli/cpu-probe
          sha256sum production-cli/no-mistakes > production-cli/SHA256SUMS
          production-cli/no-mistakes --version

      - name: Upload pinned production CLI
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-production-cli
          path: production-cli/
          if-no-files-found: error

  sample:
    name: ${{ matrix.fixture.name }} jobs ${{ matrix.jobs }} pair ${{ matrix.sample }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
        jobs: ["1", "4", "auto"]
        fixture:
          - name: acceptance
            commit: 22edf4bfe0a782ac0d030c916dedfd6f8acb499c
            tree: e848d7ad03e0c0fca7ec70eb0f678653f70c278b
          - name: passing-failing
            commit: 92d0a2061bde8d260aa0b86a2d71110ece1a43ca
            tree: 11815b62e69a39be94ed790e8984994f50113cd3
    steps:
      - name: Checkout measurement harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Checkout exact public consumer tree
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: ${{ matrix.fixture.commit }}
          path: fixture
          persist-credentials: false

      # Match the consumer's setup-node-pnpm action, scoped to this checkout.
      - name: Install consumer Node
        timeout-minutes: 5
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false

      - name: Install consumer pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json

      - name: Install complete pinned consumer dependencies
        timeout-minutes: 10
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn

      - name: Install pinned consumer CI tools
        timeout-minutes: 5
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          working_directory: fixture

      - name: Download candidate CLI
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-production-cli
          path: production-cli

      - name: Measure both exact public commands with a 180-second deadline
        timeout-minutes: 7
        env:
          SAMPLE_NUMBER: ${{ matrix.sample }}
          HOSTED_CHECK_JOBS: ${{ matrix.jobs }}
          EXPECTED_TREE: ${{ matrix.fixture.tree }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x production-cli/no-mistakes production-cli/cpu-probe
          node harness/.github/scripts/hosted-check.cjs measure fixture production-cli measurements "$SAMPLE_NUMBER" "$EXPECTED_TREE"

      - name: Upload measurements, provenance, and raw logs
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-check-${{ matrix.fixture.name }}-${{ matrix.jobs }}-${{ matrix.sample }}
          path: |
            measurements/*.json
            measurements/*.txt
            measurements/*.stdout
            measurements/*.stderr
            measurements/*.time
          if-no-files-found: error

  summarize:
    name: Summarize hosted samples
    if: ${{ always() }}
    needs: [build, sample]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download measurements
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: hosted-check-*
          path: measurements

      - name: Report max and empirical p95; enforce complete candidate results
        timeout-minutes: 1
        env:
          HOSTED_CHECK_CALIBRATE: ${{ inputs.calibrate || false }}
        run: node .github/scripts/hosted-check.cjs summarize measurements

      - name: Upload summary
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosted-summary
          path: |
            measurements/summary.*
            measurements/proposed-budgets.json
          if-no-files-found: error
