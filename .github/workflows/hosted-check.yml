name: Hosted full-check performance

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional exact no-mistakes commit SHA to measure instead of current main"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hosted-check-main
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  NO_MISTAKES_BUILD_NAPI: "1"

# Standard measurement VMs preserve the calibrated CPU/RSS population.
# ubuntu-22.04 builds require an older glibc compatible with ubuntu-latest measurements.
jobs:
  resolve:
    name: Resolve main and latest stable release once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.refs.outputs.candidate }}
      baseline: ${{ steps.refs.outputs.baseline }}
      compiler: ${{ steps.refs.outputs.compiler }}
    steps:
      - name: Checkout immutable measurement harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Resolve one production stable compiler
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Resolve immutable main and latest release source identities
        id: refs
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_HARNESS_COMMIT: ${{ github.workflow_sha }}
          HOSTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(rustc --version | cut -d' ' -f2)"
          node .github/scripts/hosted-check-refs.cjs "$compiler" refs.json

      - name: Retain resolved sources and compiler
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-source-refs
          path: refs.json
          if-no-files-found: error

  dependencies:
    name: Prepare production dependencies (${{ matrix.variant }})
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            commit: ${{ needs.resolve.outputs.baseline }}
          - variant: candidate
            commit: ${{ needs.resolve.outputs.candidate }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.compiler }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/../no-mistakes-hosted-target
    steps:
      - name: Checkout immutable build harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout resolved source variant
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          path: source
          persist-credentials: false

      - name: Install the resolved compiler
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: ${{ needs.resolve.outputs.compiler }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust registry without assuming a warm target
        timeout-minutes: 3
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: hosted-source-production
          shared-key: registry
          workspaces: source
          cache-targets: "false"
          cache-bin: "false"

      - name: Download resolved source identities
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hosted-source-refs
          path: metadata

      - name: Compile the exact production dependency graph
        timeout-minutes: 24
        env:
          VARIANT: ${{ matrix.variant }}
        run: node harness/.github/scripts/hosted-check-build.cjs dependencies source artifact metadata/refs.json "$VARIANT"

      - name: Archive external dependency target for the next phase
        timeout-minutes: 3
        run: tar --zstd -cf dependency-target.tar.zst -C "$CARGO_TARGET_DIR" .

      - name: Upload dependency phase output
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-dependencies-${{ matrix.variant }}
          path: dependency-target.tar.zst
          compression-level: 0
          if-no-files-found: error

  production:
    name: Build real production CLI (${{ matrix.variant }})
    needs: [resolve, dependencies]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            commit: ${{ needs.resolve.outputs.baseline }}
          - variant: candidate
            commit: ${{ needs.resolve.outputs.candidate }}
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.compiler }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/../no-mistakes-hosted-target
    steps:
      - name: Checkout immutable build harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false

      - name: Checkout real resolved source variant
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          path: source
          persist-credentials: false

      - name: Install the same resolved compiler
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: ${{ needs.resolve.outputs.compiler }}
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust registry
        timeout-minutes: 3
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: hosted-source-production
          shared-key: registry
          workspaces: source
          cache-targets: "false"
          cache-bin: "false"
          save-if: "false"

      - name: Download resolved source identities
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hosted-source-refs
          path: metadata

      - name: Download the completed dependency phase
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hosted-dependencies-${{ matrix.variant }}
          path: prepared-dependencies

      - name: Restore external target and protect the production link
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_TARGET_DIR"
          tar --zstd -xf prepared-dependencies/dependency-target.tar.zst -C "$CARGO_TARGET_DIR"
          sudo fallocate -l 8G /mnt/no-mistakes-hosted.swap
          sudo chmod 600 /mnt/no-mistakes-hosted.swap
          sudo mkswap /mnt/no-mistakes-hosted.swap
          sudo swapon /mnt/no-mistakes-hosted.swap

      # Keep the rlib manifest: adding cdylib links an unused addon even with --bin.
      - name: Rebuild only the CLI with default features and official release flags
        timeout-minutes: 24
        env:
          VARIANT: ${{ matrix.variant }}
        run: node harness/.github/scripts/hosted-check-build.cjs production source "artifact/$VARIANT" metadata/refs.json "$VARIANT"

      - name: Upload source-built production CLI and provenance
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-production-${{ matrix.variant }}
          path: artifact/
          if-no-files-found: error

  sample:
    name: ${{ matrix.fixture.name }} jobs ${{ matrix.jobs }} pair ${{ matrix.sample }}
    needs: production
    runs-on: ubuntu-latest
    # 22 minutes for two capped commands, plus setup and artifact upload.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
        jobs: ["1", "4", "auto"]
        fixture:
          - name: acceptance
            commit: 22edf4bfe0a782ac0d030c916dedfd6f8acb499c
            tree: e848d7ad03e0c0fca7ec70eb0f678653f70c278b
          - name: passing-failing
            commit: 92d0a2061bde8d260aa0b86a2d71110ece1a43ca
            tree: 11815b62e69a39be94ed790e8984994f50113cd3
    steps:
      - name: Checkout measurement harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout exact public consumer tree
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: ${{ matrix.fixture.commit }}
          path: fixture
          persist-credentials: false

      # Match the consumer's setup-node-pnpm action, scoped to this checkout.
      - name: Install consumer Node
        timeout-minutes: 5
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false

      - name: Install consumer pnpm
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json

      - name: Install complete pinned consumer dependencies
        # Third-party install scripts run with contents: read and persist-credentials: false.
        timeout-minutes: 10
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn

      - name: Install pinned consumer CI tools
        timeout-minutes: 5
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false
          working_directory: fixture

      - name: Download both source-built production CLIs
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hosted-production-*
          path: artifact
          merge-multiple: true

      - name: Measure both exact public commands with a 600-second collection cap
        # Two 600-second commands + two 5-second kill grace periods + overhead.
        timeout-minutes: 22
        env:
          SAMPLE_NUMBER: ${{ matrix.sample }}
          HOSTED_CHECK_JOBS: ${{ matrix.jobs }}
          EXPECTED_TREE: ${{ matrix.fixture.tree }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/{baseline,candidate}/{no-mistakes,cpu-probe}
          node harness/.github/scripts/hosted-check.cjs measure fixture artifact measurements "$SAMPLE_NUMBER" "$EXPECTED_TREE"

      - name: Upload measurements, provenance, and raw logs
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-check-${{ matrix.fixture.name }}-${{ matrix.jobs }}-${{ matrix.sample }}
          path: |
            measurements/*.json
            measurements/*.txt
            measurements/*.stdout
            measurements/*.stderr
            measurements/*.time
          if-no-files-found: error

  summarize:
    name: Summarize hosted samples
    if: ${{ always() }}
    needs: [resolve, dependencies, production, sample]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download measurements
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hosted-check-*
          path: measurements

      - name: Report max and empirical p95; enforce complete candidate results
        timeout-minutes: 1
        run: node .github/scripts/hosted-check.cjs summarize measurements

      - name: Upload summary
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-summary
          path: |
            measurements/summary.*
            measurements/proposed-budgets.json
            measurements/comparisons.json
          if-no-files-found: error
