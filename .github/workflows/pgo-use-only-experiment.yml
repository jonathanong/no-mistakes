name: Temporary PGO profile-use follow-up

on:
  push:
    branches:
      - codex/native-cpu-20261012
    paths:
      - .github/workflows/pgo-use-only-experiment.yml

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8fdeedeaef6af73eb3d0bd2d1a5fc31604861f0e
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Download merged stable-compiler training profile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38335818556 --repo jonathanong/no-mistakes \
            --name pgo-train --dir "$RUNNER_TEMP/pgo-retry/train"
          test -s "$RUNNER_TEMP/pgo-retry/train/merged.profdata"
          test "$(git rev-parse HEAD)" = 8fdeedeaef6af73eb3d0bd2d1a5fc31604861f0e
          rustc -V | grep -F 'rustc 1.99.0 '
          test -s "$RUNNER_TEMP/pgo-retry/train/build-generate.time"
          test -s "$RUNNER_TEMP/pgo-retry/train/training-samples.json"
      - name: Build matched baseline and PGO, compare held-out checks
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/pgo-retry"
          mkdir -p "$base/result"
          rustc -Vv > "$base/result/rustc.txt"
          sha256sum "$base/train/merged.profdata" > "$base/result/profile-hash.txt"
          git rev-parse HEAD > "$base/result/source-commit.txt"
          python - <<'PY'
          from pathlib import Path
          manifest = Path('crates/no-mistakes/Cargo.toml')
          source = manifest.read_text()
          before = 'crate-type = ["rlib"]'
          assert source.count(before) == 1
          manifest.write_text(source.replace(before, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          export RUSTFLAGS="-D warnings"
          /usr/bin/time -v -o "$base/result/build-baseline.time" \
            env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
              --target aarch64-unknown-linux-gnu -p no-mistakes
          cp target/aarch64-unknown-linux-gnu/release/no-mistakes "$base/result/baseline"
          cp target/aarch64-unknown-linux-gnu/release/libno_mistakes.so "$base/result/baseline.node"
          rm -rf target
          export RUSTFLAGS="-D warnings -Cprofile-use=$base/train/merged.profdata"
          /usr/bin/time -v -o "$base/result/build-use.time" \
            env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
              --target aarch64-unknown-linux-gnu -p no-mistakes
          cp target/aarch64-unknown-linux-gnu/release/no-mistakes "$base/result/pgo"
          cp target/aarch64-unknown-linux-gnu/release/libno_mistakes.so "$base/result/pgo.node"
          sha256sum "$base/result"/{baseline,pgo,baseline.node,pgo.node} > "$base/result/hashes.txt"
          stat -c '%n %s' "$base/result"/{baseline,pgo,baseline.node,pgo.node} > "$base/result/sizes.txt"
          PGO_RESULT_DIR="$base/result" python .github/scripts/pgo-retry-experiment.py measure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pgo-use-only
          path: ${{ runner.temp }}/pgo-retry/result/
          if-no-files-found: warn
          retention-days: 3
