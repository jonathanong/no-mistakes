name: Current phase ARM merge-base main control

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: current-phase-main-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    name: Main merge-base jobs1 full config capacity control
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Checkout isolated harness
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact main merge-base of observable branch
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 22a294398a082d08a4167cb79d9499d37b70f7bb
          path: source
          persist-credentials: false
      - name: Update stable before validation and build
        timeout-minutes: 5
        run: rustup update stable && rustup default stable
      - name: Validate saved harness contracts
        timeout-minutes: 1
        run: python3 -B -m unittest discover -s harness/.github/scripts/current-arm -p 'test_*.py'
      - name: Build fresh exact main release CLI with bounded owned target
        timeout-minutes: 25
        run: python3 -B harness/.github/scripts/current-arm/control_build.py
      - name: Download exact installed physical consumer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12158768554
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: prepared
      - name: Restore unchanged original consumer
        timeout-minutes: 1
        run: tar -xzf prepared/fixture.tar.gz
      - name: Observe main control with 900 seconds without phase or work progress
        timeout-minutes: 31
        run: python3 -B harness/.github/scripts/current-arm/control.py
      - name: Retain exact binary provenance and raw capacity evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: current-phase-main-control-${{ github.run_id }}
          path: |
            out/
            results/
          if-no-files-found: error
          retention-days: 7
