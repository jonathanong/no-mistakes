name: Assignment receiver child2064 isolated complete-workload cohorts

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: mutable-root-B26-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-download:
    name: Trusted fixed native asset download only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch only the eight reviewed draft asset IDs
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          assert os.environ['APPROVED_SHA'] == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == 'jonathanong/no-mistakes'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-stage'
          out.mkdir(exist_ok=False)
          assets = [
              ('baseline-cli', 648319666, 82556240, '6b405f9f6509f760888160d2b6e296640142c7a9526185d14a2115090eb9272a'),
              ('baseline-addon.node', 648319902, 78991176, 'e50bc22dcd235b15bb2c688e0dc4240f8d732fe64226a125e3b62dc45ce37c1f'),
              ('baseline-probe', 648319664, 82843960, '16fb0d9ed103fe12f31de3d2567b6acfbb2a3bd5e3f6559ee9ff301000d0d784'),
              ('baseline-sql-probe', 648320405, 82680728, '27530d10e20a97adf6ac3bb41908afc7df330c6bb56b61b6c9c57cea055cc1fc'),
              ('candidate-cli', 648406363, 82716952, 'dda9d9a172f2bbf8e381381f1ed2e92f8999ac8abb4c462772da5da08b34e004'),
              ('candidate-addon.node', 648406370, 79153392, '8d692b54d6edaecf8fc36988652083a67d3d94525513630c54003edc9bf160f8'),
              ('candidate-probe', 648406371, 83004856, 'e4552c97ddf6bd6f45e15799b114bbeff8c05dd8240e2e7ed4db17b60ed01722'),
              ('candidate-sql-probe', 648422900, 82841480, '8c49e582fcfb8605cc93b1d9ee7556cd4fcc43f21b3a5e6e9c10cfbe403cc380'),
          ]
          proof = {'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflow_sha': os.environ['GITHUB_SHA'],
                   'producer': 'native-download', 'complete': False, 'assets': []}
          def save():
              (out / 'transport.json').write_text(json.dumps(proof, indent=2))
          save()
          for name, asset_id, size, digest in assets:
              path = out / name
              # Token remains on stdin to trusted curl; it never enters argv or the artifact.
              config = '\n'.join([
                  'url = "https://api.github.com/repos/jonathanong/no-mistakes/releases/assets/' + str(asset_id) + '"',
                  'header = "Accept: application/octet-stream"',
                  'header = "X-GitHub-Api-Version: 2022-11-28"',
                  'header = "Authorization: Bearer ' + os.environ['GH_TOKEN'] + '"',
                  'request = "GET"', 'location', 'fail-with-body', 'silent', 'show-error',
                  'connect-timeout = 15', 'max-time = 45',
              ])
              with path.open('wb') as binary, (out / (name + '.stderr')).open('wb') as error:
                  result = subprocess.run(['curl', '--config', '-'], input=config.encode(), stdout=binary,
                                          stderr=error, timeout=55, check=False)
              row = {'name': name, 'asset_id': asset_id, 'exit': result.returncode,
                     'bytes': path.stat().st_size, 'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest(),
                     'utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              proof['assets'].append(row)
              save()
              assert result.returncode == 0 and row['bytes'] == size and row['sha256'] == digest
          proof['complete'] = True
          save()
          PY
      - name: Retain verified transfer or partial download evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutable-root-B26-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Child2064 complete workload cohort (${{ matrix.cohort }})
    needs: native-download
    strategy:
      fail-fast: false
      matrix:
        cohort: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Receive verified same-run assets
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mutable-root-B26-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
      - name: Checkout reviewed diagnostic source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact published candidate API source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b0b7fccfba6e5f2bad0c6b2d38f02a88c69042aa
          path: candidate-source
          persist-credentials: false
      - name: Install the repository-pinned pnpm tool
        timeout-minutes: 2
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.24.0'
          package_json_file: candidate-source/package.json
          run_install: false
      - name: Install matching Node
        timeout-minutes: 1
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version: '26.11.1'
      - name: Install complete lockfile-pinned JS declaration prerequisites without scripts
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          COHORT: ${{ matrix.cohort }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/mutable-root-2064-isolated/dependency_setup.py "$COHORT"
      - name: Fresh controls and complete same-runner workload cohort
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.approved_sha }}
          COHORT: ${{ matrix.cohort }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$APPROVED_DIAGNOSTIC_COMMIT" = "$GITHUB_SHA"
          python3 .github/scripts/mutable-root-2064-isolated/hosted.py "$COHORT"
      - name: Pack all completed and partial raw evidence losslessly
        if: ${{ always() }}
        timeout-minutes: 2
        env:
          COHORT: ${{ matrix.cohort }}
          APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.approved_sha }}
        run: |
          python3 .github/scripts/mutable-root-2064-isolated/pack.py "$COHORT"
      - name: Retain portable cohort carrier
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: B26-cohort-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/B26-transport-${{ matrix.cohort }}/
          if-no-files-found: error
          retention-days: 30

  curate:
    name: Verify both complete cohorts and unchanged per-workload assessor
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed diagnostic source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download cohort A
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: B26-cohort-A-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/B26-incoming/cohort-A/
      - name: Download cohort B
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: B26-cohort-B-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/B26-incoming/cohort-B/
      - name: Verify complete schedule and assess each workload on its own runner
        timeout-minutes: 15
        env:
          APPROVED_DIAGNOSTIC_COMMIT: ${{ inputs.approved_sha }}
        run: python3 .github/scripts/mutable-root-2064-isolated/curate.py "$RUNNER_TEMP/B26-incoming" "$RUNNER_TEMP/B26-final"
      - name: Retain flat 704-row report, original analysis and all raw cohorts
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: B26-complete-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/B26-final/
          retention-days: 30
          if-no-files-found: error
