name: Parameter annotation isolated x86 measurement

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: parameter-cache-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-download:
    name: Trusted fixed native asset download only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch only the four reviewed draft asset IDs
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          assert os.environ['APPROVED_SHA'] == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == 'jonathanong/no-mistakes'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-stage'
          out.mkdir(exist_ok=False)
          assets = [
              ('baseline-cli', 648246434, 82354432, '4f68e778926ba7428d90299ab4f4914caed786b4b3f9909c92ed78a8c0fb5107'),
              ('baseline-addon.node', 648246432, 78789848, 'f7d3a9f6d735b7628d7c4a13500553b831ad09478072b9ab684e6af95de4ff6e'),
              ('candidate-cli', 648454710, 82354464, '6e97d8624bfc480c492215841def92d10fab0ed77fb317fffa3f8ea3f2a54380'),
              ('candidate-addon.node', 648454948, 78789784, '2f85b165c705d3e35ed59dd8093245fad243f7bb834b9f9a735a54a743d8d647'),
          ]
          proof = {'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflow_sha': os.environ['GITHUB_SHA'],
                   'producer': 'native-download', 'complete': False, 'assets': []}
          def save():
              (out / 'transport.json').write_text(json.dumps(proof, indent=2))
          save()
          for name, asset_id, size, digest in assets:
              path = out / name
              # Token remains on stdin to trusted curl; it never enters argv or the artifact.
              config = '\n'.join([
                  'url = "https://api.github.com/repos/jonathanong/no-mistakes/releases/assets/' + str(asset_id) + '"',
                  'header = "Accept: application/octet-stream"',
                  'header = "X-GitHub-Api-Version: 2022-11-28"',
                  'header = "Authorization: Bearer ' + os.environ['GH_TOKEN'] + '"',
                  'request = "GET"', 'location', 'fail-with-body', 'silent', 'show-error',
                  'connect-timeout = 15', 'max-time = 90',
              ])
              with path.open('wb') as binary, (out / (name + '.stderr')).open('wb') as error:
                  result = subprocess.run(['curl', '--config', '-'], input=config.encode(), stdout=binary,
                                          stderr=error, timeout=100, check=False)
              row = {'name': name, 'asset_id': asset_id, 'exit': result.returncode,
                     'bytes': path.stat().st_size, 'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest(),
                     'utc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              proof['assets'].append(row)
              save()
              assert result.returncode == 0 and row['bytes'] == size and row['sha256'] == digest
          proof['complete'] = True
          save()
          PY
      - name: Retain verified transfer or partial download evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parameter-cache-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Existing native pair on isolated Ubuntu x86
    needs: native-download
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Receive the verified same-run native transfer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: parameter-cache-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
      - name: Checkout reviewed diagnostic package
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact candidate input tree
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2ee8eabb7dbe2c4cd87f1cdc54b4cd4410584555
          path: candidate-source
          persist-credentials: false
      - name: Install matching Node runtime
        timeout-minutes: 1
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version: '26.11.1'
      - name: Validate source-only adapter tests
        timeout-minutes: 1
        run: python3 -m unittest discover -s .github/scripts/parameter-cache-isolated -p 'test_*.py'
      - name: Verify transferred pair, run controls and fixed measurement
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          python3 .github/scripts/parameter-cache-isolated/hosted.py
      - name: Retain all completed and partial evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parameter-cache-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parameter-cache-isolated/
          if-no-files-found: warn
          retention-days: 30
