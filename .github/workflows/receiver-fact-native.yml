name: Parameter annotation isolated x86 measurement

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: parameter-cache-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Existing native pair on isolated Ubuntu x86
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed diagnostic package
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact candidate input tree
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 099cfed26a23050aee6e9e8427af4de9b7eab4ef
          path: candidate-source
          persist-credentials: false
      - name: Install matching Node runtime
        timeout-minutes: 2
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version: '26.11.1'
      - name: Validate source-only adapter tests
        timeout-minutes: 1
        run: python3 -m unittest discover -s .github/scripts/parameter-cache-isolated -p 'test_*.py'
      - name: Verify transferred pair, run controls and fixed measurement
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          python3 .github/scripts/parameter-cache-isolated/hosted.py
      - name: Retain all completed and partial evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parameter-cache-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parameter-cache-isolated/
          if-no-files-found: warn
          retention-days: 30
