name: Build matched ARM inputs

on: workflow_call

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read
    name: Build ${{ matrix.role }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: base
            source: 8de12b05c425a45bbab806b140721e80db7e1bbb
          - role: verdicts
            source: ef45fdbffb7050b55677ca4d2b5b3b5e1e2b73ab
          - role: phases
            source: 956f213d635eb793fe61ac0d32822be08b37f205
    steps:
      - name: Checkout evaluation harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout immutable production source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - name: Install current stable compiler
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
      - name: Validate saved measurement fixtures
        timeout-minutes: 2
        working-directory: harness
        run: python3 -m unittest discover -s .github/scripts/matched-arm -p 'test_*.py'
      - name: Restore audited frozen production CLI
        if: ${{ matrix.role != 'verdicts' }}
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: matched-cli-${{ matrix.role }}
          run-id: 39185937985
          github-token: ${{ github.token }}
          path: frozen
      - name: Build verified production artifact
        timeout-minutes: 25
        env:
          BUILD_ROLE: ${{ matrix.role }}
        run: python3 harness/.github/scripts/matched-arm/build.py "$BUILD_ROLE"
      - name: Retain build outcome and source provenance
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matched-cli-${{ matrix.role }}
          path: out/${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 7

  fixture:
    name: Prepare pinned consumer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact public consumer
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: f38a048f5eeff0438fc59a15e9eb742def575a36
          path: fixture
          persist-credentials: false
      - name: Install consumer Node
        timeout-minutes: 3
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false
      - name: Install consumer pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json
      - name: Install frozen physical dependency tree
        timeout-minutes: 10
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn
      - name: Freeze installed consumer and its provenance
        timeout-minutes: 5
        run: python3 harness/.github/scripts/matched-arm/prepare.py
      - name: Retain identical installed fixture
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matched-consumer
          path: |
            fixture.tar.gz
            fixture-provenance.json
          compression-level: 0
          retention-days: 7
