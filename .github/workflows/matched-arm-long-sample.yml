name: One longer matched ARM observation block

on:
  workflow_call:
    inputs:
      case:
        required: true
        type: string
      jobs:
        required: true
        type: string
      diagnostics:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sample:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout temporary harness
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Download pinned base CLI
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12158853321
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: cli/matched-cli-base
      - name: Download pinned phase CLI
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12159575789
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: cli/matched-cli-phases
      - name: Download pinned verdict CLI
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12159229842
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: cli/matched-cli-verdicts
      - name: Download pinned installed consumer
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12158768554
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: prepared
      - name: Restore and verify immutable inputs
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tar -xzf prepared/fixture.tar.gz
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 harness/.github/scripts/matched-arm/long_frozen.py
      - name: Measure balanced BCCB with 3600-second collection caps
        timeout-minutes: 250
        env:
          CASE: ${{ inputs.case }}
          JOBS: ${{ inputs.jobs }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
          MATCHED_COLLECTION_CAP_SECONDS: '3600'
        run: python3 harness/.github/scripts/matched-arm/measure.py "$CASE" "$JOBS" "$DIAGNOSTICS" bccb
      - name: Retain raw outcomes including censored failures
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: long-${{ inputs.case }}-${{ inputs.jobs }}-${{ inputs.diagnostics }}
          path: results/
          if-no-files-found: error
          retention-days: 7
