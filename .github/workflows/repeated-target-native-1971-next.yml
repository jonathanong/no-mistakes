          path: /tmp/nm2019-arm2019/transfer/${{ matrix.arm }}
          retention-days: 3
          if-no-files-found: error
      - name: Retain actual command evidence even on failure
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ github.run_id }}-${{ github.job }}-${{ matrix.arm }}
          path: |
