name: Temporary same-runner native CPU experiment

on:
  push:
    branches:
      - codex/native-cpu-20261012
    paths:
      - .github/workflows/native-cpu-experiment.yml
      - .github/scripts/native-cpu-experiment.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Build generic and native CLI plus addon on this runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/no-mistakes/Cargo.toml')
          source = path.read_text()
          before = 'crate-type = ["rlib"]'
          assert source.count(before) == 1
          path.write_text(source.replace(before, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          mkdir -p "$RUNNER_TEMP/native-cpu"
          rustc -Vv > "$RUNNER_TEMP/native-cpu/rustc.txt"
          lscpu > "$RUNNER_TEMP/native-cpu/cpu.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-cpu/source-commit.txt"
          rustc --print cfg --target aarch64-unknown-linux-gnu > "$RUNNER_TEMP/native-cpu/generic-cfg.txt"
          rustc --print cfg --target aarch64-unknown-linux-gnu -C target-cpu=native > "$RUNNER_TEMP/native-cpu/native-cfg.txt"
          for variant in generic native; do
            case "$variant" in
              generic) export RUSTFLAGS='-D warnings' ;;
              native) export RUSTFLAGS='-D warnings -C target-cpu=native' ;;
            esac
            /usr/bin/time -v -o "$RUNNER_TEMP/native-cpu/$variant-build.time" \
              env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
                --target aarch64-unknown-linux-gnu -p no-mistakes
            binary=target/aarch64-unknown-linux-gnu/release/no-mistakes
            addon=target/aarch64-unknown-linux-gnu/release/libno_mistakes.so
            test -s "$binary" && test -s "$addon"
            cp "$binary" "$RUNNER_TEMP/native-cpu/$variant"
            cp "$addon" "$RUNNER_TEMP/native-cpu/$variant.node"
            sha256sum "$RUNNER_TEMP/native-cpu/$variant" "$RUNNER_TEMP/native-cpu/$variant.node" \
              > "$RUNNER_TEMP/native-cpu/$variant-hashes.txt"
            stat -c '%n %s' "$RUNNER_TEMP/native-cpu/$variant" "$RUNNER_TEMP/native-cpu/$variant.node" \
              > "$RUNNER_TEMP/native-cpu/$variant-sizes.txt"
            du -sh target > "$RUNNER_TEMP/native-cpu/$variant-target-size.txt"
            rm -rf target
          done
          unset RUSTFLAGS
          git restore -- crates/no-mistakes/Cargo.toml
          git diff --exit-code HEAD
      - name: Run balanced same-host CLI and Node API checks
        run: python .github/scripts/native-cpu-experiment.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-cpu-results
          path: ${{ runner.temp }}/native-cpu/
          retention-days: 3
