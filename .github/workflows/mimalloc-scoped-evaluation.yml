name: Scoped mimalloc resources

on:
  push:
    branches: [eval/2200-scoped-resources]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mimalloc-scoped-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-tests:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Check supplemental scope guards
        timeout-minutes: 2
        run: |
          python3 scripts/performance/mimalloc-scoped-tests.py
          python3 scripts/performance/mimalloc-sampler-tests.py
  build:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-build.yml
  measure:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Download verified native allocator pair
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mimalloc-${{ matrix.target }}-*
          path: binaries
      - name: Download reviewed installed consumer
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: 12158768554
          run-id: 39189171362
          github-token: ${{ github.token }}
          path: prepared
      - name: Verify immutable consumer origin and unpack it
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jonathanong/no-mistakes/actions/artifacts/12158768554 > prepared/artifact-origin.json
          python3 scripts/performance/mimalloc-scoped-origin.py prepared/artifact-origin.json
          tar -xzf prepared/fixture.tar.gz
      - name: Install configuration validation dependency
        timeout-minutes: 3
        run: python3 -m pip install --disable-pip-version-check --break-system-packages PyYAML==6.0.3
      - name: Measure both scopes and all worker counts on this host
        timeout-minutes: 145
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          SOURCE: ${{ github.sha }}
          HOST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/mimalloc-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          python3 scripts/performance/mimalloc-scoped-measure.py \
            --system "$PWD/binaries/mimalloc-$TARGET-system/no-mistakes" \
            --mimalloc "$PWD/binaries/mimalloc-$TARGET-mimalloc/no-mistakes" \
            --consumer "$PWD/fixture" --output "$PWD/scoped-results" \
            --source "$SOURCE" --platform "$PLATFORM" --host-id "$HOST_ID"
      - name: Preserve raw observations and input identities
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mimalloc-scoped-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            scoped-results/
            prepared/artifact-origin.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
