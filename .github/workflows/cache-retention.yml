name: Cache retention

on:
  workflow_run:
    workflows: [Test CI]
    branches: [main]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
  workflow_call:
    inputs:
      best_effort:
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  retain:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.repository.full_name == github.repository) ||
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           github.event.repository.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted retention policy
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/cache-retention.cjs
          sparse-checkout-cone-mode: false
      - name: Install the Node runtime
        timeout-minutes: 3
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.24.0
          runtime: node@24
          cache: false
          install: false
      - name: Retain current caches and report storage headroom
        continue-on-error: ${{ inputs.best_effort || false }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cache-retention.cjs --apply
