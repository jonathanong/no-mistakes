  publish-cargo:
    name: Publish Cargo crates
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Publish Cargo crates
        timeout-minutes: 10
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          pkgs=()
          if [ -d crates/no-mistakes-invocation ]; then
            pkgs+=(no-mistakes-invocation)
          fi
          if [ -d crates/no-mistakes-postgres-sql ]; then
            pkgs+=(no-mistakes-postgres-sql)
          fi
          if [ -d crates/no-mistakes-ts-facts ]; then
            pkgs+=(no-mistakes-ts-facts)
          fi
          if [ -d crates/no-mistakes-rule-kernel ]; then
            pkgs+=(no-mistakes-rule-kernel)
          fi
          pkgs+=(no-mistakes)
          for pkg in "${pkgs[@]}"; do
            if curl --fail --silent --output /dev/null "https://crates.io/api/v1/crates/$pkg/$version"; then
              echo "$pkg $version is already published on crates.io; skipping"
            else
              publish_log="$RUNNER_TEMP/cargo-publish-$pkg.log"
              if cargo publish --locked -p "$pkg" 2>&1 | tee "$publish_log"; then
                :
              elif grep -q "already exists on crates.io index" "$publish_log"; then
                echo "$pkg $version is already published on crates.io; skipping"
              else
                exit 1
              fi
            fi
          done

  publish-github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - validate
      - build-native-linux-x64
      - build-native-linux-arm
      - build-native-darwin
      - build-native-windows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Download CLI release assets
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-cli-*
          path: dist
          merge-multiple: true

      - name: Download N-API release assets
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-napi-*
          path: dist
          merge-multiple: true

      - name: Create release app token
        id: release-app-token
        timeout-minutes: 2
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create GitHub release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v$version"
          missing=0
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            case "$target" in
              *windows*) bin_ext=".exe" ;;
              *) bin_ext="" ;;
            esac
            for asset in \
              "dist/no-mistakes-v${version}-${target}${bin_ext}" \
              "dist/no-mistakes-v${version}-${target}${bin_ext}.sha256" \
              "dist/no-mistakes-napi-v${version}-${target}.node"
            do
              if [ ! -f "$asset" ]; then
                echo "::error::missing GitHub release asset $asset"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

