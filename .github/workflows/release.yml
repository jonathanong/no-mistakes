name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      resume_version:
        description: Existing tagged SemVer version to rebuild and publish without another bump
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.bump.outputs.release-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check RELEASE_TOKEN is set
        timeout-minutes: 1
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. This workflow requires a PAT that can push release commits and tags to main." >&2
            exit 1
          fi

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Configure git
        timeout-minutes: 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit
        id: bump
        timeout-minutes: 2
        shell: bash
        env:
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          resume_version="$RESUME_VERSION"
          if [ -n "$resume_version" ]; then
            node - "$resume_version" <<'NODE'
            const version = process.argv[2];
            const semver = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!semver.test(version)) {
              console.error(`::error::resume_version must be a strict SemVer version, received ${JSON.stringify(version)}`);
              process.exit(1);
            }
          NODE

            tag="v$resume_version"
            if ! git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
              echo "::error::Release tag $tag does not exist." >&2
              exit 1
            fi
            release_sha="$(git rev-list -n 1 "$tag")"
            tag_version="$(git show "$release_sha:package.json" | node -e 'let source = ""; process.stdin.on("data", (chunk) => { source += chunk; }); process.stdin.on("end", () => { process.stdout.write(JSON.parse(source).version); });')"
            if [ "$tag_version" != "$resume_version" ]; then
              echo "::error::Release tag $tag contains package.json version $tag_version, expected $resume_version." >&2
              exit 1
            fi
            echo "Resuming release for $tag at $release_sha"
            echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "version=$resume_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm version "${{ inputs.bump }}" --recursive --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          node packages/no-mistakes/scripts/sync-native-package-versions.js "$version"
          pnpm install --lockfile-only --ignore-scripts

          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const version = process.argv[2];
          const crates = [
            "Cargo.toml",
            "crates/no-mistakes/Cargo.toml",
          ];
          for (const file of crates) {
            if (!fs.existsSync(file)) continue;
            const cargo = fs.readFileSync(file, "utf8").replace(
              /^version = ".*"$/m,
              `version = "${version}"`,
            );
            fs.writeFileSync(file, cargo);
          }
          NODE

          cargo update -w
          git add .
          git commit -m "chore(release): v$version" -m "Co-authored-by: Codex <noreply@openai.com>"
          if ! git pull --rebase origin main; then
            git rebase --abort >/dev/null 2>&1 || true
            echo "::error::Could not rebase the release commit onto current main. Re-run the release workflow from current main." >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          git tag -a "v$version" -m "v$version"
          if ! git push --atomic origin HEAD:main "v$version"; then
            echo "::error::main moved while the release commit was being prepared. Re-run the release workflow from current main." >&2
            exit 1
          fi
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create prepared release source
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "${{ steps.bump.outputs.release-sha }}" | gzip > "$RUNNER_TEMP/release-source.tgz"

      - name: Upload prepared source
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source.tgz
          if-no-files-found: error

  validate:
    name: Validate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Reclaim runner disk space
        timeout-minutes: 10
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
          tools-cache: false

      - name: Download prepared source
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: prepared-release

      - name: Extract prepared source
        timeout-minutes: 2
        run: tar -xzf prepared-release/release-source.tgz

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: v1-rust-release
          cache-bin: "false"

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify versions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.version }}"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          node - "$tag" "$RUNNER_TEMP/cargo-metadata.json" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const metadata = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const mismatches = metadata.packages
            .filter((pkg) => pkg.version !== expected)
            .map((pkg) => `${pkg.name}@${pkg.version}`);
          if (mismatches.length > 0) {
            console.error(`Cargo version mismatch: ${mismatches.join(", ")}`);
            process.exit(1);
          }
          NODE
          node - "$tag" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const expected = process.argv[2];
          const files = [
            "package.json",
            ...fs.readdirSync("packages")
              .map((name) => path.join("packages", name, "package.json"))
              .filter((file) => fs.existsSync(file)),
          ];
          const mismatches = files
            .map((file) => [file, JSON.parse(fs.readFileSync(file, "utf8")).version])
            .filter(([, version]) => version !== expected)
            .map(([file, version]) => `${file}@${version}`);
          if (mismatches.length > 0) {
            console.error(`package version mismatch: ${mismatches.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      - name: Check JavaScript formatting
        timeout-minutes: 2
        run: pnpm run fmt:js:check

      - name: Run Clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Oxlint
        timeout-minutes: 2
        run: pnpm run lint:js

      - name: Run CSpell
        timeout-minutes: 5
        run: pnpm run lint:spell

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Run Rust tests
        timeout-minutes: 15
        run: cargo test --all-features

      - name: Run JavaScript tests
        timeout-minutes: 5
        run: pnpm test

      - name: Check Cargo packages
        timeout-minutes: 10
        run: cargo publish --dry-run --locked -p no-mistakes

      # rust-cache's post step walks `target/package/**/tests/{target,trybuild}`.
      # Those dirs are absent from the packaged crate, and Node's ENOENT
      # (`Error: ENOENT: …, opendir '…'`) becomes a GitHub error annotation
      # even though the Validate job succeeded.
      - name: Drop cargo package verification tree
        if: always()
        timeout-minutes: 1
        run: rm -rf target/package

      - name: Check npm packages
        timeout-minutes: 2
        run: |
          for pkg in no-mistakes eslint-plugin-no-mistakes; do
            pnpm --filter "$pkg" pack --dry-run
          done

  build-cli:
    name: Build CLI for ${{ matrix.target }}
    needs:
      - prepare
      - validate
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - name: Download prepared source
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-source
          path: prepared-release

      - name: Extract prepared source
        timeout-minutes: 2
        run: tar -xzf prepared-release/release-source.tgz

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: v1-rust-release
          shared-key: release-${{ matrix.target }}
          cache-bin: "false"

      - name: Build CLI
        timeout-minutes: 45
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p no-mistakes

      - name: Stage assets
        timeout-minutes: 2
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*)
              bin_ext=".exe"
              ;;
            *apple-darwin*)
              bin_ext=""
              ;;
            *)
              bin_ext=""
              ;;
          esac
          mkdir -p release-assets
          binary_source="target/${{ matrix.target }}/release/no-mistakes$bin_ext"
          binary_artifact="release-assets/no-mistakes-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}$bin_ext"
          "$binary_source" --version
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) expected_magic='Mach-O.*arm64' ;;
            aarch64-unknown-linux-gnu) expected_magic='ELF 64-bit.*ARM aarch64' ;;
            x86_64-unknown-linux-gnu) expected_magic='ELF 64-bit.*x86-64' ;;
            x86_64-pc-windows-msvc) expected_magic='PE32\+.*x86-64' ;;
            *) echo "::error::Unknown target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          file "$binary_source" | grep -E "$expected_magic"
          cp "$binary_source" "$binary_artifact"
          test -x "$binary_artifact" || [[ "$binary_artifact" == *.exe ]]

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 2
        shell: bash
        working-directory: release-assets
        run: |
          for artifact in *; do
            [[ "$artifact" == *.sha256 ]] && continue
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        working-directory: release-assets
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -notlike "*.sha256" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.Name).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.Name).sha256"
          }

      - name: Upload asset artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cli-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  build-napi:
    name: Build N-API for ${{ matrix.target }}
    needs:
      - prepare
      - validate
      - build-cli
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            aarch64-apple-darwin,
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-pc-windows-msvc,
          ]
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        timeout-minutes: 5
        with: { name: release-source, path: prepared-release }
      - run: tar -xzf prepared-release/release-source.tgz
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        timeout-minutes: 5
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          prefix-key: v1-rust-release
          shared-key: release-${{ matrix.target }}
          cache-bin: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        timeout-minutes: 5
        with: { node-version: 24 }
      - name: Build N-API addon
        timeout-minutes: 25
        shell: bash
        run: |
          NO_MISTAKES_BUILD_NAPI=1 cargo rustc --release --locked --target ${{ matrix.target }} -p no-mistakes --lib --crate-type cdylib
          case "${{ matrix.target }}" in
            *windows*) pattern='no_mistakes*.dll' ;;
            *apple*) pattern='libno_mistakes*.dylib' ;;
            *) pattern='libno_mistakes*.so' ;;
          esac
          addons=()
          while IFS= read -r addon; do
            addons+=("$addon")
          done < <(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -name "$pattern")
          if [ "${#addons[@]}" -eq 0 ]; then
            while IFS= read -r addon; do
              addons+=("$addon")
            done < <(find "target/${{ matrix.target }}/release/deps" -maxdepth 1 -type f -name "$pattern")
          fi
          test "${#addons[@]}" -eq 1 || { echo "::error::Expected exactly one N-API addon candidate for ${{ matrix.target }}, found ${#addons[@]}" >&2; printf '%s\n' "${addons[@]}" >&2; exit 1; }
          addon="${addons[0]}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) expected_magic='Mach-O.*arm64' ;;
            aarch64-unknown-linux-gnu) expected_magic='ELF 64-bit.*ARM aarch64' ;;
            x86_64-unknown-linux-gnu) expected_magic='ELF 64-bit.*x86-64' ;;
            x86_64-pc-windows-msvc) expected_magic='PE32\+.*x86-64' ;;
            *) echo "::error::Unknown target ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          file "$addon" | grep -E "$expected_magic"
          addon_artifact="no-mistakes-napi-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}.node"
          cp "$addon" "$addon_artifact"
          node -e '(async () => { const addon=require(process.argv[1]); if (typeof addon.version !== "function" || await addon.version() !== process.argv[2]) process.exit(1) })().catch((error) => { console.error(error); process.exit(1) })' "$PWD/$addon_artifact" "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 5
        with:
          name: release-napi-${{ matrix.target }}
          path: no-mistakes-napi-*.node
          if-no-files-found: error

  publish:
    name: Publish
    needs:
      - prepare
      - validate
      - build-cli
      - build-napi
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release-sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Publish Cargo crates
        timeout-minutes: 10
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for pkg in no-mistakes; do
            if curl --fail --silent --output /dev/null "https://crates.io/api/v1/crates/$pkg/$version"; then
              echo "$pkg $version is already published on crates.io; skipping"
            else
              publish_log="$RUNNER_TEMP/cargo-publish-$pkg.log"
              cargo publish --dry-run --locked -p "$pkg"
              if cargo publish --locked -p "$pkg" 2>&1 | tee "$publish_log"; then
                :
              elif grep -q "already exists on crates.io index" "$publish_log"; then
                echo "$pkg $version is already published on crates.io; skipping"
              else
                exit 1
              fi
            fi
          done

      - name: Download CLI release assets
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-cli-*
          path: dist
          merge-multiple: true

      - name: Download N-API release assets
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-napi-*
          path: dist
          merge-multiple: true

      - name: Stage platform packages
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for entry in \
            'no-mistakes-darwin-arm64 aarch64-apple-darwin' \
            'no-mistakes-linux-arm64-gnu aarch64-unknown-linux-gnu' \
            'no-mistakes-linux-x64-gnu x86_64-unknown-linux-gnu' \
            'no-mistakes-win32-x64-msvc x86_64-pc-windows-msvc'
          do
            read -r package target <<<"$entry"
            extension=""
            runtime="linux"
            if [[ "$target" == *windows* ]]; then extension=".exe"; runtime="win32"; fi
            [[ "$target" == *apple-darwin* ]] && runtime="darwin"
            node packages/no-mistakes/scripts/stage-native.js \
              --package "$package" \
              --binary "dist/no-mistakes-v$version-$target$extension" \
              --addon "dist/no-mistakes-napi-v$version-$target.node" \
              --platform "$runtime"
            pnpm --filter "$package" pack --dry-run
          done

      - name: Create GitHub release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      - name: Publish npm platform packages with OIDC
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          wait_script="packages/no-mistakes/scripts/wait-npm-tarball.js"
          for pkg in \
            no-mistakes-darwin-arm64 \
            no-mistakes-linux-arm64-gnu \
            no-mistakes-linux-x64-gnu \
            no-mistakes-win32-x64-msvc
          do
            if node "$wait_script" --package "$pkg" --version "$version" --timeout-ms 0 >/dev/null 2>&1; then
              echo "$pkg $version tarball is already fetchable; skipping publish"
              continue
            fi
            if pnpm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg $version metadata exists without a fetchable tarball; waiting"
            else
              npm publish "./packages/$pkg" --provenance --access public
            fi
            node "$wait_script" --package "$pkg" --version "$version"
          done

  verify-npm-platform:
    name: Verify npm ${{ matrix.package }}
    needs:
      - prepare
      - publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, package: no-mistakes-darwin-arm64 }
          - { os: ubuntu-22.04, package: no-mistakes-linux-x64-gnu }
          - { os: ubuntu-22.04-arm, package: no-mistakes-linux-arm64-gnu }
          - { os: windows-2025, package: no-mistakes-win32-x64-msvc }
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Install and load published native package
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          pkg="${{ matrix.package }}"
          node packages/no-mistakes/scripts/wait-npm-tarball.js --package "$pkg" --version "$version"
          work="$RUNNER_TEMP/npm-platform-smoke"
          mkdir -p "$work"
          cd "$work"
          npm install --omit=dev --no-fund --no-audit "$pkg@$version"
          node "$GITHUB_WORKSPACE/packages/no-mistakes/scripts/smoke-published-native.js" \
            --package "$pkg" \
            --version "$version"

  publish-js:
    name: Publish JS packages
    needs:
      - prepare
      - verify-npm-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.release-sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Publish npm JS packages with OIDC
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          wait_script="packages/no-mistakes/scripts/wait-npm-tarball.js"
          for pkg in \
            no-mistakes \
            eslint-plugin-no-mistakes
          do
            if node "$wait_script" --package "$pkg" --version "$version" --timeout-ms 0 >/dev/null 2>&1; then
              echo "$pkg $version tarball is already fetchable; skipping publish"
              continue
            fi
            if pnpm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg $version metadata exists without a fetchable tarball; waiting"
            else
              npm publish "./packages/$pkg" --provenance --access public
            fi
            node "$wait_script" --package "$pkg" --version "$version"
          done

  verify-npm-root:
    name: Verify npm no-mistakes (${{ matrix.os }})
    needs:
      - prepare
      - publish-js
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-2025
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Install and load published no-mistakes
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          node packages/no-mistakes/scripts/wait-npm-tarball.js --package no-mistakes --version "$version"
          work="$RUNNER_TEMP/npm-root-smoke"
          mkdir -p "$work"
          cd "$work"
          npm install --omit=dev --no-fund --no-audit "no-mistakes@$version"
          node "$GITHUB_WORKSPACE/packages/no-mistakes/scripts/smoke-published-native.js" \
            --package no-mistakes \
            --version "$version"

