          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: &verify-npm-install-node-js
          node-version: 24

      - &verify-npm-install-and-load-published-package
        name: Install and load published package
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          node packages/no-mistakes/scripts/wait-npm-tarball.js --package "$NM_PACKAGE" --version "$version"
          work="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$work"
          cd "$work"
          npm install --omit=dev --no-fund --no-audit "$NM_PACKAGE@$version"
          node "$GITHUB_WORKSPACE/packages/no-mistakes/scripts/smoke-published-native.js" \
            --package "$NM_PACKAGE" \
            --version "$version"

  verify-npm-linux-arm:
    name: Verify npm no-mistakes-linux-arm64-gnu
    needs:
      - prepare
      - publish-native-linux-arm
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes-linux-arm64-gnu
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  verify-npm-darwin:
    name: Verify npm no-mistakes-darwin-arm64
    needs:
      - prepare
      - publish-native-darwin
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes-darwin-arm64
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  verify-npm-windows:
    name: Verify npm no-mistakes-win32-x64-msvc
    needs:
      - prepare
      - publish-native-windows
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes-win32-x64-msvc
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  publish-js:
    name: Publish root npm package
    # latest must not move until every platform package has been installed.
    needs:
      - prepare
      - verify-npm-darwin
      - verify-npm-linux-x64
      - verify-npm-linux-arm
      - verify-npm-windows
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Checkout publish tooling
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: publish-tools
          persist-credentials: false
          fetch-depth: 1

      - name: Isolate publish tooling
        timeout-minutes: 1
        run: mv -- publish-tools "$RUNNER_TEMP/publish-tools"

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Publish npm JS packages with OIDC
        timeout-minutes: 70
        shell: bash
        run: bash "$RUNNER_TEMP/publish-tools/.github/scripts/publish-one-npm.sh" "${{ needs.prepare.outputs.version }}" no-mistakes

  # Linux and Windows root checks gate the ESLint publish. The macOS check
  # still runs and still fails the release through release-complete.

  verify-npm-root-linux-x64:
    name: Verify npm no-mistakes (ubuntu-22.04)
    needs:
      - prepare
      - publish-js
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  verify-npm-root-linux-arm:
    name: Verify npm no-mistakes (ubuntu-22.04-arm)
    needs:
      - prepare
      - publish-js
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  verify-npm-root-windows:
    name: Verify npm no-mistakes (windows-2025)
    needs:
      - prepare
      - publish-js
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  verify-npm-root-darwin:
    name: Verify npm no-mistakes (macos-15)
    # Does not gate publish-eslint. release-complete still requires this job.
    needs:
      - prepare
      - publish-js
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NM_PACKAGE: no-mistakes
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *verify-npm-checkout-release-commit

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: *verify-npm-install-node-js

      - *verify-npm-install-and-load-published-package

  publish-eslint:
    name: Publish ESLint package
    needs:
      - prepare
      - verify-npm-root-linux-x64
      - verify-npm-root-linux-arm
      - verify-npm-root-windows
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release-sha }}

      - name: Checkout publish tooling
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: publish-tools
          persist-credentials: false
          fetch-depth: 1

      - name: Isolate publish tooling
        timeout-minutes: 1
        run: mv -- publish-tools "$RUNNER_TEMP/publish-tools"

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Publish ESLint package with OIDC
        timeout-minutes: 70
        shell: bash
        run: bash "$RUNNER_TEMP/publish-tools/.github/scripts/publish-one-npm.sh" "${{ needs.prepare.outputs.version }}" eslint-plugin-no-mistakes

  release-complete:
    name: Release complete
    needs:
      - publish-eslint
      - verify-npm-root-darwin
      - publish-cargo
      - publish-github-release
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every release channel
        timeout-minutes: 1
        env:
          ESLINT_RESULT: ${{ needs.publish-eslint.result }}
          MACOS_RESULT: ${{ needs.verify-npm-root-darwin.result }}
          CARGO_RESULT: ${{ needs.publish-cargo.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.publish-github-release.result }}
        run: |
          test "$ESLINT_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$CARGO_RESULT" = success
          test "$GITHUB_RELEASE_RESULT" = success
