name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      resume_version:
        description: Existing tagged SemVer version to rebuild and publish without another bump
        type: string
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Quote "no": a bare YAML no is a boolean. Release reruns the snapshot tests.
  INSTA_UPDATE: "no"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.bump.outputs.release-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Create release app token
        id: release-app-token
        timeout-minutes: 2
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Configure git
        timeout-minutes: 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit
        id: bump
        timeout-minutes: 2
        shell: bash
        env:
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          set -euo pipefail
          resume_version="$RESUME_VERSION"
          if [ -n "$resume_version" ]; then
            node - "$resume_version" <<'NODE'
            const version = process.argv[2];
            const semver = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!semver.test(version)) {
              console.error(`::error::resume_version must be a strict SemVer version, received ${JSON.stringify(version)}`);
              process.exit(1);
            }
          NODE

            tag="v$resume_version"
            if ! git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
              echo "::error::Release tag $tag does not exist." >&2
              exit 1
            fi
            release_sha="$(git rev-list -n 1 "$tag")"
            tag_version="$(git show "$release_sha:package.json" | node -e 'let source = ""; process.stdin.on("data", (chunk) => { source += chunk; }); process.stdin.on("end", () => { process.stdout.write(JSON.parse(source).version); });')"
            if [ "$tag_version" != "$resume_version" ]; then
              echo "::error::Release tag $tag contains package.json version $tag_version, expected $resume_version." >&2
              exit 1
            fi
            echo "Resuming release for $tag at $release_sha"
            echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "version=$resume_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm version "${{ inputs.bump }}" --recursive --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          node packages/no-mistakes/scripts/sync-native-package-versions.js "$version"
          pnpm install --lockfile-only --ignore-scripts

          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const version = process.argv[2];
          const file = "Cargo.toml";
          const original = fs.readFileSync(file, "utf8");
          let updated = original.replace(
            /(\[workspace\.package\][\s\S]*?^version = ")[^"]+(")/m,
            `$1${version}$2`,
          );
          updated = updated.replace(
            /(no-mistakes-[a-z0-9-]+\s*=\s*\{\s*version\s*=\s*"=)[^"]+("\s*,\s*path\s*=\s*"crates\/[^"]+"\s*\})/g,
            `$1${version}$2`,
          );
          if (updated === original) {
            throw new Error(`failed to bump workspace version to ${version} in ${file}`);
          }
          fs.writeFileSync(file, updated);
          NODE

          cargo update -w
          git add .
          git commit -m "chore(release): v$version" -m "Co-authored-by: Codex <noreply@openai.com>"
          if ! git pull --rebase origin main; then
            git rebase --abort >/dev/null 2>&1 || true
            echo "::error::Could not rebase the release commit onto current main. Re-run the release workflow from current main." >&2
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          git tag -a "v$version" -m "v$version"
          bash .github/scripts/release-push.sh "$version"
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create prepared release source
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "${{ steps.bump.outputs.release-sha }}" | gzip > "$RUNNER_TEMP/release-source.tgz"

      - name: Upload prepared source
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source.tgz
          if-no-files-found: error

  validate-rust:
    name: Validate Rust
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
      RUST_TEST_THREADS: "4"
      RAYON_NUM_THREADS: "1"
      # Resumed tags may predate the workspace profile defaults.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    permissions:
      contents: read
    steps:
      - name: Reclaim runner disk space
        timeout-minutes: 10
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false
          tools-cache: false

      - name: Download prepared source
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source
          path: prepared-release

      - name: Extract prepared source
        timeout-minutes: 2
        run: tar -xzf prepared-release/release-source.tgz

      # Validation tools belong to the running workflow, even when the release
      # source is an older tag. Never overlay current Rust source onto that tag.
      - name: Checkout validation tooling
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: validation-tools
          persist-credentials: false
          fetch-depth: 1

      # Source-wide checks must see only the tagged source, not a second checkout.
      - name: Isolate validation tooling
        timeout-minutes: 1
        run: mv -- validation-tools "$RUNNER_TEMP/validation-tools"

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          prefix-key: v1-rust-release
          shared-key: validate
          cache-bin: "false"

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify versions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.version }}"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          node - "$tag" "$RUNNER_TEMP/cargo-metadata.json" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const metadata = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const mismatches = metadata.packages
            .filter((pkg) => pkg.version !== expected)
            .map((pkg) => `${pkg.name}@${pkg.version}`);
          if (mismatches.length > 0) {
            console.error(`Cargo version mismatch: ${mismatches.join(", ")}`);
            process.exit(1);
          }
          NODE
          node - "$tag" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const expected = process.argv[2];
          const files = [
            "package.json",
            ...fs.readdirSync("packages")
              .map((name) => path.join("packages", name, "package.json"))
              .filter((file) => fs.existsSync(file)),
            "plugins/no-mistakes/.claude-plugin/plugin.json",
            "plugins/no-mistakes/.codex-plugin/plugin.json",
            "plugins/no-mistakes-rules/.claude-plugin/plugin.json",
            "plugins/no-mistakes-rules/.codex-plugin/plugin.json",
          ];
          const mismatches = files
            .map((file) => [file, JSON.parse(fs.readFileSync(file, "utf8")).version])
            .filter(([, version]) => version !== expected)
            .map(([file, version]) => `${file}@${version}`);
          if (mismatches.length > 0) {
            console.error(`package version mismatch: ${mismatches.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Check Rust validation parity
        timeout-minutes: 2
        run: node --test "$RUNNER_TEMP/validation-tools/.github/scripts/rust-validation.test.cjs"

      - name: Test Rust resource sampler
        timeout-minutes: 2
        run: node --test "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.test.cjs"

      - name: Record Rust resource budget
        timeout-minutes: 1
        shell: bash
        run: |
          printf 'Rust validation: cargo_jobs=%s test_threads=%s rayon_threads=%s incremental=%s dev_debug=%s test_debug=%s\n' "$CARGO_BUILD_JOBS" "$RUST_TEST_THREADS" "$RAYON_NUM_THREADS" "$CARGO_INCREMENTAL" "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG"
          printf 'Rust codegen: dev_units=%s test_units=%s\n' "$CARGO_PROFILE_DEV_CODEGEN_UNITS" "$CARGO_PROFILE_TEST_CODEGEN_UNITS"
          printf 'RUSTFLAGS=%s\n' "$RUSTFLAGS"
          rustc -vV
          free -m

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      - name: Test Rust disk diagnostics
        timeout-minutes: 2
        run: node --test "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.test.cjs" "$RUNNER_TEMP/validation-tools/.github/scripts/drop-rust-test-executables.test.cjs"

      - name: Record Rust disk usage before Clippy
        timeout-minutes: 1
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" "before Clippy"

      - name: Run Clippy
        timeout-minutes: 18
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Record Rust disk usage after Clippy
        timeout-minutes: 1
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" "after Clippy"

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres

      # Build and run separately, like CI: compiling alone takes most of a combined budget.
      - name: Record Rust disk usage before test build
        timeout-minutes: 1
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" "before Rust test build"

      - name: Build Rust tests
        timeout-minutes: 65
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-validation.sh" build

      - name: Record Rust disk usage after test build
        timeout-minutes: 1
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" "after Rust test build"

      - name: Run Rust tests (unit)
        timeout-minutes: 15
        env:
          RUST_VALIDATION_REFERENCES_FILE: ${{ runner.temp }}/release-rust-snapshot-references.txt
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-validation.sh" test-unit

      - name: Run Rust tests (integration)
        timeout-minutes: 15
        env:
          RUST_VALIDATION_REFERENCES_FILE: ${{ runner.temp }}/release-rust-snapshot-references.txt
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-validation.sh" test-integration

      - name: Run Rust doctests
        timeout-minutes: 5
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-validation.sh" doc

      # Test executables retain code even with debugger symbols disabled;
      # reclaim their disk space before package verification builds. They are not reused after the tests ran, and rust-cache never
      # saves workspace artifacts, so drop them before packaging.
      - name: Drop Rust test executables
        timeout-minutes: 2
        run: |
          df -h /
          bash "$RUNNER_TEMP/validation-tools/.github/scripts/drop-rust-test-executables.sh" target
          df -h /

      - name: Check Cargo packages
        timeout-minutes: 10
        run: bash "$RUNNER_TEMP/validation-tools/.github/scripts/with-resource-samples.sh" cargo publish --dry-run --locked --workspace

      # rust-cache's post step walks `target/package/**/tests/{target,trybuild}`.
      # Those dirs are absent from the packaged crate, and Node's ENOENT
      # (`Error: ENOENT: …, opendir '…'`) becomes a GitHub error annotation
      # even though the Validate job succeeded.
      - name: Drop cargo package verification tree
        if: always()
        timeout-minutes: 1
        run: rm -rf target/package

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: |
          if [ -f "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" ]; then
            bash "$RUNNER_TEMP/validation-tools/.github/scripts/rust-disk-usage.sh" "Rust validation failure"
          else
            df -h .
          fi

  validate-js:
    name: Validate JavaScript
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download prepared source
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-source
          path: prepared-release

      - name: Extract prepared source
        timeout-minutes: 2
        run: tar -xzf prepared-release/release-source.tgz

      - name: Restore a source repository for archive-based tests
        timeout-minutes: 2
        # The prepared source is a `git archive` with no .git. The async
        # source-proof benchmark test archives HEAD, so commit the extracted
        # tree before dependencies are installed.
        run: |
          git init -q
          git add -A -- . ":!prepared-release"
          git -c user.name=release -c user.email=release@localhost commit -q -m "release source"

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        timeout-minutes: 2
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Check JavaScript formatting
        timeout-minutes: 2
        run: pnpm run fmt:js:check

      - name: Run Oxlint
        timeout-minutes: 2
        run: pnpm run lint:js

      - name: Run CSpell
        timeout-minutes: 5
        run: pnpm run lint:spell

      - name: Install Chromium for timeout-policy browser tests
        timeout-minutes: 5
        # A resumed tag that predates the browser tests has no Playwright CLI.
        # The runner image already ships Chromium's shared libraries; --with-deps
        # only added optional CJK/X fonts from apt, whose mirror stalls this step.
        run: |
          if [ -x node_modules/.bin/playwright ]; then
            pnpm exec playwright install chromium
          fi

      - name: Run JavaScript tests
        timeout-minutes: 10
        run: pnpm run test:ci

      - name: Run timeout-policy browser tests
        timeout-minutes: 5
        run: pnpm run --if-present test:timeout-policy-browser

      - name: Check npm packages
        timeout-minutes: 2
        run: |
          for pkg in no-mistakes eslint-plugin-no-mistakes; do
            pnpm --filter "$pkg" pack --dry-run
          done

  validate:
    name: Validate
    needs:
      - validate-rust
      - validate-js
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require both validation suites
        timeout-minutes: 1
        env:
          RUST_RESULT: ${{ needs.validate-rust.result }}
          JS_RESULT: ${{ needs.validate-js.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$JS_RESULT" = success

  # Each target is its own job so its npm publish can start when that build
  # and validation finish. A matrix job would make every publish wait for darwin.

  build-native-linux-x64:
    name: Build native for x86_64-unknown-linux-gnu
    # One rustc emits rlib+cdylib, matching native CI. Validate stays a publish
    # gate, not a compile gate: the release commit is a version bump on main.
    needs:
      - prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      NM_TARGET: x86_64-unknown-linux-gnu
      NM_ADDON: libno_mistakes.so
      NM_BUILD_TIMEOUT: "65"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    # Action pins and their version comments stay on each uses line.
    steps:
      - &build-native-exclude-workspace-from-microsoft-defender
        name: Exclude workspace from Microsoft Defender
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 2
        continue-on-error: true
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command @'
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }
          '@

      # Build scripts belong to the running workflow, even when the release
      # source is an older tag. Never overlay current product source onto that tag.
      - name: Checkout release scripts
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: &build-native-checkout-release-scripts
          ref: ${{ github.workflow_sha }}
          path: release-scripts
          persist-credentials: false
          fetch-depth: 1

      - &build-native-isolate-release-scripts
        name: Isolate release scripts
        timeout-minutes: 1
        shell: bash
        run: mv -- release-scripts "$RUNNER_TEMP/release-scripts"

      - name: Download prepared source
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: &build-native-download-prepared-source
          name: release-source
          path: prepared-release

      - &build-native-extract-prepared-source
        name: Extract prepared source
        timeout-minutes: 2
        run: tar -xzf prepared-release/release-source.tgz

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with: &build-native-install-rust
          toolchain: stable
          targets: ${{ env.NM_TARGET }}

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with: &build-native-cache-rust-build-artifacts
          prefix-key: v1-rust-release
          shared-key: release-${{ env.NM_TARGET }}
          cache-bin: "false"

      # Full LTO on aarch64 Linux was SIGTERMed (exit 143) on the 16 GB
      # ubuntu-22.04-arm runner (run 40325778215). ThinLTO lowers that peak.
      # Swap stays so a cold compile still has headroom.
      - &build-native-add-swap
        name: Add swap
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h /
          avail_gb=$(( $(df --output=avail -B1 / | tail -1 | tr -dc '0-9') / 1073741824 ))
          size_gb=16
          if [ "$avail_gb" -lt $((size_gb + 4)) ]; then
            size_gb=$((avail_gb - 4))
          fi
          if [ "$size_gb" -lt 1 ]; then
            echo "not enough free disk for swap"
            exit 0
          fi
          sudo swapoff -a || true
          sudo fallocate -l "${size_gb}G" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - &build-native-build-cli-and-n-api-addon
        name: Build CLI and N-API addon
        timeout-minutes: ${{ fromJSON(env.NM_BUILD_TIMEOUT) }}
        shell: bash
        run: bash "$RUNNER_TEMP/release-scripts/.github/scripts/cargo-release-build.sh"

      - &build-native-stage-cli-assets
        name: Stage CLI assets
        timeout-minutes: 2
        shell: bash
        run: bash "$RUNNER_TEMP/release-scripts/.github/scripts/stage-release-cli.sh" "${{ needs.prepare.outputs.version }}"

      - &build-native-generate-checksum-unix
        name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 2
        shell: bash
        working-directory: release-assets
        run: |
          for artifact in *; do
            [[ "$artifact" == *.sha256 ]] && continue
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - &build-native-generate-checksum-windows
        name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        working-directory: release-assets
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -notlike "*.sha256" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.Name).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.Name).sha256"
          }

      - name: Upload CLI artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: &build-native-upload-cli-artifact
          name: release-cli-${{ env.NM_TARGET }}
          path: release-assets/*
          if-no-files-found: error

      - name: Install Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: &build-native-install-node-js
          node-version: 24

      - &build-native-stage-n-api-addon
        name: Stage N-API addon
        timeout-minutes: 2
        shell: bash
        run: bash "$RUNNER_TEMP/release-scripts/.github/scripts/stage-release-addon.sh" "${{ needs.prepare.outputs.version }}"

      - name: Upload N-API artifact
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: &build-native-upload-n-api-artifact
          name: release-napi-${{ env.NM_TARGET }}
          path: no-mistakes-napi-*.node
          if-no-files-found: error

      - &build-native-require-cargo-timings-report
        name: Require Cargo timings report
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(target/cargo-timings/*.html)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "missing target/cargo-timings/*.html"
            exit 1
          fi

      - name: Upload Cargo timings
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: &build-native-upload-cargo-timings
