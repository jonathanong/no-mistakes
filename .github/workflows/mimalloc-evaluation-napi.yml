name: Mimalloc evaluation N-API parity

on: workflow_call

permissions:
  contents: read

jobs:
  napi:
    name: Native N-API parity ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Check out candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node and pnpm
        timeout-minutes: 5
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: false
          install: false
      - name: Install JavaScript dependencies
        timeout-minutes: 8
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:js
      - name: Download both native addons
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mimalloc-${{ matrix.target }}-*
          path: ${{ runner.temp }}/addons
          merge-multiple: false
      - name: Test compiled release addons
        timeout-minutes: 7
        env:
          ADDON_ROOT: ${{ runner.temp }}/addons
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tests=(packages/no-mistakes/scripts/real-napi-api.test.js packages/no-mistakes/scripts/postgres-procedural-occurrence-api.test.js packages/no-mistakes/scripts/postgres-procedural-loop-coverage-api.test.js tests/js/compiled-api-runtime.test.js)
          for variant in system mimalloc; do
            addon="$ADDON_ROOT/mimalloc-$TARGET-$variant/no-mistakes.node"
            NO_MISTAKES_TEST_NAPI_ADDON_PATH="$addon" ./node_modules/.bin/vitest run "${tests[@]}" --coverage=false
          done
