name: Temporary fat LTO parallel codegen release proof

on:
  push:
    branches:
      - codex/fat16-proof-20261013
    paths:
      - .github/workflows/fat16-release-proof.yml
      - .github/scripts/fat16-consumer-experiment.py

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.target }} fat16
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release CLI plus addon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/no-mistakes/Cargo.toml')
          source = path.read_text()
          before = 'crate-type = ["rlib"]'
          assert source.count(before) == 1
          path.write_text(source.replace(before, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          mkdir -p experiment
          /usr/bin/time -v -o experiment/build.time \
            env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
              --target ${{ matrix.target }} -p no-mistakes
          cp target/${{ matrix.target }}/release/no-mistakes experiment/no-mistakes
          cp target/${{ matrix.target }}/release/libno_mistakes.so experiment/libno_mistakes.so
          sha256sum experiment/{no-mistakes,libno_mistakes.so} > experiment/hashes.txt
          stat -c '%n %s' experiment/{no-mistakes,libno_mistakes.so} > experiment/sizes.txt
          rustc -Vv > experiment/rustc.txt
          lscpu > experiment/cpu.txt
          git rev-parse HEAD > experiment/source-commit.txt
          env | sort | grep -E '^(CARGO_PROFILE_RELEASE_|RUSTFLAGS=|ImageOS=|ImageVersion=|RUNNER_ARCH=)' > experiment/environment.txt
          {
            for file in no-mistakes libno_mistakes.so; do
              printf '%s gzip9_bytes=' "$file"
              gzip -n -9 -c "experiment/$file" | wc -c
            done
            printf 'combined_tar_gzip9_bytes='
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - -C experiment no-mistakes libno_mistakes.so | gzip -n -9 | wc -c
          } > experiment/compressed-sizes.txt
          cp experiment/libno_mistakes.so experiment/no-mistakes.node
          node -e "const a=require('./experiment/no-mistakes.node');a.checkJson(Buffer.from(JSON.stringify({root:'fixtures/performance/graph-gates'}))).then(x=>process.stdout.write(x)).catch(e=>{console.error(e);process.exitCode=1})" \
            > experiment/node-api-check.json
          rm experiment/no-mistakes.node
          sha256sum experiment/node-api-check.json > experiment/node-api-check.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fat16-release-${{ matrix.target }}
          path: experiment/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

  consumer:
    name: Consumer ${{ matrix.platform.name }} ${{ matrix.fixture.name }}
    needs: build
    if: ${{ always() }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: arm
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            native_package: no-mistakes-linux-arm64-gnu
          - name: x86
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native_package: no-mistakes-linux-x64-gnu
        fixture:
          - name: acceptance
            commit: 22edf4bfe0a782ac0d030c916dedfd6f8acb499c
            tree: e848d7ad03e0c0fca7ec70eb0f678653f70c278b
          - name: reported-pair
            commit: 92d0a2061bde8d260aa0b86a2d71110ece1a43ca
            tree: 11815b62e69a39be94ed790e8984994f50113cd3
    steps:
      - name: Checkout experiment harness and commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned public consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vouchington/vouchington
          ref: ${{ matrix.fixture.commit }}
          path: fixture
          persist-credentials: false
      - name: Install consumer Node
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15 # v7
        with:
          node-version-file: fixture/.nvmrc
          package-manager-cache: false
      - name: Install consumer pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest-12
          package_json_file: fixture/package.json
      - name: Install pinned consumer dependencies
        working-directory: fixture
        run: pnpm install --frozen-lockfile --loglevel=warn
      - name: Download existing same-source fat1 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38335114579 --repo jonathanong/no-mistakes \
            --name release-proof-${{ matrix.platform.target }}-baseline \
            --dir "$RUNNER_TEMP/codegen-consumer/baseline"
      - name: Download fresh fat16 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fat16-release-${{ matrix.platform.target }}
          path: ${{ runner.temp }}/codegen-consumer/fat16
      - name: Check Node API parity
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/codegen-consumer/"{baseline,fat16}/node-api-check.json
          sha256sum "$RUNNER_TEMP/codegen-consumer/"{baseline,fat16}/no-mistakes
      - name: Run balanced exact consumer check
        env:
          EXPECTED_TREE: ${{ matrix.fixture.tree }}
          EXPECTED_COMMIT: ${{ matrix.fixture.commit }}
          NATIVE_PACKAGE: ${{ matrix.platform.native_package }}
        shell: bash
        run: |
          set -euo pipefail
          python harness/.github/scripts/fat16-consumer-experiment.py
      - name: Upload logs and samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fat16-consumer-${{ matrix.platform.name }}-${{ matrix.fixture.name }}
          path: ${{ runner.temp }}/codegen-consumer/measurements/
          if-no-files-found: warn
          retention-days: 3
