name: Dependabot PR Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate Dependabot pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { fixtureOnlyDecision } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/dependabot-pr-policy.cjs`
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            function isMajorBump(from, to) {
              const major = v => parseInt(v.replace(/^v/, '').split('.')[0], 10);
              return major(to) > major(from);
            }

            function hasMajorBump(pullRequest) {
              const titleMatch = pullRequest.title.match(/from\s+v?([\d.]+)\s+to\s+v?([\d.]+)/i);
              if (titleMatch) {
                return isMajorBump(titleMatch[1], titleMatch[2]);
              }

              const body = pullRequest.body ?? '';
              const bodyMatches = [...body.matchAll(/from\s+`?v?([\d.]+)`?\s+to\s+`?v?([\d.]+)`?/gi)];
              return bodyMatches.some(match => isMajorBump(match[1], match[2]));
            }

            function hasActiveApproval(reviews) {
              const latestStateByUser = new Map();
              const sortedReviews = [...reviews].sort((a, b) => {
                return new Date(a.submitted_at ?? 0).getTime() - new Date(b.submitted_at ?? 0).getTime();
              });

              for (const review of sortedReviews) {
                latestStateByUser.set(review.user.login, review.state);
              }

              return [...latestStateByUser.values()].includes('APPROVED');
            }

            function errorMessage(error) {
              return error instanceof Error ? error.message : String(error);
            }

            core.info(`Evaluating PR #${pr.number} (${pr.title})`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changedPaths = files.map(file => file.filename);
            const fixtureDecision = fixtureOnlyDecision(changedPaths, pr.changed_files);

            if (fixtureDecision === 'incomplete') {
              core.warning(
                `Skipping fixture-only policy because GitHub returned ${files.length} `
                + `of ${pr.changed_files} changed files`
              );
              return;
            }

            if (fixtureDecision === 'close') {
              core.info('Closing fixture-only Dependabot pull request');
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
              return;
            }

            if (pr.draft) {
              core.info('Skipping draft pull request');
              return;
            }

            if (hasMajorBump(pr)) {
              core.info('Skipping semver-major update');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            if (hasActiveApproval(reviews)) {
              core.info('Approval already present');
            } else {
              core.info('Approving PR');
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                });
              } catch (error) {
                core.warning(
                  'Could not approve PR with GITHUB_TOKEN: '
                  + `${errorMessage(error)}. If approvals are required, enable `
                  + '"Allow GitHub Actions to create and approve pull requests" '
                  + 'in the repository Actions settings.'
                );
              }
            }

            const { data: freshPr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            if (freshPr.auto_merge) {
              core.info('Auto-merge already enabled');
              return;
            }

            core.info('Enabling auto-merge');
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }
              `, { pullRequestId: freshPr.node_id });
              core.info('Done: auto-merge enabled');
            } catch (error) {
              core.warning(
                'Could not enable auto-merge: '
                + `${errorMessage(error)}. Confirm repository auto-merge is `
                + 'enabled and squash merging is allowed.'
              );
            }
