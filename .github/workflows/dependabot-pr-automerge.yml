name: Dependabot PR Auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base commit owns this code. A pull request cannot change what the write token runs.
      - name: Fetch trusted auto-merge scripts
        timeout-minutes: 3
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          script_dir="${RUNNER_TEMP}/dependabot-automerge"
          mkdir -p "${script_dir}"
          for name in dependabot-automerge.cjs dependabot-pr-policy.cjs; do
            gh api --header "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/${name}?ref=${BASE_SHA}" \
              > "${script_dir}/${name}"
            test -s "${script_dir}/${name}"
            node --check "${script_dir}/${name}"
          done

      - name: Evaluate Dependabot pull request
        timeout-minutes: 3
        env:
          DEPENDABOT_AUTOMERGE_SCRIPT: ${{ runner.temp }}/dependabot-automerge/dependabot-automerge.cjs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node "${DEPENDABOT_AUTOMERGE_SCRIPT}"
