name: Temporary ARM release profile alternatives

on:
  push:
    branches:
      - codex/native-cpu-20261012
    paths:
      - .github/workflows/release-profile-alternatives.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: thin1
            lto: thin
            units: "1"
          - variant: thin4
            lto: thin
            units: "4"
          - variant: fat16
            lto: fat
            units: "16"
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.units }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Build production CLI and addon, measure compressed size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          manifest = Path('crates/no-mistakes/Cargo.toml')
          source = manifest.read_text()
          before = 'crate-type = ["rlib"]'
          assert source.count(before) == 1
          manifest.write_text(source.replace(before, 'crate-type = ["rlib", "cdylib"]', 1))
          PY
          mkdir -p experiment
          /usr/bin/time -v -o experiment/build.time \
            env NO_MISTAKES_BUILD_NAPI=1 cargo build --release --locked \
              --target aarch64-unknown-linux-gnu -p no-mistakes
          release=target/aarch64-unknown-linux-gnu/release
          cli="$release/no-mistakes"
          addon="$release/libno_mistakes.so"
          test -s "$cli" && test -s "$addon"
          sha256sum "$cli" "$addon" > experiment/hashes.txt
          stat -c '%n %s' "$cli" "$addon" > experiment/sizes.txt
          {
            for file in no-mistakes libno_mistakes.so; do
              printf '%s gzip9_bytes=' "$file"
              gzip -n -9 -c "$release/$file" | wc -c
            done
            printf 'combined_tar_gzip9_bytes='
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - -C "$release" no-mistakes libno_mistakes.so | gzip -n -9 | wc -c
          } > experiment/compressed-sizes.txt
          cp "$addon" experiment/no-mistakes.node
          node -e "const a=require('./experiment/no-mistakes.node');a.checkJson(Buffer.from(JSON.stringify({root:'fixtures/performance/graph-gates'}))).then(x=>process.stdout.write(x)).catch(e=>{console.error(e);process.exitCode=1})" \
            > experiment/node-api-check.json
          rm experiment/no-mistakes.node
          sha256sum experiment/node-api-check.json > experiment/node-api-check.sha256
          rustc -Vv > experiment/rustc.txt
          lscpu > experiment/cpu.txt
          git rev-parse HEAD > experiment/source-commit.txt
          env | sort | grep -E '^(CARGO_PROFILE_RELEASE_|RUSTFLAGS=|ImageOS=|ImageVersion=|RUNNER_ARCH=)' > experiment/environment.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-alternative-${{ matrix.variant }}
          path: experiment/
          if-no-files-found: warn
          retention-days: 3
