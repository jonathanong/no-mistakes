name: Annotation scope macOS performance

on:
  pull_request:
    paths:
      - .github/workflows/annotation-scope-performance.yml
      - .github/scripts/annotation-scope-performance/**
      - fixtures/performance/annotation-excluded-callers-*/**

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "6"
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: annotation-scope-performance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare native toolchain
        timeout-minutes: 5
        run: |
          rustup update stable
          brew install flock
      - name: Freeze executable and provenance
        timeout-minutes: 25
        env:
          VARIANT: ${{ matrix.variant }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/annotation-scope-performance/build.py
      - name: Upload frozen executable
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: annotation-${{ matrix.variant }}
          path: ${{ runner.temp }}/annotation-${{ matrix.variant }}/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  measure:
    name: Measure macOS annotation scope
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        timeout-minutes: 3
        with:
          pattern: annotation-*
          path: ${{ runner.temp }}/annotation-artifacts
      - name: Test measurement validation
        timeout-minutes: 1
        run: python3 -m unittest discover -s .github/scripts/annotation-scope-performance -p 'test_*.py'
      - name: Validate provenance and compare public fixtures
        timeout-minutes: 25
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/annotation-scope-performance/measure.py
      - name: Upload comparison
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: annotation-macos-comparison
          path: ${{ runner.temp }}/annotation-results/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
