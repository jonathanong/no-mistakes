name: Mimalloc native evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/mimalloc-evaluation*.yml"
      - "Cargo.lock"
      - "crates/no-mistakes/Cargo.toml"
      - "crates/no-mistakes/src/lib.rs"
      - "crates/no-mistakes/examples/allocator_probe.rs"
      - "scripts/performance/mimalloc-*"
      - "docs/performance/mimalloc-evaluation.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimalloc-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/mimalloc-evaluation-build.yml
  prepare:
    uses: ./.github/workflows/mimalloc-evaluation-prepare.yml
  probe:
    uses: ./.github/workflows/mimalloc-evaluation-probe.yml
  napi:
    needs: build
    uses: ./.github/workflows/mimalloc-evaluation-napi.yml
  measure:
    needs: [build, probe, napi, prepare]
    uses: ./.github/workflows/mimalloc-evaluation-measure.yml
  summarize:
    if: always()
    needs: [build, probe, napi, prepare, measure]
    uses: ./.github/workflows/mimalloc-evaluation-summary.yml
