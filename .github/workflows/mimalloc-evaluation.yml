name: Mimalloc native evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimalloc-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-tests:
    name: Saved measurement harness tests
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test saved measurement fixtures
        timeout-minutes: 2
        run: |
          python3 scripts/performance/mimalloc-report-tests.py
          bash scripts/performance/mimalloc-build-tests.sh
  build:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-build.yml
  prepare:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-prepare.yml
  probe:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-probe.yml
  napi:
    needs: build
    uses: ./.github/workflows/mimalloc-evaluation-napi.yml
  measure:
    needs: [build, probe, napi, prepare]
    uses: ./.github/workflows/mimalloc-evaluation-measure.yml
  summarize:
    if: always()
    needs: [harness-tests, build, probe, napi, prepare, measure]
    uses: ./.github/workflows/mimalloc-evaluation-summary.yml
