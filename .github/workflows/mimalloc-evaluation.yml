name: Mimalloc native evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimalloc-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-tests:
    name: Saved measurement harness tests
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out candidate source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node for saved runner tests
        timeout-minutes: 3
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: false
          install: false
      - name: Test saved measurement fixtures
        timeout-minutes: 2
        run: |
          for suite in report evidence artifact adoption napi-measure sampler; do
            python3 "scripts/performance/mimalloc-$suite-tests.py"
          done
          node --test scripts/performance/mimalloc-napi-runner.test.js
          bash scripts/performance/mimalloc-build-tests.sh
      - name: Install stable Rust for allocator configuration guards
        timeout-minutes: 3
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: stable
      - name: Verify production and unit-test allocator registration
        timeout-minutes: 2
        run: python3 scripts/performance/mimalloc-configuration-tests.py
  build:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-build.yml
  prepare:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-prepare.yml
  probe:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-evaluation-probe.yml
  napi:
    needs: build
    uses: ./.github/workflows/mimalloc-evaluation-napi.yml
  napi-resources:
    needs: [build, prepare, napi]
    uses: ./.github/workflows/mimalloc-evaluation-napi-measure.yml
  release-targets:
    needs: harness-tests
    uses: ./.github/workflows/mimalloc-release-targets.yml
  measure:
    needs: [build, probe, napi, prepare]
    uses: ./.github/workflows/mimalloc-evaluation-measure.yml
  summarize:
    if: always()
    needs: [harness-tests, build, probe, napi, prepare, measure, napi-resources, release-targets]
    uses: ./.github/workflows/mimalloc-evaluation-summary.yml
