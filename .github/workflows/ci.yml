        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-test-build-diagnostics-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
          compression-level: 1
          path: |
            target/native-test-build-diagnostics

      - name: Download native-rust-archive
        if: ${{ steps.build-artifact-source.outputs.reuse == 'true' }}
        timeout-minutes: 6
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ steps.build-artifact-source.outputs.run_id }}
          github-token: ${{ github.token }}
          name: native-rust-archive-${{ matrix.target }}
          path: target/native-test-artifacts

      - name: Run platform-specific Rust tests
        timeout-minutes: 15
        shell: bash
        run: node .github/scripts/native-test-archive.cjs run ${{ matrix.shard }} ${{ matrix.total }}

      - name: Retain native Rust case execution inventory
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
