            native-runtime-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type.
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build native CLI and N-API addon
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          NATIVE_WORKSPACE_CACHE_KEY: ${{ steps.native-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          if [[ -n "$NATIVE_WORKSPACE_CACHE_KEY" ]]; then
            node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          fi
          node .github/scripts/build-native.cjs
          cp target/debug/libno_mistakes.dylib target/debug/no-mistakes.node

      - name: Upload native build diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-smoke-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            target/native-build-diagnostics

      - name: Run CLI check on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs macos cli ./target/debug/no-mistakes

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run analyzeProject on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs macos napi target/debug/no-mistakes.node

      - name: Run N-API smoke tests
        timeout-minutes: 10
        run: node .github/scripts/smoke.cjs macos api target/debug/no-mistakes.node

  # PR-only Windows tier: one build, then an explicit OS-dependent test list from
  # .github/scripts/smoke-tests.cjs. main and workflow_dispatch run the
  # full sharded Windows jobs instead. See docs/development/ci-builds.md.
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  windows-smoke:
    name: Windows smoke
    needs: changes
    if: ${{ needs.changes.outputs.windows-smoke == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NO_MISTAKES_BUILD_NAPI: "1"
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false

      - name: Install Rust
        id: native-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore native workspace artifacts built on main
        id: native-workspace-cache
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type.
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build native CLI and N-API addon
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/build-native.cjs
          cp target/debug/no_mistakes.dll target/debug/no-mistakes.node

      - name: Upload native build diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-smoke-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            target/native-build-diagnostics

      - name: Run CLI check on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs windows cli ./target/debug/no-mistakes.exe

      - name: Run Windows-dependent Rust tests
        timeout-minutes: 15
        run: node .github/scripts/smoke.cjs windows rust

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run analyzeProject on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs windows napi target/debug/no-mistakes.node

      - name: Run N-API smoke tests
        timeout-minutes: 10
        run: node .github/scripts/smoke.cjs windows api target/debug/no-mistakes.node

  standalone-build:
    name: Build standalone library tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "4096"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "4096"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: standalone-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache standalone-lib workspace artifacts by source
        id: standalone-lib-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('.github/scripts/standalone-shard-rustc*.sh') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('.github/scripts/standalone-shard-rustc*.sh') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('.github/scripts/standalone-shard-rustc*.sh') }}-
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Install nextest
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Build standalone library without a CLI
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 13
        env:
          WORKSPACE_CACHE_KEY: ${{ steps.standalone-lib-workspace-cache.outputs.cache-matched-key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$WORKSPACE_CACHE_KEY" ]]; then
            node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
          fi
          printf 'standalone library build: cargo_jobs=%s dev_units=%s test_units=%s dev_debug=%s test_debug=%s incremental=%s shards=%s\n' \
            "$CARGO_BUILD_JOBS" "$CARGO_PROFILE_DEV_CODEGEN_UNITS" "$CARGO_PROFILE_TEST_CODEGEN_UNITS" \
            "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL" 3
          bash .github/scripts/with-resource-samples.sh node .github/scripts/standalone-shards.cjs build target/standalone-bundle 1
      - name: Build standalone library shard 2
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 10
        run: bash .github/scripts/with-resource-samples.sh node .github/scripts/standalone-shards.cjs build target/standalone-bundle 2
      - name: Build standalone library shard 3
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 10
        run: bash .github/scripts/with-resource-samples.sh node .github/scripts/standalone-shards.cjs build target/standalone-bundle 3
      - name: Record standalone compiler inputs for cache publication
        if: ${{ env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.standalone-lib-workspace-cache.outputs.cache-hit != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        run: node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.standalone-lib-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.standalone-lib-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Upload standalone library archive 1
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-library-1
          path: |
            target/standalone-bundle/build.json
            target/standalone-bundle/standalone-0.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload standalone library archive 2
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-library-2
          path: |
            target/standalone-bundle/build.json
            target/standalone-bundle/standalone-1.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload standalone library archive 3
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-library-3
          path: |
            target/standalone-bundle/build.json
            target/standalone-bundle/standalone-2.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  standalone-shards:
    name: Standalone library shard (${{ matrix.shard }}/3)
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib/target
      CARGO_INCREMENTAL: "0"
    needs: standalone-build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nextest
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Download standalone library archive
        id: standalone-download
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.standalone-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: standalone-library-${{ matrix.shard }}
          path: target/standalone-bundle
      - name: Retry standalone library archive download
        if: ${{ !cancelled() && steps.standalone-download.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.standalone-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: standalone-library-${{ matrix.shard }}
          path: target/standalone-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Test standalone Rust library without a CLI build
        timeout-minutes: 6
        run: node .github/scripts/standalone-shards.cjs run target/standalone-bundle ${{ matrix.shard }} 3
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  rust-coverage-build:
    name: Build instrumented Rust tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        id: coverage-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache coverage workspace artifacts by source
        id: coverage-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Install Rust coverage tools
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151
      - name: Test Rust coverage sharding
        timeout-minutes: 2
        run: node --test .github/scripts/rust-coverage-shards.test.cjs .github/scripts/rust-profile-pooling.test.cjs
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build and archive instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 40
        shell: bash
        env:
          CACHE_PRIMARY_KEY: ${{ steps.coverage-workspace-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.coverage-workspace-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.coverage-workspace-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'coverage cache: primary=%s matched=%s exact=%s\n' "$CACHE_PRIMARY_KEY" "$CACHE_MATCHED_KEY" "$CACHE_HIT"
          printf 'Cargo jobs=%s incremental=%s\n' "$CARGO_BUILD_JOBS" "$CARGO_INCREMENTAL"
          free -m
          rustc -vV
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
          printf 'Instrumented RUSTFLAGS=%s\n' "$RUSTFLAGS"
          bash .github/scripts/with-resource-samples.sh node .github/scripts/rust-coverage-shards.cjs archive target/coverage-bundle
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.coverage-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.coverage-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Upload instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-build
          path: target/coverage-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Diagnose Rust disk usage after failure
        if: ${{ (failure()) && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust coverage build failure" target

  rust-coverage-shards:
    name: Rust coverage shard (${{ matrix.shard }}/6)
    needs: rust-coverage-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nextest
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Download instrumented Rust tests (attempt 1 of 2)
        id: coverage-download
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Back off before coverage download attempt 2 of 2
        if: ${{ !cancelled() && steps.coverage-download.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          echo "Coverage download attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry instrumented Rust test download
        if: ${{ !cancelled() && steps.coverage-download.outcome == 'failure' }}
        timeout-minutes: 4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust tests for coverage
        timeout-minutes: 8
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          LLVM_PROFILE_FILE_NAME: no-mistakes-%9m.profraw
        run: node .github/scripts/rust-coverage-shards.cjs shard target/coverage-bundle "$RUNNER_TEMP/rust-coverage-shard" "$SHARD_INDEX" 6
      - name: Retain profiles and execution diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/rust-coverage-shard
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  # Keep the existing required check name on this fan-in job.
  tests:
    name: Rust tests and coverage
    needs: [changes, rust-coverage-build, rust-coverage-shards]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install coverage tools
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151,cargo-crap
      - name: Download instrumented Rust tests
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Restore report binaries without rebuilding
        timeout-minutes: 3
        run: |
          node .github/scripts/rust-coverage-shards.cjs verify target/coverage-bundle
          mkdir -p "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")"
          cargo nextest list --archive-file target/coverage-bundle/rust-tests.tar.zst \
            --extract-to "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")" \
            --workspace-remap "$GITHUB_WORKSPACE" --list-type binaries-only --message-format json \
            > target/coverage-bundle/binaries.json
          node .github/scripts/rust-coverage-shards.cjs report-objects target/coverage-bundle target/coverage-bundle/binaries.json >> "$GITHUB_ENV"
      - name: Download every shard profile and execution inventory
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rust-coverage-shard-*
          path: target/coverage-shards
      - name: Merge shard profiles and require complete successful execution
        id: rust-shard-collection
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node .github/scripts/rust-coverage-shards.cjs collect target/coverage-bundle target/coverage-shards 6
      - name: Require every Rust snapshot to be referenced
        if: ${{ !cancelled() && steps.rust-shard-collection.outcome == 'success' }}
        timeout-minutes: 2
        run: node .github/scripts/rust-snapshot-references.cjs target/coverage-shards/references.txt
      # Append existing report, CRAP 30, cyclomatic complexity 30, 98% line/function/region
      # gates, profile preservation, uncovered-region details, quality uploads and Codecov steps.
      # Give report/diagnostic steps !cancelled() guards so failed shards still render coverage.
      # Finish with this step even if collection/reporting failed; no partial run can pass.
      - name: Write Rust coverage report
        id: rust-coverage
        if: ${{ !cancelled() && hashFiles('target/coverage/target/*.profraw') != '' }}
        timeout-minutes: 5
        run: |
          mkdir -p target/llvm-cov
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --lcov \
            --output-path target/llvm-cov/lcov.info

      - name: Show Rust coverage table (debug)
        if: ${{ failure() && steps.rust-coverage.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report 2>&1 | tail -30
          cargo llvm-cov report --show-missing-lines 2>&1 | tail -60
        continue-on-error: true

      - name: Enforce CRAP threshold
        id: rust-crap
        timeout-minutes: 2
        run: |
          set -o pipefail
          cargo crap --lcov target/llvm-cov/lcov.info --fail-above --threshold 30 --missing skip 2>&1 | tee target/llvm-cov/crap-report.txt

      - name: Upload Rust quality diagnostics
        timeout-minutes: 2
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-quality-diagnostics
          retention-days: 7
          path: |
            target/llvm-cov/crap-report.txt
            target/llvm-cov/lcov.info
            target/llvm-cov/nextest-objects.json
            target/llvm-cov/nextest-objects.rsp

      - name: Summarize failing Rust CRAP rows
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          cargo crap --lcov target/llvm-cov/lcov.info --threshold 30 --missing skip \
            --format markdown --min 30 --top 20 --output target/llvm-cov/crap-threshold.md
          cat target/llvm-cov/crap-threshold.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded Rust CRAP report
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-crap-threshold
          path: target/llvm-cov/crap-threshold.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cyclomatic complexity threshold
        timeout-minutes: 2
        # Without LCOV, optimistic coverage makes CRAP equal cyclomatic complexity.
        # Include workspace source even when coverage omits it (such as src/tests/).
        run: cargo crap --workspace --missing optimistic --fail-above --threshold 30 --summary

      - name: Preserve merged Rust coverage profiles
        timeout-minutes: 1
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/preserve-rust-profiles.cjs \
            "$CARGO_LLVM_COV_TARGET_DIR" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/no-mistakes-profraw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Enforce Rust coverage floors
        id: rust-coverage-floors
        if: ${{ !cancelled() && steps.rust-coverage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # Native --fail-under flags render a table and then export full JSON again.
          # Summary totals preserve the same gate without both expensive passes.
          cargo llvm-cov report --json --summary-only \
            --output-path target/llvm-cov/summary.json
          node .github/scripts/rust-coverage-floors.cjs target/llvm-cov/summary.json \
            "${RUST_COVERAGE_FAIL_UNDER_LINES}" \
            "${RUST_COVERAGE_FAIL_UNDER_FUNCTIONS}" \
            "${RUST_COVERAGE_FAIL_UNDER_REGIONS}"

      - name: Write uncovered Rust region details
        if: ${{ !cancelled() && steps.rust-coverage-floors.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --json --output-path target/llvm-cov/regions.json

      - name: Upload uncovered Rust region details
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/regions.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-regions
          path: target/llvm-cov/regions.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Rust coverage summary
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/summary.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-summary
          path: target/llvm-cov/summary.json
          if-no-files-found: error
          retention-days: 7

      # Codecov is reporting only; the floors above gate coverage, so an outage must not block merges.
      - name: Upload Rust coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: true

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust tests job failure" target

      - name: Require successful Rust producer and all test shards
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          BUILD_RESULT: ${{ needs.rust-coverage-build.result }}
          SHARD_RESULT: ${{ needs.rust-coverage-shards.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success
  docs-tests:
    name: Docs tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/doctests
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Rust doctest artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: rust-doctests-v1
          workspaces: . -> target/doctests
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust doctests
        timeout-minutes: 20
        run: bash .github/scripts/rust-validation.sh doc
      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust doctest job failure" target/doctests

  tests-gate:
    name: Tests with coverage
    needs:
      [
        changes,
        quality,
        docs-tests,
        packages,
        javascript-coverage,
        linux-api-tests,
        timeout-policy-browser-tests,
        native-build,
        native-test-build,
        native-rust-tests,
        native-rust-tests-macos,
        native-api-tests,
        native-api-tests-macos,
        macos-smoke,
        windows-smoke,
        tests,
        standalone-build,
        standalone-shards,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/tests-gate.cjs
          sparse-checkout-cone-mode: false
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          MACOS_REQUIRED: ${{ needs.changes.outputs.macos }}
          MACOS_SMOKE_REQUIRED: ${{ needs.changes.outputs.macos-smoke }}
          MACOS_EVENT: ${{ github.event_name }}
          MACOS_REF: ${{ github.ref }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
        run: node .github/scripts/tests-gate.cjs
  ast-analysis:
    name: AST analysis
    needs: linux-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 11

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux runtime
        timeout-minutes: 6
        env:
          NATIVE_RUNTIME_RUN_ID: ${{ needs.linux-runtime.outputs.artifact-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download-native-runtime.py linux-runtime-cli
      - name: Restore CLI executable mode
        timeout-minutes: 3
        run: chmod +x target/debug/no-mistakes
      - name: Run no-mistakes check
        timeout-minutes: 2
        run: target/debug/no-mistakes check

      - name: Install ast-grep
        timeout-minutes: 5
        run: |
          curl -sSfL -o ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.44.1/app-x86_64-unknown-linux-gnu.zip
          echo "611f9e5e76f2611ecea1a35dd3468ceedf600641a11224b80341d79c6ee7b9dd  ast-grep.zip" | sha256sum -c -
          unzip -o ast-grep.zip ast-grep
          chmod +x ast-grep
          sudo mv ast-grep /usr/local/bin/ast-grep
          rm ast-grep.zip

      - name: Run ast-grep rule tests
        timeout-minutes: 2
        run: ast-grep test --skip-snapshot-tests

      - name: Run ast-grep scan
        timeout-minutes: 2
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA=$(node .github/scripts/push-diff-base.cjs \
            --event "$GITHUB_EVENT_NAME" \
            --workflow ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --head "$HEAD_SHA" \
            --pr-base "$PR_BASE_SHA" \
            --current-run-id "$GITHUB_RUN_ID")
          baseline_args=(--require-empty-baseline)
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$HEAD_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            baseline_args=(--base "$BASE_SHA")
          fi
          ast-grep scan --off=no-inline-test-fixture-write --off=no-inline-test-fixture-write-cfg
          python3 .ast-grep/check-inline-fixture-writes.py "${baseline_args[@]}"
  retain-linux-runtime-cache:
