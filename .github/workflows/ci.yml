        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-test-harness-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-test-harness-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-
            native-test-harness-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      # The test compile of the changed no-mistakes crate takes 10 to 14 minutes
      # on a macos-15 runner, so it has its own step and live cargo output; the
      # test step below compiles nothing. See docs/development/ci-builds.md.
      - name: Compile macOS-dependent Rust tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/smoke.cjs macos rust-build

      - name: Run macOS-dependent Rust tests
        timeout-minutes: 15
        shell: bash
        run: node .github/scripts/smoke.cjs macos rust

      - name: Restore native workspace artifacts built on main
        id: native-workspace-cache
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-runtime-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-runtime-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-
            native-runtime-workspace-v2-aarch64-apple-darwin-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type.
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build native CLI and N-API addon
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/build-native.cjs
          cp target/debug/libno_mistakes.dylib target/debug/no-mistakes.node

      - name: Upload native build diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-smoke-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            target/native-build-diagnostics

      - name: Run CLI check on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs macos cli ./target/debug/no-mistakes

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Run analyzeProject on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs macos napi target/debug/no-mistakes.node

      - name: Run N-API smoke tests
        timeout-minutes: 10
        run: node .github/scripts/smoke.cjs macos api target/debug/no-mistakes.node

  # PR-only Windows tier: one build, then an explicit OS-dependent test list from
  # .github/scripts/smoke-tests.cjs. main and workflow_dispatch run the
  # full sharded Windows jobs instead. See docs/development/ci-builds.md.
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  windows-smoke:
    name: Windows smoke
    needs: changes
    if: ${{ needs.changes.outputs.windows-smoke == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      NO_MISTAKES_BUILD_NAPI: "1"
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false

      - name: Install Rust
        id: native-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore native workspace artifacts built on main
        id: native-workspace-cache
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            native-runtime-workspace-v2-x86_64-pc-windows-msvc-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type.
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build native CLI and N-API addon
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/build-native.cjs
          cp target/debug/no_mistakes.dll target/debug/no-mistakes.node

      - name: Upload native build diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-smoke-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            target/native-build-diagnostics

      - name: Run CLI check on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs windows cli ./target/debug/no-mistakes.exe

      - name: Run Windows-dependent Rust tests
        timeout-minutes: 15
        run: node .github/scripts/smoke.cjs windows rust

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Run analyzeProject on a saved fixture
        timeout-minutes: 2
        run: node .github/scripts/smoke.cjs windows napi target/debug/no-mistakes.node

      - name: Run N-API smoke tests
        timeout-minutes: 10
        run: node .github/scripts/smoke.cjs windows api target/debug/no-mistakes.node

  native-tests:
    name: Native tests
    needs:
      [
        changes,
        native-build,
        native-build-macos,
        native-test-build,
        native-test-build-macos,
        native-rust-tests,
        native-rust-tests-macos,
        native-api-tests,
        native-api-tests-macos,
        macos-smoke,
        windows-smoke,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          MACOS_REQUIRED: ${{ needs.changes.outputs.macos }}
          MACOS_EVENT: ${{ github.event_name }}
          MACOS_REF: ${{ github.ref }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); const allow=process.env.MACOS_REQUIRED==="false"; const mainPush=process.env.MACOS_EVENT==="push"&&process.env.MACOS_REF==="refs/heads/main"; const macos=/^(native-build-macos|native-test-build-macos|native-rust-tests-macos|native-api-tests-macos)$/; const windows=/^(native-build|native-test-build|native-rust-tests|native-api-tests)$/; const producer={ "native-rust-tests-macos":"native-test-build-macos", "native-api-tests-macos":"native-build-macos" }; for (const [name,job] of Object.entries(jobs)) { if (job.result==="success") continue; if (process.env.RUST_REQUIRED==="false" && job.result==="skipped" && /^(native-(build|test-build|rust-tests|api-tests)(-macos)?|macos-smoke|windows-smoke)$/.test(name)) continue; if (macos.test(name) && job.result==="skipped" && allow) continue; if (name==="macos-smoke" && job.result==="skipped" && !allow && process.env.MACOS_REQUIRED==="true") continue; if (windows.test(name) && job.result==="skipped" && process.env.WINDOWS_REQUIRED==="false") continue; if (name==="windows-smoke" && job.result==="skipped" && process.env.WINDOWS_REQUIRED==="true") continue; if (macos.test(name) && job.result==="cancelled" && mainPush) continue; if (mainPush && job.result==="skipped" && producer[name] && jobs[producer[name]] && jobs[producer[name]].result==="cancelled") continue; console.error(name+": "+job.result); process.exitCode=1; }'
  standalone-build:
    name: Build standalone library tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "4096"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "4096"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: standalone-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache standalone-lib workspace artifacts by source
        id: standalone-lib-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-cgu${{ env.CARGO_PROFILE_TEST_CODEGEN_UNITS }}-debug${{ env.CARGO_PROFILE_TEST_DEBUG }}-
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Install nextest
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Build standalone library without a CLI
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
          printf 'standalone library build: cargo_jobs=%s dev_units=%s test_units=%s dev_debug=%s test_debug=%s incremental=%s shards=%s\n' \
            "$CARGO_BUILD_JOBS" "$CARGO_PROFILE_DEV_CODEGEN_UNITS" "$CARGO_PROFILE_TEST_CODEGEN_UNITS" \
            "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_INCREMENTAL" 3
          bash .github/scripts/with-resource-samples.sh node .github/scripts/standalone-shards.cjs build target/standalone-bundle
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.standalone-lib-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.standalone-lib-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Upload standalone library archive
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-library
          path: target/standalone-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  standalone-shards:
    name: Standalone library shard
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib/target
      CARGO_INCREMENTAL: "0"
    needs: standalone-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nextest
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Download standalone library archive
        id: standalone-download
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.standalone-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: standalone-library
          path: target/standalone-bundle
      - name: Retry standalone library archive download
        if: ${{ !cancelled() && steps.standalone-download.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.standalone-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: standalone-library
          path: target/standalone-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Test standalone Rust library without a CLI build
        timeout-minutes: 15
        run: node .github/scripts/standalone-shards.cjs run target/standalone-bundle ${{ matrix.shard }} 1
  tests-standalone-lib:
    name: Standalone library tests
    needs: [changes, standalone-build, standalone-shards]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  rust-coverage-build:
    name: Build instrumented Rust tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        id: coverage-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache coverage workspace artifacts by source
        id: coverage-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
            coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Install Rust coverage tools
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151
      - name: Test Rust coverage sharding
        timeout-minutes: 2
        run: node --test .github/scripts/rust-coverage-shards.test.cjs .github/scripts/rust-profile-pooling.test.cjs
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build and archive instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 40
        shell: bash
        env:
          CACHE_PRIMARY_KEY: ${{ steps.coverage-workspace-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.coverage-workspace-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.coverage-workspace-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'coverage cache: primary=%s matched=%s exact=%s\n' "$CACHE_PRIMARY_KEY" "$CACHE_MATCHED_KEY" "$CACHE_HIT"
          printf 'Cargo jobs=%s incremental=%s\n' "$CARGO_BUILD_JOBS" "$CARGO_INCREMENTAL"
          free -m
          rustc -vV
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
          printf 'Instrumented RUSTFLAGS=%s\n' "$RUSTFLAGS"
          bash .github/scripts/with-resource-samples.sh node .github/scripts/rust-coverage-shards.cjs archive target/coverage-bundle
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.coverage-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.coverage-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Upload instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-build
          path: target/coverage-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Diagnose Rust disk usage after failure
        if: ${{ (failure()) && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust coverage build failure" target

  rust-coverage-shards:
    name: Rust coverage shard (${{ matrix.shard }}/3)
    needs: rust-coverage-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nextest
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      - name: Download instrumented Rust tests (attempt 1 of 2)
        id: coverage-download
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Back off before coverage download attempt 2 of 2
        if: ${{ !cancelled() && steps.coverage-download.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          echo "Coverage download attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry instrumented Rust test download
        if: ${{ !cancelled() && steps.coverage-download.outcome == 'failure' }}
        timeout-minutes: 4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust tests for coverage
        timeout-minutes: 14
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          LLVM_PROFILE_FILE_NAME: no-mistakes-%9m.profraw
        run: node .github/scripts/rust-coverage-shards.cjs shard target/coverage-bundle "$RUNNER_TEMP/rust-coverage-shard" "$SHARD_INDEX" 3
      - name: Retain profiles and execution diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/rust-coverage-shard
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  # Keep the existing required check name on this fan-in job.
  tests:
    name: Rust tests and coverage
    needs: [changes, rust-coverage-build, rust-coverage-shards]
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install coverage tools
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151,cargo-crap
      - name: Download instrumented Rust tests
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Restore report binaries without rebuilding
        timeout-minutes: 3
        run: |
          node .github/scripts/rust-coverage-shards.cjs verify target/coverage-bundle
          mkdir -p "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")"
          cargo nextest list --archive-file target/coverage-bundle/rust-tests.tar.zst \
            --extract-to "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")" \
            --workspace-remap "$GITHUB_WORKSPACE" --list-type binaries-only --message-format json \
            > target/coverage-bundle/binaries.json
          node .github/scripts/rust-coverage-shards.cjs report-objects target/coverage-bundle target/coverage-bundle/binaries.json >> "$GITHUB_ENV"
      - name: Download every shard profile and execution inventory
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rust-coverage-shard-*
          path: target/coverage-shards
      - name: Merge shard profiles and require complete successful execution
        id: rust-shard-collection
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node .github/scripts/rust-coverage-shards.cjs collect target/coverage-bundle target/coverage-shards 3
      - name: Require every Rust snapshot to be referenced
        if: ${{ !cancelled() && steps.rust-shard-collection.outcome == 'success' }}
        timeout-minutes: 2
        run: node .github/scripts/rust-snapshot-references.cjs target/coverage-shards/references.txt
      # Append existing report, CRAP 30, cyclomatic complexity 30, 98% line/function/region
      # gates, profile preservation, uncovered-region details, quality uploads and Codecov steps.
      # Give report/diagnostic steps !cancelled() guards so failed shards still render coverage.
      # Finish with this step even if collection/reporting failed; no partial run can pass.
      - name: Write Rust coverage report
        id: rust-coverage
        if: ${{ !cancelled() && hashFiles('target/coverage/target/*.profraw') != '' }}
        timeout-minutes: 5
        run: |
          mkdir -p target/llvm-cov
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --lcov \
            --output-path target/llvm-cov/lcov.info

      - name: Show Rust coverage table (debug)
        if: ${{ failure() && steps.rust-coverage.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report 2>&1 | tail -30
          cargo llvm-cov report --show-missing-lines 2>&1 | tail -60
        continue-on-error: true

      - name: Install cargo-crap
        timeout-minutes: 5
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-crap

      - name: Enforce CRAP threshold
        id: rust-crap
        timeout-minutes: 2
        run: |
          set -o pipefail
          cargo crap --lcov target/llvm-cov/lcov.info --fail-above --threshold 30 --missing skip 2>&1 | tee target/llvm-cov/crap-report.txt

      - name: Upload Rust quality diagnostics
        timeout-minutes: 2
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-quality-diagnostics
          retention-days: 7
          path: |
            target/llvm-cov/crap-report.txt
            target/llvm-cov/lcov.info
            target/llvm-cov/nextest-objects.json
            target/llvm-cov/nextest-objects.rsp

      - name: Summarize failing Rust CRAP rows
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          cargo crap --lcov target/llvm-cov/lcov.info --threshold 30 --missing skip \
            --format markdown --min 30 --top 20 --output target/llvm-cov/crap-threshold.md
          cat target/llvm-cov/crap-threshold.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded Rust CRAP report
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-crap-threshold
          path: target/llvm-cov/crap-threshold.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cyclomatic complexity threshold
        timeout-minutes: 2
        # Without LCOV, optimistic coverage makes CRAP equal cyclomatic complexity.
        # Include workspace source even when coverage omits it (such as src/tests/).
        run: cargo crap --workspace --missing optimistic --fail-above --threshold 30 --summary

      - name: Preserve merged Rust coverage profiles
        timeout-minutes: 1
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/preserve-rust-profiles.cjs \
            "$CARGO_LLVM_COV_TARGET_DIR" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/no-mistakes-profraw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Enforce Rust coverage floors
        id: rust-coverage-floors
        if: ${{ !cancelled() && steps.rust-coverage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # Native --fail-under flags render a table and then export full JSON again.
          # Summary totals preserve the same gate without both expensive passes.
          cargo llvm-cov report --json --summary-only \
            --output-path target/llvm-cov/summary.json
          node .github/scripts/rust-coverage-floors.cjs target/llvm-cov/summary.json \
            "${RUST_COVERAGE_FAIL_UNDER_LINES}" \
            "${RUST_COVERAGE_FAIL_UNDER_FUNCTIONS}" \
            "${RUST_COVERAGE_FAIL_UNDER_REGIONS}"

      - name: Write uncovered Rust region details
        if: ${{ !cancelled() && steps.rust-coverage-floors.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --json --output-path target/llvm-cov/regions.json

      - name: Upload uncovered Rust region details
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/regions.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-regions
          path: target/llvm-cov/regions.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Rust coverage summary
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/summary.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-summary
          path: target/llvm-cov/summary.json
          if-no-files-found: error
          retention-days: 7

      # Codecov is reporting only; the floors above gate coverage, so an outage must not block merges.
      - name: Upload Rust coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: true

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust tests job failure" target

      - name: Require successful Rust producer and all test shards
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          BUILD_RESULT: ${{ needs.rust-coverage-build.result }}
          SHARD_RESULT: ${{ needs.rust-coverage-shards.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success
  docs-tests:
    name: Docs tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/doctests
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Rust doctest artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: rust-doctests-v1
          workspaces: . -> target/doctests
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust doctests
        timeout-minutes: 20
        run: bash .github/scripts/rust-validation.sh doc
      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust doctest job failure" target/doctests

  tests-gate:
    name: Tests with coverage
    needs:
      [
        changes,
        quality,
        docs-tests,
        packages,
        javascript-tests,
        timeout-policy-browser-tests,
        native-tests,
        tests,
        tests-standalone-lib,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check test and quality results
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result==="skipped" && process.env.RUST_REQUIRED==="false" && /^(docs-tests|tests|tests-standalone-lib)$/.test(name)) continue; if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  ast-analysis:
    name: AST analysis
    needs: linux-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 11

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux runtime
        timeout-minutes: 6
        env:
          NATIVE_RUNTIME_RUN_ID: ${{ needs.linux-runtime.outputs.artifact-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download-native-runtime.py linux-runtime-cli
      - name: Restore CLI executable mode
        timeout-minutes: 3
        run: chmod +x target/debug/no-mistakes
      - name: Run no-mistakes check
        timeout-minutes: 2
        run: target/debug/no-mistakes check

      - name: Install ast-grep
        timeout-minutes: 5
        run: |
          curl -sSfL -o ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.44.1/app-x86_64-unknown-linux-gnu.zip
          echo "611f9e5e76f2611ecea1a35dd3468ceedf600641a11224b80341d79c6ee7b9dd  ast-grep.zip" | sha256sum -c -
          unzip -o ast-grep.zip ast-grep
          chmod +x ast-grep
          sudo mv ast-grep /usr/local/bin/ast-grep
          rm ast-grep.zip

      - name: Run ast-grep rule tests
        timeout-minutes: 2
        run: ast-grep test --skip-snapshot-tests

      - name: Run ast-grep scan
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            base="${BASE_SHA}"
          else
            git fetch --no-tags --depth=1 origin main
            base="origin/main"
          fi
          ast-grep scan --off=no-inline-test-fixture-write --off=no-inline-test-fixture-write-cfg
          python3 .ast-grep/check-inline-fixture-writes.py --base "${base}"
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  bench:
    name: Build benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    outputs:
      cache-key: ${{ steps.package.outputs.cache-key }}
      sha256: ${{ steps.package.outputs.sha256 }}
      cache-ready: ${{ steps.cache-probe.outputs.cache-hit }}
    # Must match benchmark-shards. ubuntu-latest mixes Intel and AMD, which
    # changes CodSpeed's simulated cycles. ubuntu-24.04-arm is one CPU
    # generation, and the uploaded harness must be built for that machine.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      RAYON_NUM_THREADS: "4"
      # CodSpeed simulation/memory do not need production fat LTO. The release
      # profile's lto=true + codegen-units=1 OOMs or forces CARGO_BUILD_JOBS=1
      # on a four-core hosted runner. Relative CodSpeed comparisons are meaningful
      # only when base and head both use ubuntu-24.04-arm.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          key: bench-${{ runner.arch }}

          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-codspeed
        timeout-minutes: 5
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      # rustc and ld peak near this runner's memory limit: see issue 3024.
      - name: Add swap for the benchmark build
        timeout-minutes: 2
        run: >-
          sudo fallocate -l 8G /swapfile-bench
          && sudo chmod 600 /swapfile-bench
          && sudo mkswap /swapfile-bench
          && sudo swapon /swapfile-bench

      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build CPU benchmarks
        timeout-minutes: 45
        run: >-
          bash .github/scripts/with-resource-samples.sh
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m simulation

      - name: Verify fresh-process frontend call counts
        timeout-minutes: 2
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          NO_MISTAKES_BENCH_EXECUTABLE="$(realpath "${binaries[0]}")" node --test .github/scripts/frontend-lifecycle.test.cjs
          python3 -m unittest discover -s .github/scripts -p test_frontend_lifecycle_profile.py

      - name: Build memory benchmarks
        timeout-minutes: 20
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m memory

      - name: Package benchmark executables
        id: package
        timeout-minutes: 2
        run: |
          tar -C target/codspeed -cf codspeed-analysis.tar analysis
          digest="$(sha256sum codspeed-analysis.tar | cut -d ' ' -f 1)"
          source="$(git rev-parse HEAD)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          # Publish the producer attempt; failed-shard reruns must reuse this key.
          echo "cache-key=codspeed-handoff-v1-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${source}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Cache benchmark executables
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Confirm exact benchmark cache is available
        if: ${{ github.ref == 'refs/heads/main' }}
        id: cache-probe
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar
          lookup-only: true

      - name: Upload benchmark executables
        id: artifact
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codspeed-analysis
          path: codspeed-analysis.tar
          # Low-cost compression reduces the harness transferred to every shard.
          compression-level: 1
          retention-days: 1

      - name: Require an available benchmark transport
        timeout-minutes: 1
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: bash .github/scripts/benchmark-handoff.sh available
  benchmark-shards:
    name: Benchmark (${{ matrix.name }})
    needs:
      - changes
      - bench
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    # Must match bench so the downloaded harness matches this machine's arch.
    runs-on: ubuntu-24.04-arm
    # Allow the ten-minute harness transfer plus a six-minute cold instrument
    # install, with room for checkout, extraction and several shards per job.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU group 1
            mode: simulation
            lifecycle: false
            shards: >-
              query
              check
              graph-gates
              query-indexes
          - name: CPU group 2
            mode: simulation
            lifecycle: false
            shards: >-
              native-frontends
              graph-core
              observer
              graph-production:graph_production_finalization::selector_append$
              graph-production:graph_production_finalization::node_id_finalization$
              language-frontends
              tests-plan
              graph-finalization
          - name: memory group 1
            mode: memory
            lifecycle: true
            shards: >-
              language-frontends
              query
              check
              query-indexes
          - name: memory group 2
            mode: memory
            lifecycle: false
            shards: >-
              native-frontends
              graph-core
              graph-gates
              graph-production:graph_production_finalization::selector_append$
              graph-production:graph_production_finalization::node_id_finalization$
              observer
              tests-plan
              graph-finalization
    env:
      BENCHMARK_SCOPE: ${{ needs.changes.outputs.benchmark-scope }}
      BENCHMARK_SHARDS: ${{ matrix.shards }}
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
      RAYON_NUM_THREADS: "4"

    steps:
      - name: Select benchmark shards
        id: select
        timeout-minutes: 1
        run: |
          selected=()
          for entry in $BENCHMARK_SHARDS; do
            shard="${entry%%:*}"
            if [[ "$BENCHMARK_SCOPE" == all || "$BENCHMARK_SCOPE" == *"$shard"* ]]; then
              selected+=("$entry")
            fi
          done
          echo "entries=${selected[*]}" >> "$GITHUB_OUTPUT"
          echo "any=$([[ ${#selected[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.select.outputs.any == 'true' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore exact benchmark executables
        id: benchmark-cache
        if: ${{ needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Verify cached benchmark executables
        id: verify-cache
        if: ${{ steps.benchmark-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Download fallback benchmark executables
        if: ${{ steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis

      - name: Verify benchmark executables before extraction
        if: ${{ steps.select.outputs.any == 'true' }}
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Extract benchmark executables
        if: ${{ steps.select.outputs.any == 'true' }}
        timeout-minutes: 2
        run: |
          mkdir -p target/codspeed
          tar -C target/codspeed -xf codspeed-analysis.tar

      # CodSpeed's instrument cache key omits libc. After an image libc6 update, an
      # exact-key hit restores libc6-dbg symbols that no longer match libc, so every
      # run reinstalls from apt and the stale entry is never replaced.
      - name: Read libc version for the instrument cache
        id: libc
        if: ${{ steps.select.outputs.any == 'true' }}
        timeout-minutes: 2
        run: echo "version=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks
        if: ${{ steps.select.outputs.any == 'true' }}
        # A cache hit finishes quickly. The first run on this runner, and the
        # first run after a libc6 update, installs valgrind and libc6-dbg.
        timeout-minutes: 12
        env:
          BENCHMARK_ENTRIES: ${{ steps.select.outputs.entries }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: ${{ matrix.mode }}
          # actions/cache versions entries by path, so this also keys the cache by libc6.
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          run: |
            mapfile -t benchmarks < <(find target/codspeed/analysis -type f -perm -111)
            if [[ "${#benchmarks[@]}" -ne 1 ]]; then
              echo "Expected one benchmark executable, found ${#benchmarks[@]}" >&2
              exit 1
            fi
            for entry in $BENCHMARK_ENTRIES; do
              shard="${entry%%:*}"
              filter=""
              if [[ "$entry" == *:* ]]; then
                filter="${entry#*:}"
              fi
              if [[ -n "$filter" ]]; then
                NO_MISTAKES_BENCH_SHARD="$shard" "${benchmarks[0]}" "$filter"
              else
                NO_MISTAKES_BENCH_SHARD="$shard" "${benchmarks[0]}"
              fi
            done

      - name: Run unique frontend lifecycle memory controls
        if: ${{ matrix.lifecycle && contains(steps.select.outputs.entries, 'language-frontends') }}
        timeout-minutes: 6
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          config: .github/frontend-lifecycle.yml
  frontend-lifecycle-smoke:
    name: Frontend lifecycle memory smoke
    needs: [changes, bench]
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.body, '<!-- frontend-lifecycle-smoke: v1 -->') &&
          needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RAYON_NUM_THREADS: "4"
      NO_MISTAKES_BENCH_SHARD: language-frontends
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact benchmark executable cache
        id: cache
        if: ${{ needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar
      - name: Verify cache
        id: verify-cache
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
      - name: Download exact same-run fallback
        if: ${{ steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis
      - name: Verify handoff and freeze provenance
        id: provenance
        timeout-minutes: 2
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
          FRONTEND_SMOKE_ROOT: ${{ runner.temp }}/frontend-lifecycle-smoke
        run: |
          echo "FRONTEND_SMOKE_ROOT=$FRONTEND_SMOKE_ROOT" >> "$GITHUB_ENV"
          bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
          mkdir -p target/codspeed "$FRONTEND_SMOKE_ROOT"/profiles
          tar -C target/codspeed -xf codspeed-analysis.tar
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          sha256sum "${binaries[0]}" | cut -d ' ' -f 1 > "$FRONTEND_SMOKE_ROOT/executable.sha256"
          git rev-parse HEAD > "$FRONTEND_SMOKE_ROOT/source.txt"
          sha256sum Cargo.lock codspeed-analysis.tar > "$FRONTEND_SMOKE_ROOT/inputs.sha256"
          uname -a > "$FRONTEND_SMOKE_ROOT/machine.txt"
          lscpu >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          cat /etc/os-release >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          printf 'order=original,cold_first_analysis,conditioning_inclusive,extract_after_recorded_prefix,extract_after_recorded_prefix,conditioning_inclusive,cold_first_analysis,original\nsamplesPerMode=2\nrayonWorkers=4\nrunner=5.4.0\ncriterion=5.0.1\nbenchLto=false\nbenchCodegenUnits=16\nfeatures=test-instrumentation\nnoDefaultFeatures=true\n' > "$FRONTEND_SMOKE_ROOT/design.txt"
          echo "libc=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"
      - name: Measure the declared eight fresh processes
        id: samples
        timeout-minutes: 6
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          TMPDIR: ${{ runner.temp }}/frontend-lifecycle-smoke/profiles
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.provenance.outputs.libc }}
          config: .github/frontend-lifecycle-smoke.yml
      - name: Verify all raw profiles and CI execution identity
        timeout-minutes: 1
        env:
          SAMPLE_RUN_ID: ${{ steps.samples.outputs.run-id }}
          SAMPLE_CI_RUN: ${{ github.run_id }}
          SAMPLE_CI_ATTEMPT: ${{ github.run_attempt }}
          SAMPLE_CI_JOB: ${{ github.job }}
        run: python3 .github/scripts/frontend-lifecycle-profile.py all
      - name: Retain all separate sample profiles and timelines
        if: ${{ always() && steps.provenance.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-lifecycle-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-lifecycle-smoke/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
  benchmark-gate:
    name: Benchmarks
    needs:
      - changes
      - bench
      - benchmark-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Check benchmark results
        timeout-minutes: 1
        env:
          BENCHMARKS_CHANGED: ${{ needs.changes.outputs.benchmarks }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.bench.result }}
          SHARD_RESULT: ${{ needs.benchmark-shards.result }}
        run: |
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Benchmark change detection failed." >&2
            exit 1
          fi

          if [[ "$BENCHMARKS_CHANGED" != "true" ]]; then
            echo "Benchmarks skipped: no benchmark-relevant change, or a pull request without the benchmarks opt-in marker."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "Benchmark build or execution failed." >&2
            exit 1
          fi

  retain-caches:
    name: Retain caches
    needs:
      - linux-runtime
      - native-build
      - native-build-macos
      - native-test-build
      - native-test-build-macos
      - standalone-build
      - rust-coverage-build
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'success') }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ./.github/workflows/cache-retention.yml
    with:
      best_effort: true
