name: Test CI

on:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Build with no restored Rust target caches
        type: boolean
        default: false
      reuse_build_run:
        description: Successful same-commit dispatch whose build artifacts should be reused
        type: string
        default: ""
      profile_native_compile:
        description: Measure cold macOS runtime then test compilation in one target directory
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - ci/cold-build
      - "ci/warm-build-*"

permissions:
  contents: read
  actions: read

# PRs share a group per PR so superseded runs are cancelled. Manual dispatches
# use a per-run group (`dispatch-<run_id>`) so a push never replaces a pending
# dispatch. Push runs group by ref and never cancel a started run: a main run
# that has started completes, and GitHub keeps only the newest waiting main run,
# so commits pushed in between get no Test CI run.
# macOS jobs add a job-level group. A push to main shares
# ci-macos-main-<job>-<shard> for each build-and-test job, with
# cancel-in-progress false: a newer main push drops the
# older pending job in that slot, and a running job finishes. The group uses
# the literal job id because github.job is unset outside a step. Pull requests,
# dispatch, and other branches use a per-run slot, so they never join
# ci-macos-main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  COLD_BUILD: ${{ (inputs.cold_cache || github.ref == 'refs/heads/ci/cold-build') && 'true' || 'false' }}
  REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run || '' }}
  # Quote "no": a bare YAML no is a boolean. Snapshot tests must fail on drift.
  INSTA_UPDATE: "no"
  # Rust coverage floor percentages. Keep codecov.yml rust `target` in sync.
  RUST_COVERAGE_FAIL_UNDER_LINES: "98"
  RUST_COVERAGE_FAIL_UNDER_FUNCTIONS: "98"
  RUST_COVERAGE_FAIL_UNDER_REGIONS: "98"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      timeout-policy-browser: ${{ steps.timeout-policy-browser-paths.outputs.changed }}
      # Path metadata only; Rust and macOS use their own conservative scopes.
      docs-only: ${{ github.event_name == 'pull_request' && steps.docs-only-paths.outputs.docs-only == 'true' }}
      # Pull requests run macOS smoke when the changed paths can affect it.
      # Pushes and workflow_dispatch run the full suite. Release is a separate workflow.
      macos: ${{ github.event_name != 'pull_request' }}
      macos-smoke: ${{ github.event_name == 'pull_request' && steps.rust-paths.outputs.macos-smoke != 'false' }}
      # Pull requests run one Windows smoke job instead of the full Windows suite.
      windows: ${{ github.event_name != 'pull_request' }}
      windows-smoke: ${{ github.event_name == 'pull_request' && steps.rust-paths.outputs.rust != 'false' }}
      rust: ${{ github.event_name != 'pull_request' || steps.rust-paths.outputs.rust != 'false' }}

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve diff base
        id: diff-base
        timeout-minutes: 2
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA=$(node .github/scripts/push-diff-base.cjs \
            --event "$GITHUB_EVENT_NAME" \
            --workflow ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --head "$HEAD_SHA" \
            --pr-base "$PR_BASE_SHA" \
            --current-run-id "$GITHUB_RUN_ID")
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check timeout-policy browser paths
        id: timeout-policy-browser-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/timeout-policy-browser-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/timeout-policy-browser-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Check docs-only paths
        id: docs-only-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/docs-only-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/docs-only-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Check Rust paths
        id: rust-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          emit_native_scopes() {
            local input=$1
            shift
            node .github/scripts/rust-pr-scope.cjs "$@" < "$input" >> "$GITHUB_OUTPUT"
            DIFF_BASE="${DIFF_BASE:-}" node .github/scripts/macos-pr-scope.cjs "$@" < "$input" >> "$GITHUB_OUTPUT"
          }

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            emit_native_scopes /dev/null --all
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null &&
               ! git fetch --no-tags --depth=1 origin "$sha"; then
              emit_native_scopes /dev/null --all
              exit 0
            fi
          done

          # Pull requests diff from the merge base. Pushes keep the endpoint comparison.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            attempts=0
            while ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; do
              attempts=$((attempts + 1))
              if (( attempts > 4 )); then
                emit_native_scopes /dev/null --all
                exit 0
              fi
              if ! git fetch --no-tags --deepen=300 origin "$BASE_SHA" "$HEAD_SHA"; then
                emit_native_scopes /dev/null --all
                exit 0
              fi
            done
          fi

          if ! DIFF_BASE=$(node .github/scripts/pr-diff-scope.cjs --diff-base "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"); then
            emit_native_scopes /dev/null --all
            exit 0
          fi

          if ! git diff --no-renames --name-status -z "$DIFF_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/native-changes"; then
            emit_native_scopes /dev/null --all
            exit 0
          fi
          emit_native_scopes "$RUNNER_TEMP/native-changes"
  quality-source:
    name: Source policy and tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check committed binary files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail

          escape_workflow_command_property() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          matches="$(mktemp)"
          trap 'rm -f "$matches"' EXIT

          if git grep --cached -z -l -a -P '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' -- . > "$matches"; then
            :
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              exit 0
            fi
            exit "$status"
          fi

          fail=0
          while IFS= read -r -d '' path; do
            metadata="$(git ls-files -s -- "$path")"
            mode="${metadata%% *}"

            if [[ "$mode" != 100644 && "$mode" != 100755 ]]; then
              continue
            fi

            # Preserve the exact binary input used by the source-decoding regression.
            if [[ "$path" == fixtures/symbols/signature-impact-encoding/tolerated/binary.mts &&
                  "$(git rev-parse --verify ":$path")" == e0563b2d6bce0d1f255e8f20befd1e8acd9ca2d9 ]]; then
              continue
            fi

            escaped_path="$(escape_workflow_command_property "$path")"
            printf '::error file=%s::Committed binary file detected; remove it from Git or replace it with a text placeholder.\n' "$escaped_path"
            fail=1
          done < "$matches"
          exit "$fail"
      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Codecov config
        timeout-minutes: 2
        run: curl --data-binary @codecov.yml https://codecov.io/validate
      - name: Check Rust validation parity
        timeout-minutes: 2
        run: node --test .github/scripts/coverage-build-resources.test.cjs .github/scripts/release-rust-resources.test.cjs .github/scripts/release-rust-split.test.cjs .github/scripts/release-rust-split-workflow.test.cjs .github/scripts/rust-validation.test.cjs .github/scripts/rust-coverage-floors.test.cjs .github/scripts/preserve-rust-profiles.test.cjs .github/scripts/publish-npm.test.cjs .github/scripts/build-native.test.cjs
      - name: Test release parity invocation without tooling dependencies
        timeout-minutes: 2
        run: node --test .github/scripts/release-parity-invocation.test.cjs
      - name: Test PostgreSQL setup policy
        timeout-minutes: 2
        run: python3 -m unittest discover -s .github/actions/start-test-postgres -p 'test_*.py'
      - name: Test Codex rules eval runner
        timeout-minutes: 2
        run: python3 -m unittest discover -s evals
      - name: Test Rust disk diagnostics
        timeout-minutes: 2
        run: node --test .github/scripts/rust-disk-usage.test.cjs .github/scripts/drop-rust-test-executables.test.cjs
      - name: Test resource sampling wrapper
        timeout-minutes: 2
        run: node --test .github/scripts/with-resource-samples.test.cjs
      - name: Read Python version for frontend memory accounting
        id: accounting-python
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          requirements_hash="${{ hashFiles('.github/scripts/frontend-memory-accounting/requirements.txt') }}"
          {
            echo "version=${version}"
            echo "cache-primary-key=frontend-memory-accounting-wheels-v1-${RUNNER_OS}-${RUNNER_ARCH}-py${version}-${requirements_hash}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore frontend memory accounting wheels
        id: accounting-wheels
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.accounting-python.outputs.cache-primary-key }}
          path: ${{ runner.temp }}/frontend-memory-accounting-wheels
      - name: Test frontend memory accounting
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            .github/scripts/frontend-memory-accounting/install-wheels.test.cjs \
            .github/scripts/frontend-memory-accounting-workflow.test.cjs
          bash .github/scripts/frontend-memory-accounting/install-wheels.sh \
            .github/scripts/frontend-memory-accounting/requirements.txt \
            "$RUNNER_TEMP/frontend-memory-accounting-wheels" \
            "$RUNNER_TEMP/frontend-memory-accounting-venv"
          PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/frontend-memory-accounting-venv/bin/python" \
            .github/scripts/frontend-memory-accounting/test_accounting.py
      - name: Save frontend memory accounting wheels
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.accounting-wheels.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.accounting-python.outputs.cache-primary-key }}
          path: ${{ runner.temp }}/frontend-memory-accounting-wheels
      - name: Test benchmark workflow contracts
        timeout-minutes: 2
        run: node --test .github/scripts/benchmark-handoff.test.cjs .github/scripts/benchmark-rustflags.test.cjs
      - name: Test parallel CI contracts
        timeout-minutes: 2
        run: node --test .github/scripts/cache-retention.test.cjs .github/scripts/cache-topology.test.cjs .github/scripts/standalone-shards.test.cjs .github/scripts/standalone-build-resources.test.cjs .github/scripts/standalone-download.test.cjs .github/scripts/network-setup-retry.test.cjs .github/scripts/vitest-shard.config.test.cjs .github/scripts/ci-parallel-layout.test.cjs .github/scripts/libtest-argv-runner.test.cjs .github/scripts/cargo-cache-inputs.test.cjs .github/scripts/native-cargo-units.test.cjs .github/scripts/native-compile-profile.test.cjs .github/scripts/native-compile-profile-workflow.test.cjs .github/scripts/pr-diff-scope.test.cjs .github/scripts/push-diff-base.test.cjs .github/scripts/fixture-baseline-workflow.test.cjs .github/scripts/smoke-tests.test.cjs .github/scripts/rust-pr-scope.test.cjs .github/scripts/macos-pr-scope.test.cjs .github/scripts/rust-build-deadlines.test.cjs .github/scripts/postgres-source-identities.test.cjs .github/scripts/javascript-coverage-upload-budget.test.cjs .github/scripts/ci-no-serialization.test.cjs
      - name: Test documentation link scope and gateway handling
        timeout-minutes: 2
        run: node --test .github/scripts/lychee-gateway.test.cjs .github/scripts/lychee-github-gateway.test.cjs .github/scripts/lychee-inputs.test.cjs
      - name: Test bounded native runtime download
        timeout-minutes: 2
        run: python3 -m unittest discover -s .github/scripts -p test_download_native_runtime.py
      - name: Test native timing isolation and regression detection
        timeout-minutes: 2
        run: node --test .github/scripts/native-api-timing.integration.test.cjs .github/scripts/native-api-shards.test.cjs .github/scripts/linux-api-shards-workflow.test.cjs
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  quality-rust:
    name: Rust quality (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.name == 'PostgreSQL source identities' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-feature Clippy
            command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            flags: -D warnings
          - name: default-feature Clippy
            command: cargo clippy --locked -p no-mistakes --all-targets -- -D warnings
            flags: -D warnings
          - name: release warnings
            command: cargo check --locked --workspace --release --lib --bins --benches --no-default-features --features test-instrumentation
            flags: -D warnings
          - name: no-default test check
            command: cargo check --locked --tests --no-default-features -p no-mistakes
            flags: -D warnings
          - name: PostgreSQL source identities
            command: bash .github/scripts/with-resource-samples.sh node .github/scripts/postgres-source-identities.cjs
            flags: -D warnings
          - name: coverage warnings
            command: cargo check --locked --workspace --lib --tests --all-features
            flags: -D warnings --cfg coverage
    env:
      RUSTFLAGS: ${{ matrix.flags }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: ${{ contains(matrix.name, 'Clippy') && 'clippy, rustfmt' || '' }}
      - name: Cache Rust quality artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: ${{ matrix.name == 'release warnings' && 'rust-quality-release-check-v1' || 'linux-runtime-v1' }}
          cache-workspace-crates: false
          env-vars: NM_CI_RUST_CACHE_PROFILE
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.name != 'default-feature Clippy' }}
        env:
          NM_CI_RUST_CACHE_PROFILE: ${{ startsWith(matrix.command, 'cargo clippy ') && 'clippy-check' || '' }}
      - name: Install nextest
        if: ${{ matrix.name == 'PostgreSQL source identities' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.151
      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Run isolated Rust quality check
        timeout-minutes: ${{ matrix.name == 'PostgreSQL source identities' && 30 || 18 }}
        run: ${{ matrix.command }}
      - name: Check Rust formatting
        if: ${{ !cancelled() && matrix.name == 'all-feature Clippy' }}
        timeout-minutes: 2
        run: cargo fmt --all -- --check
      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "quality job failure"
  quality-js:
    name: JavaScript policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript formatting
        timeout-minutes: 2
        run: pnpm run fmt:js:check
      - name: Run JavaScript lint
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: pnpm run lint:js
      - name: Check JavaScript duplication
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: pnpm run lint:duplicates
      - name: Check spelling
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: pnpm run lint:spell
  quality-links:
    name: Documentation links
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      LYCHEE_REPORT: lychee/out.md
      LYCHEE_GATEWAY_WAIT: "10,20"
      # docs/performance/2238/39488578982/README.md and tables.md are hash-locked by checksums.json.
      LYCHEE_ARGS: >-
        --no-progress
        --remap '^https://github\.com/jongleberry/no-mistakes/blob/main/docs/ file://${{ github.workspace }}/docs/'
        --exclude-path ^fixtures/
        --exclude-path 'docs/performance/2238/39488578982/(README|tables)\.md$'
        --files-from "$RUNNER_TEMP/lychee-inputs.txt"
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select link sources
        id: link-inputs
        timeout-minutes: 1
        shell: bash
        run: |
          node .github/scripts/lychee-inputs.cjs > "$RUNNER_TEMP/lychee-inputs.txt"
          node .github/scripts/lychee-inputs.cjs --offline > "$RUNNER_TEMP/lychee-offline-inputs.txt"
          if [[ -s "$RUNNER_TEMP/lychee-inputs.txt" ]]; then
            echo "has-inputs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changed documentation link sources."
          fi
          if [[ -s "$RUNNER_TEMP/lychee-offline-inputs.txt" ]]; then
            echo "has-offline-inputs=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Lychee (internal links)
        id: internal-links
        if: ${{ steps.link-inputs.outputs.has-offline-inputs == 'true' }}
        timeout-minutes: 2
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --remap '^https://github\.com/jongleberry/no-mistakes/blob/main/docs/ file://${{ github.workspace }}/docs/'
            --exclude-path ^fixtures/
            --exclude-path 'docs/performance/2238/39488578982/(README|tables)\.md$'
            --files-from "$RUNNER_TEMP/lychee-offline-inputs.txt"
          fail: true
          failIfEmpty: true
          output: lychee/internal-out.md
      - name: Run Lychee
        id: links
