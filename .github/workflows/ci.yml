name: Test CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  RUSTFLAGS: "-D warnings"
  # cargo llvm-cov fail-under percentages. Keep codecov.yml rust `target` in sync.
  RUST_COVERAGE_FAIL_UNDER_LINES: "99"
  RUST_COVERAGE_FAIL_UNDER_FUNCTIONS: "99"

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ steps.benchmark-paths.outputs.changed }}
      benchmark-scope: ${{ steps.benchmark-paths.outputs.scope }}

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check benchmark paths
        id: benchmark-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/benchmark-change-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/benchmark-change-scope.cjs >> "$GITHUB_OUTPUT"

  quality:
    name: Lint and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check committed binary files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail

          escape_workflow_command_property() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          matches="$(mktemp)"
          trap 'rm -f "$matches"' EXIT

          if git grep --cached -z -l -a -P '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' -- . > "$matches"; then
            :
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              exit 0
            fi
            exit "$status"
          fi

          fail=0
          while IFS= read -r -d '' path; do
            metadata="$(git ls-files -s -- "$path")"
            mode="${metadata%% *}"

            if [[ "$mode" != 100644 && "$mode" != 100755 ]]; then
              continue
            fi

            escaped_path="$(escape_workflow_command_property "$path")"
            printf '::error file=%s::Committed binary file detected; remove it from Git or replace it with a text placeholder.\n' "$escaped_path"
            fail=1
          done < "$matches"
          exit "$fail"

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install npm dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts

      - name: Validate Codecov config
        timeout-minutes: 2
        run: curl --data-binary @codecov.yml https://codecov.io/validate

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      - name: Check JavaScript formatting
        timeout-minutes: 2
        run: npm run fmt:js:check

      - name: Run Clippy
        timeout-minutes: 10
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Deny rustc warnings in release
        timeout-minutes: 10
        run: >
          cargo check --locked --workspace --release
          --lib --bins --benches
          --no-default-features
          --features test-instrumentation

      - name: Deny rustc warnings in coverage test builds
        timeout-minutes: 10
        env:
          RUSTFLAGS: "-D warnings --cfg coverage"
        run: cargo check --locked --workspace --lib --tests --all-features

      - name: Run Oxlint
        timeout-minutes: 2
        run: npm run lint:js

      - name: Run CSpell
        timeout-minutes: 5
        run: npm run lint:spell

      - name: Run Lychee
        timeout-minutes: 5
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-path ^fixtures/
            README.md
            docs/**/*.md
            skills/**/*.md
            packages/*/README.md
            crates/*/README.md
            CLAUDE.md
          fail: true

      - name: Check Cargo packages
        timeout-minutes: 10
        run: cargo publish --dry-run --locked -p no-mistakes

      - name: Check npm packages
        timeout-minutes: 2
        run: npm pack --dry-run --workspaces

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install npm dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: npm run build:js

      - name: Build N-API addon
        timeout-minutes: 10
        run: |
          NO_MISTAKES_BUILD_NAPI=1 cargo rustc --locked -p no-mistakes --lib --crate-type cdylib
          cp target/debug/libno_mistakes.so target/debug/no-mistakes.node

      - name: Run npm tests
        timeout-minutes: 5
        run: npm run test:ci --ignore-scripts

      - name: Run real N-API API test
        timeout-minutes: 2
        run: >-
          NO_MISTAKES_TEST_NAPI_ADDON_PATH="$GITHUB_WORKSPACE/target/debug/no-mistakes.node"
          npx vitest run packages/no-mistakes/scripts/real-napi-api.test.js --coverage=false

      - name: Upload JavaScript coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: javascript
          fail_ci_if_error: true

  tests:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # LLVM coverage maps do not require debugger symbols in ephemeral CI test binaries.
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-llvm-cov
        timeout-minutes: 5
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-llvm-cov

      - name: Clean Rust coverage artifacts
        timeout-minutes: 2
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace

      - name: Build Rust tests for coverage
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --workspace --all-features --lib --bins --tests --no-run

      - name: Run Rust tests for coverage
        timeout-minutes: 10
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --workspace --all-features --lib --bins --tests

      - name: Write and enforce Rust coverage
        id: rust-coverage
        timeout-minutes: 5
        run: |
          mkdir -p target/llvm-cov
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --lcov \
            --output-path target/llvm-cov/lcov.info \
            --fail-under-lines "${RUST_COVERAGE_FAIL_UNDER_LINES}" \
            --fail-under-functions "${RUST_COVERAGE_FAIL_UNDER_FUNCTIONS}"

      - name: Show Rust coverage table (debug)
        if: ${{ failure() && steps.rust-coverage.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report 2>&1 | tail -30
          cargo llvm-cov report --show-missing-lines 2>&1 | tail -60
        continue-on-error: true

      - name: Install cargo-crap
        timeout-minutes: 5
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-crap

      - name: Enforce CRAP threshold
        timeout-minutes: 2
        run: cargo crap --lcov target/llvm-cov/lcov.info --fail-above --threshold 30 --missing skip

      - name: Upload Rust coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: true

  tests-gate:
    name: Tests with coverage
    needs:
      - quality
      - javascript-tests
      - tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check test and quality results
        timeout-minutes: 1
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript-tests.result }}
          RUST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$JAVASCRIPT_RESULT" != "success" || "$RUST_RESULT" != "success" ]]; then
            echo "Quality checks, JavaScript tests, or Rust coverage failed." >&2
            exit 1
          fi

  ast-analysis:
    name: AST analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ast-analysis

      - name: Build no-mistakes check CLI
        timeout-minutes: 10
        run: cargo build -p no-mistakes

      - name: Run no-mistakes check
        timeout-minutes: 2
        run: target/debug/no-mistakes check

      - name: Install ast-grep
        timeout-minutes: 5
        run: |
          curl -sSfL -o ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.44.1/app-x86_64-unknown-linux-gnu.zip
          echo "611f9e5e76f2611ecea1a35dd3468ceedf600641a11224b80341d79c6ee7b9dd  ast-grep.zip" | sha256sum -c -
          unzip -o ast-grep.zip ast-grep
          chmod +x ast-grep
          sudo mv ast-grep /usr/local/bin/ast-grep
          rm ast-grep.zip

      - name: Run ast-grep rule tests
        timeout-minutes: 2
        run: ast-grep test --skip-snapshot-tests

      - name: Run ast-grep scan
        timeout-minutes: 2
        run: ast-grep scan

  bench:
    name: Build benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: "4"
      # CodSpeed simulation/memory do not need production fat LTO. The release
      # profile's lto=true + codegen-units=1 OOMs or forces CARGO_BUILD_JOBS=1
      # on ubuntu-latest (~16 min). Relative CodSpeed comparisons stay valid.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: bench

      - name: Install cargo-codspeed
        timeout-minutes: 5
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build CPU benchmarks
        timeout-minutes: 30
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m simulation

      - name: Build memory benchmarks
        timeout-minutes: 5
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m memory

      - name: Package benchmark executables
        timeout-minutes: 2
        run: tar -C target/codspeed -cf codspeed-analysis.tar analysis

      - name: Upload benchmark executables
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codspeed-analysis
          path: codspeed-analysis.tar
          compression-level: 0
          retention-days: 1

  benchmark-shards:
    name: Benchmark (${{ matrix.name }})
    needs:
      - changes
      - bench
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU check
            mode: simulation
            filter: ""
            benchmark-shard: check
          - name: CPU observer
            mode: simulation
            filter: ""
            benchmark-shard: observer
          - name: CPU tests-plan
            mode: simulation
            filter: ""
            benchmark-shard: tests-plan
          - name: CPU graph core
            mode: simulation
            filter: ""
            benchmark-shard: graph-core
          - name: CPU graph gates
            mode: simulation
            filter: ""
            benchmark-shard: graph-gates
          - name: CPU language frontends
            mode: simulation
            filter: ""
            benchmark-shard: language-frontends
          - name: CPU native frontends
            mode: simulation
            filter: ""
            benchmark-shard: native-frontends
          - name: CPU graph finalization
            mode: simulation
            filter: ""
            benchmark-shard: graph-finalization
          - name: CPU graph production node
            mode: simulation
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: CPU graph production selector
            mode: simulation
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: CPU query
            mode: simulation
            filter: ""
            benchmark-shard: query
          - name: memory check
            mode: memory
            filter: ""
            benchmark-shard: check
          - name: memory observer
            mode: memory
            filter: ""
            benchmark-shard: observer
          - name: memory tests-plan
            mode: memory
            filter: ""
            benchmark-shard: tests-plan
          - name: memory graph core
            mode: memory
            filter: ""
            benchmark-shard: graph-core
          - name: memory graph gates
            mode: memory
            filter: ""
            benchmark-shard: graph-gates
          - name: memory language frontends
            mode: memory
            filter: ""
            benchmark-shard: language-frontends
          - name: memory native frontends
            mode: memory
            filter: ""
            benchmark-shard: native-frontends
          - name: memory graph finalization
            mode: memory
            filter: ""
            benchmark-shard: graph-finalization
          - name: memory graph production node
            mode: memory
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: memory graph production selector
            mode: memory
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: memory query
            mode: memory
            filter: ""
            benchmark-shard: query
    env:
      BENCHMARK_FILTER: ${{ matrix.filter }}
      BENCHMARK_SELECTED: ${{ needs.changes.outputs.benchmark-scope == 'all' || contains(needs.changes.outputs.benchmark-scope, matrix.benchmark-shard) }}
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
      NO_MISTAKES_BENCH_SHARD: ${{ matrix.benchmark-shard }}
      RAYON_NUM_THREADS: "4"

    steps:
      - name: Checkout
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: codspeed-analysis

      - name: Extract benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        run: |
          mkdir -p target/codspeed
          tar -C target/codspeed -xf codspeed-analysis.tar

      - name: Run benchmarks
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: ${{ matrix.mode }}
          run: |
            mapfile -t benchmarks < <(find target/codspeed/analysis -type f -perm -111)
            if [[ "${#benchmarks[@]}" -ne 1 ]]; then
              echo "Expected one benchmark executable, found ${#benchmarks[@]}" >&2
              exit 1
            fi
            if [[ -n "$BENCHMARK_FILTER" ]]; then
              "${benchmarks[0]}" "$BENCHMARK_FILTER"
            else
              "${benchmarks[0]}"
            fi

  benchmark-gate:
    name: Benchmarks
    needs:
      - changes
      - bench
      - benchmark-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check benchmark results
        timeout-minutes: 1
        env:
          BENCHMARKS_CHANGED: ${{ needs.changes.outputs.benchmarks }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.bench.result }}
          SHARD_RESULT: ${{ needs.benchmark-shards.result }}
        run: |
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Benchmark change detection failed." >&2
            exit 1
          fi

          if [[ "$BENCHMARKS_CHANGED" != "true" ]]; then
            echo "No benchmark-relevant files changed."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "Benchmark build or execution failed." >&2
            exit 1
          fi
