          overwrite: true
          compression-level: 1


  native-api-tests:
    name: Native API tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes, native-build]
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NO_MISTAKES_BUILD_NAPI: "1"
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 1
            total: 6
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 2
            total: 6
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 3
            total: 6
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 4
            total: 6
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 5
            total: 6
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            shard: 6
            total: 6

    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ runner.os == 'Windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false

      - name: Download native-runtime
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUNTIME_RUN_ID: ${{ needs.native-build.outputs.artifact-run-id }}
          NATIVE_RUNTIME_TARGET: ${{ matrix.target }}
        run: python .github/scripts/download-native-runtime.py

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run native CLI smoke test
        timeout-minutes: 2
        shell: bash
        run: |
          chmod +x target/debug/no-mistakes* || true
          ./target/debug/no-mistakes${{ runner.os == 'Windows' && '.exe' || '' }} --version

      - name: Run real N-API API test
        timeout-minutes: 10
        id: real-napi
        shell: bash
        run: |
          set -euo pipefail
          addon_path="$(node -e 'process.stdout.write(require("node:path").resolve("target/debug/no-mistakes.node"))')"
          NO_MISTAKES_TEST_NAPI_ADDON_PATH="$addon_path" node .github/scripts/native-api-shards.cjs ${{ matrix.shard }} ${{ matrix.total }}

      - name: Report real N-API test durations
        if: ${{ !cancelled() && steps.real-napi.outcome != 'skipped' }}
        timeout-minutes: 2
        shell: bash
        # Hosted Windows wall time is noisy; retain warnings and all artifacts.
        run: node .github/scripts/report-native-api-tests.cjs target/native-api-tests.json target ${{ runner.os == 'Windows' && '--report-only' || '' }}

      - name: Upload real N-API test durations
        if: ${{ !cancelled() && hashFiles('target/native-api-tests.json') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-api-tests-${{ runner.os }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/native-api-tests.json
            target/native-api-inventory.json
            target/native-api-shard.json
            target/native-api-tests-durations.csv
            target/native-api-tests-summary.md

  # Keep the cold-build and test budgets on one runner. The existing step deadlines still apply.
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  native-api-tests-macos:
    name: Native API tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' && needs.changes.outputs.rust == 'true' }}
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ci-macos-main-native-api-tests-macos-{0}', matrix.shard) || format('ci-macos-{0}-native-api-tests-macos-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    env:
      NO_MISTAKES_BUILD_NAPI: "1"
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            shard: 1
            total: 1
            binary: ./target/debug/no-mistakes
            addon: target/debug/libno_mistakes.dylib
    outputs:
      built: ${{ steps.native-build-artifact.outcome == 'success' }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Set up pnpm and Node.js (attempt 1 of 2)
        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5

      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: native-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache native workspace artifacts by source
        id: native-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-runtime-workspace-v2-${{ matrix.target }}-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-runtime-workspace-v2-${{ matrix.target }}-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-cgu64-
            native-runtime-workspace-v2-${{ matrix.target }}-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      - name: Test native build diagnostics
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 2
        run: node --test .github/scripts/build-native.test.cjs .github/scripts/cargo-cache-inputs.test.cjs

      # no-mistakes-disable-next-line github-actions-step-timeouts -- #3514 measured cold compilation reserve; bounded by rust-build-deadlines.test.cjs.
      - name: Build native CLI and N-API addon
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 35
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics target/native-test-build-diagnostics
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/build-native.cjs
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          cp "${{ matrix.addon }}" target/debug/no-mistakes.node
          git restore --source=HEAD --worktree -- crates/no-mistakes/Cargo.toml

      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.native-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.native-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      - name: Upload native-runtime
        id: native-build-artifact
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-runtime-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 1
          path: |
            ${{ matrix.binary }}
