    uses: ./.github/workflows/cache-retention.yml
    with:
      best_effort: true

  retain-rust-coverage-build-cache:
    name: Retain rust-coverage-build cache
    needs: rust-coverage-build
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rust-coverage-build.result == 'success' }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ./.github/workflows/cache-retention.yml
    with:
      best_effort: true
