  javascript-tests:
    name: JavaScript tests
    needs: [javascript-coverage, linux-api-tests]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  timeout-policy-browser-tests:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Timeout-policy browser tests
            runtime: node@24
            artifact: timeout-policy-browser-lifecycle
          - name: Timeout-policy browser tests (Node 24.22.2)
            runtime: node@24.22.2
            artifact: timeout-policy-browser-lifecycle-node-24.22.2
    permissions:
      contents: read

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for timeout-policy browser tests
        timeout-minutes: 5
        # The runner image already ships Chromium's shared libraries; --with-deps
        # only added optional CJK/X fonts from apt, whose mirror stalls this step.
        run: pnpm exec playwright install chromium

      - name: Run timeout-policy browser tests
        timeout-minutes: 5
        env:
          SDK_CHILD_RECEIPT_FILE: ${{ runner.temp }}/timeout-policy-browser/receipts.jsonl
          SDK_CHILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/timeout-policy-browser"
          pnpm run test:timeout-policy-browser

      - name: Upload timeout-policy browser lifecycle
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/timeout-policy-browser
          if-no-files-found: warn
          retention-days: 7
  native-build:
    name: Native build (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NO_MISTAKES_BUILD_NAPI: "1"
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: ./target/debug/no-mistakes.exe
            addon: target/debug/no_mistakes.dll

    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ runner.os == 'Windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: native-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache native workspace artifacts by source
        id: native-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: native-runtime-workspace-v2-${{ matrix.target }}-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            native-runtime-workspace-v2-${{ matrix.target }}-${{ steps.native-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs

      - name: Test native build diagnostics
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 2
        run: node --test .github/scripts/build-native.test.cjs .github/scripts/cargo-cache-inputs.test.cjs

      # Linux `tests` owns the full suite. Native jobs only compile/run the
      # OS-specific invocation tests (Job Objects, process groups, signals).
      # Both native platforms use focused integration tests so cargo does not
      # typecheck the unrelated lib unit tests for platform regressions.
      #
      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type: Linux coverage should
      # not also link a cdylib.
      # Hosted macOS runs exceeded the former build and Rust step deadlines.
      - name: Build native CLI and N-API addon
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 20
        shell: bash
        env:
          NATIVE_RUST_CACHE_HIT: ${{ steps.native-workspace-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          rm -rf target/native-build-diagnostics target/native-test-build-diagnostics
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          node .github/scripts/build-native.cjs
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-cargo-inputs"
          cp "${{ matrix.addon }}" target/debug/no-mistakes.node

      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.native-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.native-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/nm-cargo-inputs
      - name: Upload native-runtime
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-runtime-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
          path: |
            ${{ matrix.binary }}
            target/debug/no-mistakes.node

      - name: Upload native build diagnostics
        if: ${{ (always()) && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-build-diagnostics-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            target/native-build-diagnostics

