        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rust-archive-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 1
          path: |
