name: Test CI

on:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Build with no restored Rust target caches
        type: boolean
        default: false
      reuse_build_run:
        description: Successful same-commit dispatch whose build artifacts should be reused
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main
      - ci/cold-build
      - "ci/warm-build-*"

permissions:
  contents: read
  actions: read

# PRs share a group per PR so superseded runs are cancelled. Every main push gets
# its own group (per SHA): GitHub replaces an older *pending* run in a shared
# group even with cancel-in-progress false, which dropped coverage uploads for
# middle commits when several merges landed together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  COLD_BUILD: ${{ (inputs.cold_cache || github.ref == 'refs/heads/ci/cold-build') && 'true' || 'false' }}
  REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run || '' }}
  # Quote "no": a bare YAML no is a boolean. Snapshot tests must fail on drift.
  INSTA_UPDATE: "no"
  # Rust coverage floor percentages. Keep codecov.yml rust `target` in sync.
  RUST_COVERAGE_FAIL_UNDER_LINES: "98"
  RUST_COVERAGE_FAIL_UNDER_FUNCTIONS: "98"
  RUST_COVERAGE_FAIL_UNDER_REGIONS: "98"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/ci/cold-build' && !startsWith(github.ref, 'refs/heads/ci/warm-build-') && steps.benchmark-paths.outputs.changed || 'false' }}
      benchmark-scope: ${{ steps.benchmark-paths.outputs.scope }}
      timeout-policy-browser: ${{ steps.timeout-policy-browser-paths.outputs.changed }}
      # Retained as path metadata; every PR runs all test families.
      docs-only: ${{ github.event_name == 'pull_request' && steps.docs-only-paths.outputs.docs-only == 'true' }}

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check benchmark paths
        id: benchmark-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/benchmark-change-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          # Disable rename detection so fixture moves emit both the deleted source
          # and added destination paths, selecting both semantic shards.
          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/benchmark-change-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Check timeout-policy browser paths
        id: timeout-policy-browser-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/timeout-policy-browser-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/timeout-policy-browser-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Check docs-only paths
        id: docs-only-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/docs-only-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/docs-only-scope.cjs >> "$GITHUB_OUTPUT"
  quality-source:
    name: Source policy and tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Codecov config
        timeout-minutes: 2
        run: curl --data-binary @codecov.yml https://codecov.io/validate
      - name: Check committed binary files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail

          escape_workflow_command_property() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          matches="$(mktemp)"
          trap 'rm -f "$matches"' EXIT

          if git grep --cached -z -l -a -P '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' -- . > "$matches"; then
            :
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              exit 0
            fi
            exit "$status"
          fi

          fail=0
          while IFS= read -r -d '' path; do
            metadata="$(git ls-files -s -- "$path")"
            mode="${metadata%% *}"

            if [[ "$mode" != 100644 && "$mode" != 100755 ]]; then
              continue
            fi

            # Preserve the exact binary input used by the source-decoding regression.
            if [[ "$path" == fixtures/symbols/signature-impact-encoding/tolerated/binary.mts &&
                  "$(git rev-parse --verify ":$path")" == e0563b2d6bce0d1f255e8f20befd1e8acd9ca2d9 ]]; then
              continue
            fi

            escaped_path="$(escape_workflow_command_property "$path")"
            printf '::error file=%s::Committed binary file detected; remove it from Git or replace it with a text placeholder.\n' "$escaped_path"
            fail=1
          done < "$matches"
          exit "$fail"
      - name: Check Rust validation parity
        timeout-minutes: 2
        run: node --test .github/scripts/rust-validation.test.cjs .github/scripts/rust-coverage-floors.test.cjs .github/scripts/preserve-rust-profiles.test.cjs .github/scripts/publish-npm.test.cjs .github/scripts/build-native.test.cjs
      - name: Test PostgreSQL setup policy
        timeout-minutes: 2
        run: python3 -m unittest discover -s .github/actions/start-test-postgres -p 'test_*.py'
      - name: Test Rust disk diagnostics
        timeout-minutes: 2
        run: node --test .github/scripts/rust-disk-usage.test.cjs .github/scripts/drop-rust-test-executables.test.cjs
      - name: Test resource sampling wrapper
        timeout-minutes: 2
        run: node --test .github/scripts/with-resource-samples.test.cjs
      - name: Test frontend memory accounting
        timeout-minutes: 2
        run: |
          python3 -m venv "$RUNNER_TEMP/frontend-memory-accounting-venv"
          "$RUNNER_TEMP/frontend-memory-accounting-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: --no-deps --retries 0 --timeout 20 -r .github/scripts/frontend-memory-accounting/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/frontend-memory-accounting-venv/bin/python" .github/scripts/frontend-memory-accounting/test_accounting.py
      - name: Test benchmark handoff guards
        timeout-minutes: 2
        run: node --test .github/scripts/benchmark-handoff.test.cjs
      - name: Test parallel CI contracts
        timeout-minutes: 2
        run: node --test .github/scripts/cache-retention.test.cjs .github/scripts/cache-topology.test.cjs .github/scripts/standalone-shards.test.cjs .github/scripts/vitest-shard.config.test.cjs .github/scripts/ci-parallel-layout.test.cjs .github/scripts/libtest-argv-runner.test.cjs .github/scripts/cargo-cache-inputs.test.cjs
  quality-rust:
    name: Rust quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-feature Clippy
            command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            flags: -D warnings
          - name: default-feature Clippy
            command: cargo clippy --locked -p no-mistakes --all-targets -- -D warnings
            flags: -D warnings
          - name: release warnings
            command: cargo check --locked --workspace --release --lib --bins --benches --no-default-features --features test-instrumentation
            flags: -D warnings
          - name: no-default test check
            command: cargo check --locked --tests --no-default-features -p no-mistakes
            flags: -D warnings
          - name: PostgreSQL source identities
            command: "cargo test --locked -p no-mistakes --lib --no-default-features --features test-instrumentation codebase::postgres::source::"
            flags: -D warnings
          - name: coverage warnings
            command: cargo check --locked --workspace --lib --tests --all-features
            flags: -D warnings --cfg coverage
          - name: formatting
            command: cargo fmt --all -- --check
            flags: -D warnings
    env:
      RUSTFLAGS: ${{ matrix.flags }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust quality artifacts
        if: ${{ matrix.name != 'formatting' && env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: ${{ matrix.name == 'release warnings' && 'rust-quality-release-check-v1' || 'linux-runtime-v1' }}
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run isolated Rust quality check
        timeout-minutes: 8
        run: ${{ matrix.command }}
      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "quality job failure"
  quality-js:
    name: JavaScript policy (${{ matrix.name }})
    runs-on: ubuntu-slim
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: formatting
            command: pnpm run fmt:js:check
          - name: lint
            command: pnpm run lint:js
          - name: duplication
            command: pnpm run lint:duplicates
          - name: spelling
            command: pnpm run lint:spell
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run isolated JavaScript policy check
        timeout-minutes: 5
        run: ${{ matrix.command }}
  quality-links:
    name: Documentation links
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Lychee
        timeout-minutes: 5
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --remap '^https://github\.com/jonathanong/no-mistakes/blob/main/docs/ file://${{ github.workspace }}/docs/'
            --exclude-path ^fixtures/
            README.md
            docs/**/*.md
            plugins/*/skills/**/*.md
            packages/*/README.md
            crates/*/README.md
            AGENTS.md
          fail: true
  quality:
    name: Lint and source checks
    needs: [quality-source, quality-rust, quality-js, quality-links]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  packages:
    name: Package checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 5
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux-runtime-v1
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cargo packages
        timeout-minutes: 10
        run: cargo publish --dry-run --locked -p no-mistakes

      - name: Check npm packages
        timeout-minutes: 2
        run: pnpm run pack:check

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "package job failure"
  linux-runtime:
    name: Build Linux runtime (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: cli
            binary: target/debug/no-mistakes
          - role: addon
            binary: target/debug/no-mistakes.node
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: linux-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Linux runtime artifacts
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: linux-runtime-v1
          cache-workspace-crates: false
          cache-on-failure: false
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache Linux workspace artifacts by source
        id: linux-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: linux-runtime-workspace-v2-${{ matrix.role }}-${{ steps.linux-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            linux-runtime-workspace-v2-${{ matrix.role }}-${{ steps.linux-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/linux-cargo-inputs
      - name: Restore verified Linux compiler input timestamps
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        shell: bash
        run: node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/linux-cargo-inputs"
      - name: Build Linux CLI
        if: ${{ (matrix.role == 'cli') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 10
        run: cargo build --locked -p no-mistakes --bin no-mistakes
      - name: Build Linux N-API addon
        if: ${{ (matrix.role == 'addon') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 10
        run: |
          NO_MISTAKES_BUILD_NAPI=1 cargo rustc --locked -p no-mistakes --lib --crate-type cdylib
          cp target/debug/libno_mistakes.so target/debug/no-mistakes.node
      - name: Record verified Linux compiler inputs
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        shell: bash
        run: node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/linux-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.linux-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.linux-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/debug
            target/.rustc_info.json
            ${{ runner.temp }}/linux-cargo-inputs
      - name: Upload Linux runtime
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-runtime-${{ matrix.role }}
          path: ${{ matrix.binary }}
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
  javascript-shards:
    name: JavaScript shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js
      - name: Run JavaScript tests
        timeout-minutes: 4
        run: pnpm run test:ci --config .github/scripts/vitest-shard.config.cjs --shard=${{ matrix.shard }}/4 --reporter=blob
      - name: Upload JavaScript shard report
        timeout-minutes: 3
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: javascript-shard-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 1
  javascript-coverage:
    name: Merge JavaScript coverage
    needs: javascript-shards
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download JavaScript shard reports
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: javascript-shard-*
          path: .vitest/blob
          merge-multiple: true
      - name: Enforce merged JavaScript coverage
        timeout-minutes: 5
        run: pnpm exec vitest --merge-reports --coverage --reporter=default --reporter=github-actions
      - name: Require all JavaScript shards
        timeout-minutes: 3
        if: ${{ always() }}
        env:
          SHARDS: ${{ needs.javascript-shards.result }}
        run: test "$SHARDS" = success
      - name: Upload JavaScript coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: javascript
          fail_ci_if_error: true
  linux-api-tests:
    name: Linux N-API tests
    needs: linux-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm and Node.js
