name: Test CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# PRs share a group per PR so superseded runs are cancelled. Every main push gets
# its own group (per SHA): GitHub replaces an older *pending* run in a shared
# group even with cancel-in-progress false, which dropped coverage uploads for
# middle commits when several merges landed together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Quote "no": a bare YAML no is a boolean. Snapshot tests must fail on drift.
  INSTA_UPDATE: "no"
  # cargo llvm-cov fail-under percentages. Keep codecov.yml rust `target` in sync.
  RUST_COVERAGE_FAIL_UNDER_LINES: "98"
  RUST_COVERAGE_FAIL_UNDER_FUNCTIONS: "98"
  RUST_COVERAGE_FAIL_UNDER_REGIONS: "98"

jobs:
  changes:
    name: Detect benchmark changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ steps.benchmark-paths.outputs.changed }}
      benchmark-scope: ${{ steps.benchmark-paths.outputs.scope }}
      timeout-policy-browser: ${{ steps.timeout-policy-browser-paths.outputs.changed }}

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check benchmark paths
        id: benchmark-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/benchmark-change-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          # Disable rename detection so fixture moves emit both the deleted source
          # and added destination paths, selecting both semantic shards.
          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/benchmark-change-scope.cjs >> "$GITHUB_OUTPUT"

      - name: Check timeout-policy browser paths
        id: timeout-policy-browser-paths
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node .github/scripts/timeout-policy-browser-scope.cjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha"
            fi
          done

          git diff --no-renames --name-status -z "$BASE_SHA" "$HEAD_SHA" |
            node .github/scripts/timeout-policy-browser-scope.cjs >> "$GITHUB_OUTPUT"

  quality:
    name: Lint and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check committed binary files
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail

          escape_workflow_command_property() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          matches="$(mktemp)"
          trap 'rm -f "$matches"' EXIT

          if git grep --cached -z -l -a -P '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' -- . > "$matches"; then
            :
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              exit 0
            fi
            exit "$status"
          fi

          fail=0
          while IFS= read -r -d '' path; do
            metadata="$(git ls-files -s -- "$path")"
            mode="${metadata%% *}"

            if [[ "$mode" != 100644 && "$mode" != 100755 ]]; then
              continue
            fi

            escaped_path="$(escape_workflow_command_property "$path")"
            printf '::error file=%s::Committed binary file detected; remove it from Git or replace it with a text placeholder.\n' "$escaped_path"
            fail=1
          done < "$matches"
          exit "$fail"

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Codecov config
        timeout-minutes: 2
        run: curl --data-binary @codecov.yml https://codecov.io/validate

      - name: Check Rust validation parity
        timeout-minutes: 2
        run: node --test .github/scripts/rust-validation.test.cjs

      - name: Check formatting
        timeout-minutes: 5
        run: cargo fmt --all -- --check

      - name: Check JavaScript formatting
        timeout-minutes: 2
        run: pnpm run fmt:js:check

      - name: Test Rust disk diagnostics
        timeout-minutes: 2
        run: node --test .github/scripts/rust-disk-usage.test.cjs

      - name: Test frontend memory accounting
        timeout-minutes: 2
        run: |
          python3 -m venv "$RUNNER_TEMP/frontend-memory-accounting-venv"
          "$RUNNER_TEMP/frontend-memory-accounting-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: --no-deps --retries 0 --timeout 20 -r .github/scripts/frontend-memory-accounting/requirements.txt
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/frontend-memory-accounting-venv/bin/python" .github/scripts/frontend-memory-accounting/test_accounting.py

      - name: Test benchmark handoff guards
        timeout-minutes: 2
        run: node --test .github/scripts/benchmark-handoff.test.cjs

      - name: Record Rust disk usage before Clippy
        timeout-minutes: 1
        run: bash .github/scripts/rust-disk-usage.sh "before Clippy"

      - name: Run Clippy
        timeout-minutes: 10
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Every other lib-test build enables test-instrumentation, so this is the
      # only check that instrumentation-only fields stay feature-gated (#2089).
      - name: Run Clippy with default features
        timeout-minutes: 10
        run: cargo clippy --locked -p no-mistakes --all-targets -- -D warnings

      - name: Record Rust disk usage after Clippy
        timeout-minutes: 1
        run: bash .github/scripts/rust-disk-usage.sh "after Clippy"

      - name: Deny rustc warnings in release
        timeout-minutes: 10
        run: >
          cargo check --locked --workspace --release
          --lib --bins --benches
          --no-default-features
          --features test-instrumentation

      - name: Test PostgreSQL source identities without default features
        timeout-minutes: 10
        run: >
          cargo test --locked -p no-mistakes --lib
          --no-default-features --features test-instrumentation
          codebase::postgres::source::

      - name: Deny rustc warnings in coverage test builds
        timeout-minutes: 10
        env:
          RUSTFLAGS: "-D warnings --cfg coverage"
        run: cargo check --locked --workspace --lib --tests --all-features

      - name: Run Oxlint
        timeout-minutes: 2
        run: pnpm run lint:js

      - name: Check code duplication
        timeout-minutes: 3
        run: pnpm run lint:duplicates

      - name: Run CSpell
        timeout-minutes: 5
        run: pnpm run lint:spell

      - name: Run Lychee
        timeout-minutes: 5
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --remap '^https://github\.com/jonathanong/no-mistakes/blob/main/docs/ file://${{ github.workspace }}/docs/'
            --exclude-path ^fixtures/
            README.md
            docs/**/*.md
            skills/**/*.md
            packages/*/README.md
            crates/*/README.md
            AGENTS.md
          fail: true

      - name: Check Cargo packages
        timeout-minutes: 10
        run: cargo publish --dry-run --locked -p no-mistakes

      - name: Check npm packages
        timeout-minutes: 2
        run: pnpm run pack:check

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "quality job failure"

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      - name: Build native CLI and N-API addon
        timeout-minutes: 10
        run: |
          cargo build --locked -p no-mistakes --bin no-mistakes
          NO_MISTAKES_BUILD_NAPI=1 cargo rustc --locked -p no-mistakes --lib --crate-type cdylib
          cp target/debug/libno_mistakes.so target/debug/no-mistakes.node

      - name: Run JavaScript tests
        timeout-minutes: 5
        run: pnpm run test:ci

      # real-napi-api.test.js already registers mutable receiver cases; list that suite only once.
      - name: Run real N-API API test
        timeout-minutes: 2
        id: real-napi
        run: >-
          NO_MISTAKES_TEST_NAPI_ADDON_PATH="$GITHUB_WORKSPACE/target/debug/no-mistakes.node"
          pnpm exec vitest run
          packages/no-mistakes/scripts/real-napi-api.test.js
          packages/no-mistakes/scripts/unused-disable-directives-api.test.js
          packages/no-mistakes/scripts/sql-verdicts-api.test.js
          packages/no-mistakes/scripts/foreign-receiver-declaration-order-api.test.js
          packages/no-mistakes/scripts/guarded-array-receiver-api.test.js
          packages/no-mistakes/scripts/forward-receiver-alias-api.test.js
          packages/no-mistakes/scripts/lexical-member-replacement-api.test.js
          packages/no-mistakes/scripts/exported-value-receiver-api.test.js
          packages/no-mistakes/scripts/namespace-types-api.test.js
          packages/no-mistakes/scripts/preserved-provenance-api.test.js
          packages/no-mistakes/scripts/vitest-project-setups-api.test.js
          tests/js/compiled-api-runtime.test.js
          packages/no-mistakes/scripts/annex-b-for-in-api.test.js
          packages/no-mistakes/scripts/forbidden-dependencies-globs-api.test.js
          packages/no-mistakes/scripts/type-import-order-api.test.js
          packages/no-mistakes/scripts/planning-impact-cli.test.js
          packages/no-mistakes/scripts/postgres-source-api.test.js
          packages/no-mistakes/scripts/postgres-expression-arbiter-api.test.js
          packages/no-mistakes/scripts/postgres-quantified-api.test.js
          packages/no-mistakes/scripts/postgres-procedural-utility-completeness-api.test.js
          packages/no-mistakes/scripts/postgres-procedural-loop-coverage-api.test.js
          packages/no-mistakes/scripts/postgres-procedural-occurrence-api.test.js
          packages/no-mistakes/scripts/doc-consistency-api.test.js
          --reporter=default --reporter=json --outputFile.json=target/native-api-tests.json
          --coverage=false

      - name: Report real N-API test durations
        if: ${{ !cancelled() && steps.real-napi.outcome != 'skipped' }}
        timeout-minutes: 2
        run: node .github/scripts/report-native-api-tests.cjs target/native-api-tests.json target

      - name: Upload real N-API test durations
        if: ${{ !cancelled() && hashFiles('target/native-api-tests.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-api-tests-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            target/native-api-tests.json
            target/native-api-tests-durations.csv
            target/native-api-tests-summary.md

      # Codecov is reporting only; an outage must not block merges.
      - name: Upload JavaScript coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: javascript
          fail_ci_if_error: true

  timeout-policy-browser-tests:
    name: Timeout-policy browser tests
    needs: changes
    if: ${{ needs.changes.outputs.timeout-policy-browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for timeout-policy browser tests
        timeout-minutes: 5
        # The runner image already ships Chromium's shared libraries; --with-deps
        # only added optional CJK/X fonts from apt, whose mirror stalls this step.
        run: pnpm exec playwright install chromium

      - name: Run timeout-policy browser tests
        timeout-minutes: 5
        run: pnpm run test:timeout-policy-browser

  native-tests:
    name: Native tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: ./target/debug/no-mistakes.exe
            addon: target/debug/no_mistakes.dll
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            binary: ./target/debug/no-mistakes
            addon: target/debug/libno_mistakes.dylib

    steps:
      - name: Exclude workspace from Microsoft Defender
        if: ${{ runner.os == 'Windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 2
        continue-on-error: true
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:USERPROFILE '.rustup')
          )
          foreach ($path in $paths) {
            Add-MpPreference -ExclusionPath $path
          }

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        timeout-minutes: 5
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: native-${{ matrix.target }}

      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build JavaScript packages
        timeout-minutes: 2
        run: pnpm run build:js

      # Linux `tests` owns the full suite. Native jobs only compile/run the
      # OS-specific invocation tests (Job Objects, process groups, signals).
      # Both native platforms use focused integration tests so cargo does not
      # typecheck the unrelated lib unit tests for platform regressions.
      #
      # Rewrite crate-type in this job only so one rustc emits the CLI rlib
      # and Node cdylib. Do not commit that crate-type: Linux coverage should
      # not also link a cdylib.
      - name: Build native CLI and N-API addon
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/no-mistakes/Cargo.toml")
          text = path.read_text()
          old = 'crate-type = ["rlib"]'
          new = 'crate-type = ["rlib", "cdylib"]'
          if old not in text:
              raise SystemExit(f"expected {old!r} in {path}")
          path.write_text(text.replace(old, new, 1))
          PY
          echo "NO_MISTAKES_BUILD_NAPI=1" >> "$GITHUB_ENV"
          NO_MISTAKES_BUILD_NAPI=1 cargo build --locked -p no-mistakes
          cp "${{ matrix.addon }}" target/debug/no-mistakes.node

      - name: Run platform-specific Rust tests
        timeout-minutes: 10
        shell: bash
        env:
          # Match the preceding build's N-API setting; Cargo may still
          # compile a separate rlib for the integration-test profile.
          NO_MISTAKES_BUILD_NAPI: "1"
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo test --locked -p no-mistakes --test windows_job_object -- --exact --test-threads=1
          else
            cargo test --locked -p no-mistakes --test macos_invocation
          fi
          # Compare the same committed JSON snapshots on both native platforms.
          # Markdown, Rust, and file-rule snapshots live in this suite so native
          # jobs do not compile suite_cli_rules inside the ten-minute step.
          cargo test --locked -p no-mistakes --test suite_cli_postgres cli_postgres_snapshot_
          cargo test --locked -p no-mistakes --test suite_cli_postgres cli_mrf_snapshot_
          cargo test --locked -p no-mistakes --test suite_cli_package_config cli_pkgcfg_snapshot_
          # Small rule subset (incl. shellcheck empty-PATH) checks sourceLine
          # determinism natively; it is linked into suite_cli_package_config
          # so suite_cli_rules is still not compiled here.
          cargo test --locked -p no-mistakes --test suite_cli_package_config cli_rrb_snapshot_

      - name: Run native CLI smoke test
        timeout-minutes: 2
        shell: bash
        run: '"${{ matrix.binary }}" --version'

      - name: Run real N-API API test
        timeout-minutes: 5
        id: real-napi
        shell: bash
        run: |
          set -euo pipefail
          addon_path="$(node -e 'process.stdout.write(require("node:path").resolve("target/debug/no-mistakes.node"))')"
          NO_MISTAKES_TEST_NAPI_ADDON_PATH="$addon_path" pnpm exec vitest run packages/no-mistakes/scripts/real-napi-api.test.js packages/no-mistakes/scripts/unused-disable-directives-api.test.js packages/no-mistakes/scripts/sql-verdicts-api.test.js packages/no-mistakes/scripts/postgres-procedural-occurrence-api.test.js packages/no-mistakes/scripts/postgres-procedural-loop-coverage-api.test.js packages/no-mistakes/scripts/guarded-array-receiver-api.test.js packages/no-mistakes/scripts/forbidden-dependencies-globs-api.test.js --reporter=default --reporter=json --outputFile.json=target/native-api-tests.json --coverage=false

      - name: Report real N-API test durations
        if: ${{ !cancelled() && steps.real-napi.outcome != 'skipped' }}
        timeout-minutes: 2
        shell: bash
        # Hosted Windows wall time is noisy; retain warnings and all artifacts.
        run: node .github/scripts/report-native-api-tests.cjs target/native-api-tests.json target ${{ runner.os == 'Windows' && '--report-only' || '' }}

      - name: Upload real N-API test durations
        if: ${{ !cancelled() && hashFiles('target/native-api-tests.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-api-tests-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/native-api-tests.json
            target/native-api-tests-durations.csv
            target/native-api-tests-summary.md

      - name: Report native job timing
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Native tests (${{ matrix.name }})
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node .github/scripts/report-native-job-timing.cjs

  tests-standalone-lib:
    name: Standalone library tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: standalone-lib

      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres

      - name: Test standalone Rust library without a CLI build
        timeout-minutes: 10
        run: |
          env -u CARGO_BIN_EXE_no-mistakes cargo test --locked -p no-mistakes --lib
          test ! -e "$CARGO_TARGET_DIR/debug/no-mistakes"

  tests:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-llvm-cov
        timeout-minutes: 5
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres

      - name: Clean Rust coverage artifacts
        timeout-minutes: 2
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace

      - name: Record Rust disk usage before test build
        timeout-minutes: 1
        run: bash .github/scripts/rust-disk-usage.sh "before Rust test build" target

      - name: Build Rust tests for coverage
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          bash .github/scripts/rust-validation.sh build

      - name: Record Rust disk usage after test build
        timeout-minutes: 1
        run: bash .github/scripts/rust-disk-usage.sh "after Rust test build" target

      - name: Run Rust tests for coverage
        timeout-minutes: 10
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          bash .github/scripts/rust-validation.sh test

      - name: Run Rust doctests
        timeout-minutes: 5
        run: bash .github/scripts/rust-validation.sh doc

      - name: Write Rust coverage report
        id: rust-coverage
        timeout-minutes: 5
        run: |
          mkdir -p target/llvm-cov
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --lcov \
            --output-path target/llvm-cov/lcov.info

      - name: Show Rust coverage table (debug)
        if: ${{ failure() && steps.rust-coverage.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report 2>&1 | tail -30
          cargo llvm-cov report --show-missing-lines 2>&1 | tail -60
        continue-on-error: true

      - name: Install cargo-crap
        timeout-minutes: 5
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-crap

      - name: Enforce CRAP threshold
        id: rust-crap
        timeout-minutes: 2
        run: |
          set -o pipefail
          cargo crap --lcov target/llvm-cov/lcov.info --fail-above --threshold 30 --missing skip 2>&1 | tee target/llvm-cov/crap-report.txt

      - name: Upload Rust quality diagnostics
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-quality-diagnostics
          retention-days: 7
          path: |
            target/llvm-cov/crap-report.txt
            target/llvm-cov/lcov.info

      - name: Summarize failing Rust CRAP rows
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          cargo crap --lcov target/llvm-cov/lcov.info --threshold 30 --missing skip \
            --format markdown --min 30 --top 20 --output target/llvm-cov/crap-threshold.md
          cat target/llvm-cov/crap-threshold.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded Rust CRAP report
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-crap-threshold
          path: target/llvm-cov/crap-threshold.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cyclomatic complexity threshold
        timeout-minutes: 2
        # Without LCOV, optimistic coverage makes CRAP equal cyclomatic complexity.
        # Include workspace source even when coverage omits it (such as src/tests/).
        run: cargo crap --workspace --missing optimistic --fail-above --threshold 30 --summary

      - name: Enforce Rust coverage floors
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --fail-under-lines "${RUST_COVERAGE_FAIL_UNDER_LINES}" \
            --fail-under-functions "${RUST_COVERAGE_FAIL_UNDER_FUNCTIONS}" \
            --fail-under-regions "${RUST_COVERAGE_FAIL_UNDER_REGIONS}"

      # Codecov is reporting only; the floors above gate coverage, so an outage must not block merges.
      - name: Upload Rust coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: true

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust tests job failure" target

  tests-gate:
    name: Tests with coverage
    needs:
      - changes
      - quality
      - javascript-tests
      - timeout-policy-browser-tests
      - native-tests
      - tests
      - tests-standalone-lib
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Check test and quality results
        timeout-minutes: 1
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript-tests.result }}
          NATIVE_RESULT: ${{ needs.native-tests.result }}
          RUST_RESULT: ${{ needs.tests.result }}
          STANDALONE_RESULT: ${{ needs.tests-standalone-lib.result }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          BROWSER_CHANGED: ${{ needs.changes.outputs.timeout-policy-browser }}
          BROWSER_RESULT: ${{ needs.timeout-policy-browser-tests.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$JAVASCRIPT_RESULT" != "success" || "$NATIVE_RESULT" != "success" || "$RUST_RESULT" != "success" || "$STANDALONE_RESULT" != "success" ]]; then
            echo "Quality checks, JavaScript tests, native tests, standalone library tests, or Rust coverage failed." >&2
            exit 1
          fi

          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Path-filter detection failed." >&2
            exit 1
          fi

          if [[ "$BROWSER_CHANGED" == "true" ]]; then
            if [[ "$BROWSER_RESULT" != "success" ]]; then
              echo "Timeout-policy browser tests failed." >&2
              exit 1
            fi
          elif [[ "$BROWSER_RESULT" != "skipped" && "$BROWSER_RESULT" != "success" ]]; then
            echo "Timeout-policy browser tests did not skip cleanly." >&2
            exit 1
          fi

  ast-analysis:
    name: AST analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ast-analysis

      - name: Build no-mistakes check CLI
        timeout-minutes: 10
        run: cargo build -p no-mistakes

      - name: Run no-mistakes check
        timeout-minutes: 2
        run: target/debug/no-mistakes check

      - name: Install ast-grep
        timeout-minutes: 5
        run: |
          curl -sSfL -o ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.44.1/app-x86_64-unknown-linux-gnu.zip
          echo "611f9e5e76f2611ecea1a35dd3468ceedf600641a11224b80341d79c6ee7b9dd  ast-grep.zip" | sha256sum -c -
          unzip -o ast-grep.zip ast-grep
          chmod +x ast-grep
          sudo mv ast-grep /usr/local/bin/ast-grep
          rm ast-grep.zip

      - name: Run ast-grep rule tests
        timeout-minutes: 2
        run: ast-grep test --skip-snapshot-tests

      - name: Run ast-grep scan
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            base="${BASE_SHA}"
          else
            git fetch --no-tags --depth=1 origin main
            base="origin/main"
          fi
          ast-grep scan --off=no-inline-test-fixture-write --off=no-inline-test-fixture-write-cfg
          python3 .ast-grep/check-inline-fixture-writes.py --base "${base}"

  bench:
    name: Build benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    outputs:
      cache-key: ${{ steps.package.outputs.cache-key }}
      sha256: ${{ steps.package.outputs.sha256 }}
      cache-ready: ${{ steps.cache-probe.outputs.cache-hit }}
    # Must match benchmark-shards. ubuntu-latest mixes Intel and AMD, which
    # changes CodSpeed's simulated cycles. ubuntu-24.04-arm is one CPU
    # generation, and the uploaded harness must be built for that machine.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: "4"
      # CodSpeed simulation/memory do not need production fat LTO. The release
      # profile's lto=true + codegen-units=1 OOMs or forces CARGO_BUILD_JOBS=1
      # on a four-core hosted runner. Relative CodSpeed comparisons are meaningful
      # only when base and head both use ubuntu-24.04-arm.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        timeout-minutes: 5
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: bench-${{ runner.arch }}

      - name: Install cargo-codspeed
        timeout-minutes: 5
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Build CPU benchmarks
        timeout-minutes: 30
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m simulation

      - name: Verify fresh-process frontend call counts
        timeout-minutes: 2
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          NO_MISTAKES_BENCH_EXECUTABLE="$(realpath "${binaries[0]}")" node --test .github/scripts/frontend-lifecycle.test.cjs
          python3 -m unittest discover -s .github/scripts -p test_frontend_lifecycle_profile.py

      - name: Build memory benchmarks
        timeout-minutes: 5
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m memory

      - name: Package benchmark executables
        id: package
        timeout-minutes: 2
        run: |
          tar -C target/codspeed -cf codspeed-analysis.tar analysis
          digest="$(sha256sum codspeed-analysis.tar | cut -d ' ' -f 1)"
          source="$(git rev-parse HEAD)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          # Publish the producer attempt; failed-shard reruns must reuse this key.
          echo "cache-key=codspeed-handoff-v1-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${source}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Cache benchmark executables
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Confirm exact benchmark cache is available
        id: cache-probe
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar
          lookup-only: true

      - name: Upload benchmark executables
        id: artifact
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codspeed-analysis
          path: codspeed-analysis.tar
          # Low-cost compression reduces the harness transferred to every shard.
          compression-level: 1
          retention-days: 1

      - name: Require an available benchmark transport
        timeout-minutes: 1
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: bash .github/scripts/benchmark-handoff.sh available

  benchmark-shards:
    name: Benchmark (${{ matrix.name }})
    needs:
      - changes
      - bench
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    # Must match bench so the downloaded harness matches this machine's arch.
    runs-on: ubuntu-24.04-arm
    # Allow the ten-minute harness transfer plus a six-minute cold instrument
    # install, with room for checkout and extraction.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU check
            mode: simulation
            filter: ""
            benchmark-shard: check
          - name: CPU observer
            mode: simulation
            filter: ""
            benchmark-shard: observer
          - name: CPU tests-plan
            mode: simulation
            filter: ""
            benchmark-shard: tests-plan
          - name: CPU graph core
            mode: simulation
            filter: ""
            benchmark-shard: graph-core
          - name: CPU graph gates
            mode: simulation
            filter: ""
            benchmark-shard: graph-gates
          - name: CPU language frontends
            mode: simulation
            filter: ""
            benchmark-shard: language-frontends
          - name: CPU native frontends
            mode: simulation
            filter: ""
            benchmark-shard: native-frontends
          - name: CPU graph finalization
            mode: simulation
            filter: ""
            benchmark-shard: graph-finalization
          - name: CPU graph production node
            mode: simulation
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: CPU graph production selector
            mode: simulation
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: CPU query
            mode: simulation
            filter: ""
            benchmark-shard: query
          - name: CPU query indexes
            mode: simulation
            filter: ""
            benchmark-shard: query-indexes
          - name: memory check
            mode: memory
            filter: ""
            benchmark-shard: check
          - name: memory observer
            mode: memory
            filter: ""
            benchmark-shard: observer
          - name: memory tests-plan
            mode: memory
            filter: ""
            benchmark-shard: tests-plan
          - name: memory graph core
            mode: memory
            filter: ""
            benchmark-shard: graph-core
          - name: memory graph gates
            mode: memory
            filter: ""
            benchmark-shard: graph-gates
          - name: memory language frontends
            mode: memory
            filter: ""
            benchmark-shard: language-frontends
          - name: memory native frontends
            mode: memory
            filter: ""
            benchmark-shard: native-frontends
          - name: memory graph finalization
            mode: memory
            filter: ""
            benchmark-shard: graph-finalization
          - name: memory graph production node
            mode: memory
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: memory graph production selector
            mode: memory
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: memory query
            mode: memory
            filter: ""
            benchmark-shard: query
          - name: memory query indexes
            mode: memory
            filter: ""
            benchmark-shard: query-indexes
    env:
      BENCHMARK_FILTER: ${{ matrix.filter }}
      BENCHMARK_SELECTED: ${{ needs.changes.outputs.benchmark-scope == 'all' || contains(needs.changes.outputs.benchmark-scope, matrix.benchmark-shard) }}
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
      NO_MISTAKES_BENCH_SHARD: ${{ matrix.benchmark-shard }}
      RAYON_NUM_THREADS: "4"

    steps:
      - name: Checkout
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore exact benchmark executables
        id: benchmark-cache
        if: ${{ env.BENCHMARK_SELECTED == 'true' && needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Verify cached benchmark executables
        id: verify-cache
        if: ${{ env.BENCHMARK_SELECTED == 'true' && steps.benchmark-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Download fallback benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' && steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis

      - name: Verify benchmark executables before extraction
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Extract benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        run: |
          mkdir -p target/codspeed
          tar -C target/codspeed -xf codspeed-analysis.tar

      # CodSpeed's instrument cache key omits libc. After an image libc6 update, an
      # exact-key hit restores libc6-dbg symbols that no longer match libc, so every
      # run reinstalls from apt and the stale entry is never replaced.
      - name: Read libc version for the instrument cache
        id: libc
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        run: echo "version=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        # A cache hit finishes quickly. The first run on this runner, and the
        # first run after a libc6 update, installs valgrind and libc6-dbg.
        timeout-minutes: 6
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: ${{ matrix.mode }}
          # actions/cache versions entries by path, so this also keys the cache by libc6.
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          run: |
            mapfile -t benchmarks < <(find target/codspeed/analysis -type f -perm -111)
            if [[ "${#benchmarks[@]}" -ne 1 ]]; then
              echo "Expected one benchmark executable, found ${#benchmarks[@]}" >&2
              exit 1
            fi
            if [[ -n "$BENCHMARK_FILTER" ]]; then
              "${benchmarks[0]}" "$BENCHMARK_FILTER"
            else
              "${benchmarks[0]}"
            fi

      - name: Run unique frontend lifecycle memory controls
        if: ${{ env.BENCHMARK_SELECTED == 'true' && matrix.mode == 'memory' && matrix.benchmark-shard == 'language-frontends' }}
        timeout-minutes: 6
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          config: .github/frontend-lifecycle.yml

  frontend-lifecycle-smoke:
    name: Frontend lifecycle memory smoke
    needs: [changes, bench]
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.body, '<!-- frontend-lifecycle-smoke: v1 -->') &&
          needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RAYON_NUM_THREADS: "4"
      NO_MISTAKES_BENCH_SHARD: language-frontends
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact benchmark executable cache
        id: cache
        if: ${{ needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar
      - name: Verify cache
        id: verify-cache
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
      - name: Download exact same-run fallback
        if: ${{ steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis
      - name: Verify handoff and freeze provenance
        id: provenance
        timeout-minutes: 2
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
          FRONTEND_SMOKE_ROOT: ${{ runner.temp }}/frontend-lifecycle-smoke
        run: |
          echo "FRONTEND_SMOKE_ROOT=$FRONTEND_SMOKE_ROOT" >> "$GITHUB_ENV"
          bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
          mkdir -p target/codspeed "$FRONTEND_SMOKE_ROOT"/profiles
          tar -C target/codspeed -xf codspeed-analysis.tar
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          sha256sum "${binaries[0]}" | cut -d ' ' -f 1 > "$FRONTEND_SMOKE_ROOT/executable.sha256"
          git rev-parse HEAD > "$FRONTEND_SMOKE_ROOT/source.txt"
          sha256sum Cargo.lock codspeed-analysis.tar > "$FRONTEND_SMOKE_ROOT/inputs.sha256"
          uname -a > "$FRONTEND_SMOKE_ROOT/machine.txt"
          lscpu >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          cat /etc/os-release >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          printf 'order=original,cold_first_analysis,conditioning_inclusive,extract_after_recorded_prefix,extract_after_recorded_prefix,conditioning_inclusive,cold_first_analysis,original\nsamplesPerMode=2\nrayonWorkers=4\nrunner=5.4.0\ncriterion=5.0.1\nbenchLto=false\nbenchCodegenUnits=16\nfeatures=test-instrumentation\nnoDefaultFeatures=true\n' > "$FRONTEND_SMOKE_ROOT/design.txt"
          echo "libc=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"
      - name: Measure the declared eight fresh processes
        id: samples
        timeout-minutes: 6
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        env:
          TMPDIR: ${{ runner.temp }}/frontend-lifecycle-smoke/profiles
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.provenance.outputs.libc }}
          config: .github/frontend-lifecycle-smoke.yml
      - name: Verify all raw profiles and CI execution identity
        timeout-minutes: 1
        env:
          SAMPLE_RUN_ID: ${{ steps.samples.outputs.run-id }}
          SAMPLE_CI_RUN: ${{ github.run_id }}
          SAMPLE_CI_ATTEMPT: ${{ github.run_attempt }}
          SAMPLE_CI_JOB: ${{ github.job }}
        run: python3 .github/scripts/frontend-lifecycle-profile.py all
      - name: Retain all separate sample profiles and timelines
        if: ${{ always() && steps.provenance.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-lifecycle-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-lifecycle-smoke/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  benchmark-gate:
    name: Benchmarks
    needs:
      - changes
      - bench
      - benchmark-shards
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Check benchmark results
        timeout-minutes: 1
        env:
          BENCHMARKS_CHANGED: ${{ needs.changes.outputs.benchmarks }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.bench.result }}
          SHARD_RESULT: ${{ needs.benchmark-shards.result }}
        run: |
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Benchmark change detection failed." >&2
            exit 1
          fi

          if [[ "$BENCHMARKS_CHANGED" != "true" ]]; then
            echo "No benchmark-relevant files changed."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "Benchmark build or execution failed." >&2
            exit 1
          fi
