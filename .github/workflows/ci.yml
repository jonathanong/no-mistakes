        id: pnpm-setup
        continue-on-error: true
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Back off before Node.js setup attempt 2 of 2
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 1
        shell: bash
        run: |
          # A timed-out cache restore can leave a partial store; the retry skips the cache.
          rm -rf "$HOME/setup-pnpm/store"
          echo "Node.js setup attempt 1 failed; retrying attempt 2 of 2 in 5 seconds"
          sleep 5
      - name: Retry pnpm and Node.js setup
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        timeout-minutes: 3
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: .github/pnpm-lockfile-cache-disabled
          install: false

      - name: Install Rust
        if: ${{ needs.changes.outputs.rust == 'true' }}
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        if: ${{ needs.changes.outputs.rust == 'true' && env.COLD_BUILD != 'true' }}
        timeout-minutes: 5
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux-runtime-v1
      - name: Install pnpm dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cargo packages
        if: ${{ needs.changes.outputs.rust == 'true' }}
        timeout-minutes: 25
        run: cargo publish --dry-run --locked -p no-mistakes

      - name: Check npm packages
        timeout-minutes: 2
        run: pnpm run pack:check

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() || cancelled() }}
