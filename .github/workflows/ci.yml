      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result==="skipped" && process.env.RUST_REQUIRED==="false" && name==="quality-rust") continue; if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  # no-mistakes-disable-next-line github-actions-job-timeouts -- #3514 cold-build bounds are checked by rust-build-deadlines.test.cjs.
  packages:
