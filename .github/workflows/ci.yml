      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        id: standalone-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache standalone-lib workspace artifacts by source
        id: standalone-lib-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            standalone-lib-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.standalone-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Install nextest
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.151
      - name: Build standalone library without a CLI
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
          node .github/scripts/standalone-shards.cjs build target/standalone-bundle
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-standalone-lib-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.standalone-lib-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.standalone-lib-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/standalone-lib/target/debug
            target/standalone-lib/target/.rustc_info.json
            ${{ runner.temp }}/nm-standalone-lib-cargo-inputs
      - name: Upload standalone library archive
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standalone-library
          path: target/standalone-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  standalone-shards:
    name: Standalone library shard (${{ matrix.shard }}/4)
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/standalone-lib/target
      CARGO_INCREMENTAL: "0"
    needs: standalone-build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nextest
        timeout-minutes: 3
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.151
      - name: Download standalone library archive
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.standalone-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: standalone-library
          path: target/standalone-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Test standalone Rust library without a CLI build
        timeout-minutes: 6
        run: node .github/scripts/standalone-shards.cjs run target/standalone-bundle ${{ matrix.shard }} 4
  tests-standalone-lib:
    name: Standalone library tests
    needs: [standalone-build, standalone-shards]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Require all component jobs
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  rust-coverage-build:
    name: Build instrumented Rust tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    outputs:
      artifact-run-id: ${{ steps.build-artifact-source.outputs.run_id }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate build artifact source
        id: build-artifact-source
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-artifact-source.cjs

      - name: Install Rust
        id: coverage-rust-toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Cargo registry sources
        if: ${{ env.COLD_BUILD != 'true' && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache coverage workspace artifacts by source
        id: coverage-workspace-cache
        if: ${{ (env.COLD_BUILD != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            coverage-workspace-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.coverage-rust-toolchain.outputs.cachekey }}-${{ env.RUSTFLAGS }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**/Cargo.toml') }}-
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Install Rust coverage tools
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151
      - name: Test Rust coverage sharding
        timeout-minutes: 2
        run: node --test .github/scripts/rust-coverage-shards.test.cjs .github/scripts/rust-profile-pooling.test.cjs
      - name: Build and archive instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/cargo-cache-inputs.cjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
          node .github/scripts/rust-coverage-shards.cjs archive target/coverage-bundle
          node .github/scripts/cargo-cache-inputs.cjs capture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nm-coverage-cargo-inputs"
      - name: Save verified workspace artifacts
        if: ${{ (success() && env.COLD_BUILD != 'true' && github.ref == 'refs/heads/main' && steps.coverage-workspace-cache.outputs.cache-hit != 'true') && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.coverage-workspace-cache.outputs.cache-primary-key }}
          path: |
            target/coverage/target/debug
            target/coverage/target/.rustc_info.json
            ${{ runner.temp }}/nm-coverage-cargo-inputs
      - name: Upload instrumented Rust tests
        if: ${{ steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-build
          path: target/coverage-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Diagnose Rust disk usage after failure
        if: ${{ (failure()) && steps.build-artifact-source.outputs.reuse != 'true' }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust coverage build failure" target

  rust-coverage-shards:
    name: Rust coverage shard (${{ matrix.shard }}/6)
    needs: rust-coverage-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nextest
        timeout-minutes: 5
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.151
      - name: Download instrumented Rust tests
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust tests for coverage
        timeout-minutes: 8
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          LLVM_PROFILE_FILE_NAME: no-mistakes-%9m.profraw
        run: node .github/scripts/rust-coverage-shards.cjs shard target/coverage-bundle "$RUNNER_TEMP/rust-coverage-shard" "$SHARD_INDEX" 6
      - name: Retain profiles and execution diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/rust-coverage-shard
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  # Keep the existing required check name on this fan-in job.
  tests:
    name: Rust tests and coverage
    needs: [changes, rust-coverage-build, rust-coverage-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage/target
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install coverage tools
        timeout-minutes: 5
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.151,cargo-crap
      - name: Download instrumented Rust tests
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.rust-coverage-build.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: rust-coverage-build
          path: target/coverage-bundle
      - name: Restore report binaries without rebuilding
        timeout-minutes: 3
        run: |
          node .github/scripts/rust-coverage-shards.cjs verify target/coverage-bundle
          mkdir -p "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")"
          cargo nextest list --archive-file target/coverage-bundle/rust-tests.tar.zst \
            --extract-to "$(dirname "$CARGO_LLVM_COV_TARGET_DIR")" \
            --workspace-remap "$GITHUB_WORKSPACE" --list-type binaries-only --message-format json \
            > target/coverage-bundle/binaries.json
          node .github/scripts/rust-coverage-shards.cjs report-objects target/coverage-bundle target/coverage-bundle/binaries.json >> "$GITHUB_ENV"
      - name: Download every shard profile and execution inventory
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rust-coverage-shard-*
          path: target/coverage-shards
      - name: Merge shard profiles and require complete successful execution
        id: rust-shard-collection
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node .github/scripts/rust-coverage-shards.cjs collect target/coverage-bundle target/coverage-shards 6
      - name: Require every Rust snapshot to be referenced
        if: ${{ !cancelled() && steps.rust-shard-collection.outcome == 'success' }}
        timeout-minutes: 2
        run: node .github/scripts/rust-snapshot-references.cjs target/coverage-shards/references.txt
      # Append existing report, CRAP 30, cyclomatic complexity 30, 98% line/function/region
      # gates, profile preservation, uncovered-region details, quality uploads and Codecov steps.
      # Give report/diagnostic steps !cancelled() guards so failed shards still render coverage.
      # Finish with this step even if collection/reporting failed; no partial run can pass.
      - name: Write Rust coverage report
        id: rust-coverage
        if: ${{ !cancelled() && hashFiles('target/coverage/target/*.profraw') != '' }}
        timeout-minutes: 5
        run: |
          mkdir -p target/llvm-cov
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report \
            --lcov \
            --output-path target/llvm-cov/lcov.info

      - name: Show Rust coverage table (debug)
        if: ${{ failure() && steps.rust-coverage.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report 2>&1 | tail -30
          cargo llvm-cov report --show-missing-lines 2>&1 | tail -60
        continue-on-error: true

      - name: Install cargo-crap
        timeout-minutes: 5
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-crap

      - name: Enforce CRAP threshold
        id: rust-crap
        timeout-minutes: 2
        run: |
          set -o pipefail
          cargo crap --lcov target/llvm-cov/lcov.info --fail-above --threshold 30 --missing skip 2>&1 | tee target/llvm-cov/crap-report.txt

      - name: Upload Rust quality diagnostics
        timeout-minutes: 2
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-quality-diagnostics
          retention-days: 7
          path: |
            target/llvm-cov/crap-report.txt
            target/llvm-cov/lcov.info
            target/llvm-cov/nextest-objects.json
            target/llvm-cov/nextest-objects.rsp

      - name: Summarize failing Rust CRAP rows
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          cargo crap --lcov target/llvm-cov/lcov.info --threshold 30 --missing skip \
            --format markdown --min 30 --top 20 --output target/llvm-cov/crap-threshold.md
          cat target/llvm-cov/crap-threshold.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded Rust CRAP report
        if: ${{ failure() && steps.rust-crap.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-crap-threshold
          path: target/llvm-cov/crap-threshold.md
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cyclomatic complexity threshold
        timeout-minutes: 2
        # Without LCOV, optimistic coverage makes CRAP equal cyclomatic complexity.
        # Include workspace source even when coverage omits it (such as src/tests/).
        run: cargo crap --workspace --missing optimistic --fail-above --threshold 30 --summary

      - name: Preserve merged Rust coverage profiles
        timeout-minutes: 1
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          node .github/scripts/preserve-rust-profiles.cjs \
            "$CARGO_LLVM_COV_TARGET_DIR" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/no-mistakes-profraw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Enforce Rust coverage floors
        id: rust-coverage-floors
        if: ${{ !cancelled() && steps.rust-coverage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # Native --fail-under flags render a table and then export full JSON again.
          # Summary totals preserve the same gate without both expensive passes.
          cargo llvm-cov report --json --summary-only \
            --output-path target/llvm-cov/summary.json
          node .github/scripts/rust-coverage-floors.cjs target/llvm-cov/summary.json \
            "${RUST_COVERAGE_FAIL_UNDER_LINES}" \
            "${RUST_COVERAGE_FAIL_UNDER_FUNCTIONS}" \
            "${RUST_COVERAGE_FAIL_UNDER_REGIONS}"

      - name: Write uncovered Rust region details
        if: ${{ !cancelled() && steps.rust-coverage-floors.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --json --output-path target/llvm-cov/regions.json

      - name: Upload uncovered Rust region details
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/regions.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-regions
          path: target/llvm-cov/regions.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Rust coverage summary
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/summary.json') != '' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-summary
          path: target/llvm-cov/summary.json
          if-no-files-found: error
          retention-days: 7

      # Codecov is reporting only; the floors above gate coverage, so an outage must not block merges.
      - name: Upload Rust coverage to Codecov
        timeout-minutes: 5
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: true

      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust tests job failure" target

      - name: Require successful Rust producer and all test shards
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          BUILD_RESULT: ${{ needs.rust-coverage-build.result }}
          SHARD_RESULT: ${{ needs.rust-coverage-shards.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success
  docs-tests:
    name: Docs tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/doctests
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable
      - name: Cache Rust doctest artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 3
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: rust-doctests-v1
          workspaces: . -> target/doctests
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start isolated PostgreSQL for catalog fixtures
        timeout-minutes: 5
        uses: ./.github/actions/start-test-postgres
      - name: Run Rust doctests
        timeout-minutes: 8
        run: bash .github/scripts/rust-validation.sh doc
      - name: Diagnose Rust disk usage after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        run: bash .github/scripts/rust-disk-usage.sh "Rust doctest job failure" target/doctests

  tests-gate:
    name: Tests with coverage
    needs:
      [
        changes,
        quality,
        docs-tests,
        packages,
        javascript-tests,
        timeout-policy-browser-tests,
        native-tests,
        tests,
        tests-standalone-lib,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check test and quality results
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for(const [name,job] of Object.entries(jobs)) {if(job.result!=="success") {console.error(name+": "+job.result);process.exitCode=1;}}'
  ast-analysis:
    name: AST analysis
    needs: linux-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux runtime
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.linux-runtime.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          name: linux-runtime-cli
          path: target/debug
      - name: Restore CLI executable mode
        timeout-minutes: 3
        run: chmod +x target/debug/no-mistakes
      - name: Run no-mistakes check
        timeout-minutes: 2
        run: target/debug/no-mistakes check

      - name: Install ast-grep
        timeout-minutes: 5
        run: |
          curl -sSfL -o ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.44.1/app-x86_64-unknown-linux-gnu.zip
          echo "611f9e5e76f2611ecea1a35dd3468ceedf600641a11224b80341d79c6ee7b9dd  ast-grep.zip" | sha256sum -c -
          unzip -o ast-grep.zip ast-grep
          chmod +x ast-grep
          sudo mv ast-grep /usr/local/bin/ast-grep
          rm ast-grep.zip

      - name: Run ast-grep rule tests
        timeout-minutes: 2
        run: ast-grep test --skip-snapshot-tests

      - name: Run ast-grep scan
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            base="${BASE_SHA}"
          else
            git fetch --no-tags --depth=1 origin main
            base="origin/main"
          fi
          ast-grep scan --off=no-inline-test-fixture-write --off=no-inline-test-fixture-write-cfg
          python3 .ast-grep/check-inline-fixture-writes.py --base "${base}"
  bench:
    name: Build benchmarks
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    outputs:
      cache-key: ${{ steps.package.outputs.cache-key }}
      sha256: ${{ steps.package.outputs.sha256 }}
      cache-ready: ${{ steps.cache-probe.outputs.cache-hit }}
    # Must match benchmark-shards. ubuntu-latest mixes Intel and AMD, which
    # changes CodSpeed's simulated cycles. ubuntu-24.04-arm is one CPU
    # generation, and the uploaded harness must be built for that machine.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: "4"
      # CodSpeed simulation/memory do not need production fat LTO. The release
      # profile's lto=true + codegen-units=1 OOMs or forces CARGO_BUILD_JOBS=1
      # on a four-core hosted runner. Relative CodSpeed comparisons are meaningful
      # only when base and head both use ubuntu-24.04-arm.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026.10.09
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        if: ${{ env.COLD_BUILD != 'true' }}
        timeout-minutes: 5
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: bench-${{ runner.arch }}

          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-codspeed
        timeout-minutes: 5
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      # rustc and ld peak near this runner's memory limit: see issue 3024.
      - name: Add swap for the benchmark build
        timeout-minutes: 2
        run: >-
          sudo fallocate -l 8G /swapfile-bench
          && sudo chmod 600 /swapfile-bench
          && sudo mkswap /swapfile-bench
          && sudo swapon /swapfile-bench

      - name: Build CPU benchmarks
        timeout-minutes: 30
        run: >-
          bash .github/scripts/with-resource-samples.sh
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m simulation

      - name: Verify fresh-process frontend call counts
        timeout-minutes: 2
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          NO_MISTAKES_BENCH_EXECUTABLE="$(realpath "${binaries[0]}")" node --test .github/scripts/frontend-lifecycle.test.cjs
          python3 -m unittest discover -s .github/scripts -p test_frontend_lifecycle_profile.py

      - name: Build memory benchmarks
        timeout-minutes: 5
        run: >-
          cargo codspeed build
          -p no-mistakes
          --no-default-features
          --features test-instrumentation
          --bench core_analysis
          -m memory

      - name: Package benchmark executables
        id: package
        timeout-minutes: 2
        run: |
          tar -C target/codspeed -cf codspeed-analysis.tar analysis
          digest="$(sha256sum codspeed-analysis.tar | cut -d ' ' -f 1)"
          source="$(git rev-parse HEAD)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          # Publish the producer attempt; failed-shard reruns must reuse this key.
          echo "cache-key=codspeed-handoff-v1-${RUNNER_OS}-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${source}-${digest}" >> "$GITHUB_OUTPUT"

      - name: Cache benchmark executables
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Confirm exact benchmark cache is available
        if: ${{ github.ref == 'refs/heads/main' }}
        id: cache-probe
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache-key }}
          path: codspeed-analysis.tar
          lookup-only: true

      - name: Upload benchmark executables
        id: artifact
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codspeed-analysis
          path: codspeed-analysis.tar
          # Low-cost compression reduces the harness transferred to every shard.
          compression-level: 1
          retention-days: 1

      - name: Require an available benchmark transport
        timeout-minutes: 1
        env:
          CACHE_HIT: ${{ steps.cache-probe.outputs.cache-hit }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: bash .github/scripts/benchmark-handoff.sh available
  benchmark-shards:
    name: Benchmark (${{ matrix.name }})
    needs:
      - changes
      - bench
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    # Must match bench so the downloaded harness matches this machine's arch.
    runs-on: ubuntu-24.04-arm
    # Allow the ten-minute harness transfer plus a six-minute cold instrument
    # install, with room for checkout and extraction.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU check
            mode: simulation
            filter: ""
            benchmark-shard: check
          - name: CPU observer
            mode: simulation
            filter: ""
            benchmark-shard: observer
          - name: CPU tests-plan
            mode: simulation
            filter: ""
            benchmark-shard: tests-plan
          - name: CPU graph core
            mode: simulation
            filter: ""
            benchmark-shard: graph-core
          - name: CPU graph gates
            mode: simulation
            filter: ""
            benchmark-shard: graph-gates
          - name: CPU language frontends
            mode: simulation
            filter: ""
            benchmark-shard: language-frontends
          - name: CPU native frontends
            mode: simulation
            filter: ""
            benchmark-shard: native-frontends
          - name: CPU graph finalization
            mode: simulation
            filter: ""
            benchmark-shard: graph-finalization
          - name: CPU graph production node
            mode: simulation
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: CPU graph production selector
            mode: simulation
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: CPU query
            mode: simulation
            filter: ""
            benchmark-shard: query
          - name: CPU query indexes
            mode: simulation
            filter: ""
            benchmark-shard: query-indexes
          - name: memory check
            mode: memory
            filter: ""
            benchmark-shard: check
          - name: memory observer
            mode: memory
            filter: ""
            benchmark-shard: observer
          - name: memory tests-plan
            mode: memory
            filter: ""
            benchmark-shard: tests-plan
          - name: memory graph core
            mode: memory
            filter: ""
            benchmark-shard: graph-core
          - name: memory graph gates
            mode: memory
            filter: ""
            benchmark-shard: graph-gates
          - name: memory language frontends
            mode: memory
            filter: ""
            benchmark-shard: language-frontends
          - name: memory native frontends
            mode: memory
            filter: ""
            benchmark-shard: native-frontends
          - name: memory graph finalization
            mode: memory
            filter: ""
            benchmark-shard: graph-finalization
          - name: memory graph production node
            mode: memory
            filter: "graph_production_finalization::node_id_finalization$"
            benchmark-shard: graph-production
          - name: memory graph production selector
            mode: memory
            filter: "graph_production_finalization::selector_append$"
            benchmark-shard: graph-production
          - name: memory query
            mode: memory
            filter: ""
            benchmark-shard: query
          - name: memory query indexes
            mode: memory
            filter: ""
            benchmark-shard: query-indexes
    env:
      BENCHMARK_FILTER: ${{ matrix.filter }}
      BENCHMARK_SELECTED: ${{ needs.changes.outputs.benchmark-scope == 'all' || contains(needs.changes.outputs.benchmark-scope, matrix.benchmark-shard) }}
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
      NO_MISTAKES_BENCH_SHARD: ${{ matrix.benchmark-shard }}
      RAYON_NUM_THREADS: "4"

    steps:
      - name: Checkout
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore exact benchmark executables
        id: benchmark-cache
        if: ${{ env.BENCHMARK_SELECTED == 'true' && needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar

      - name: Verify cached benchmark executables
        id: verify-cache
        if: ${{ env.BENCHMARK_SELECTED == 'true' && steps.benchmark-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Download fallback benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' && steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis

      - name: Verify benchmark executables before extraction
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar

      - name: Extract benchmark executables
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        run: |
          mkdir -p target/codspeed
          tar -C target/codspeed -xf codspeed-analysis.tar

      # CodSpeed's instrument cache key omits libc. After an image libc6 update, an
      # exact-key hit restores libc6-dbg symbols that no longer match libc, so every
      # run reinstalls from apt and the stale entry is never replaced.
      - name: Read libc version for the instrument cache
        id: libc
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        timeout-minutes: 2
        run: echo "version=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks
        if: ${{ env.BENCHMARK_SELECTED == 'true' }}
        # A cache hit finishes quickly. The first run on this runner, and the
        # first run after a libc6 update, installs valgrind and libc6-dbg.
        timeout-minutes: 6
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: ${{ matrix.mode }}
          # actions/cache versions entries by path, so this also keys the cache by libc6.
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          run: |
            mapfile -t benchmarks < <(find target/codspeed/analysis -type f -perm -111)
            if [[ "${#benchmarks[@]}" -ne 1 ]]; then
              echo "Expected one benchmark executable, found ${#benchmarks[@]}" >&2
              exit 1
            fi
            if [[ -n "$BENCHMARK_FILTER" ]]; then
              "${benchmarks[0]}" "$BENCHMARK_FILTER"
            else
              "${benchmarks[0]}"
            fi

      - name: Run unique frontend lifecycle memory controls
        if: ${{ env.BENCHMARK_SELECTED == 'true' && matrix.mode == 'memory' && matrix.benchmark-shard == 'language-frontends' }}
        timeout-minutes: 6
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.libc.outputs.version }}
          config: .github/frontend-lifecycle.yml
  frontend-lifecycle-smoke:
    name: Frontend lifecycle memory smoke
    needs: [changes, bench]
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.body, '<!-- frontend-lifecycle-smoke: v1 -->') &&
          needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RAYON_NUM_THREADS: "4"
      NO_MISTAKES_BENCH_SHARD: language-frontends
      CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore exact benchmark executable cache
        id: cache
        if: ${{ needs.bench.outputs.cache-ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          key: ${{ needs.bench.outputs.cache-key }}
          path: codspeed-analysis.tar
      - name: Verify cache
        id: verify-cache
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
        run: bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
      - name: Download exact same-run fallback
        if: ${{ steps.verify-cache.outcome != 'success' }}
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codspeed-analysis
      - name: Verify handoff and freeze provenance
        id: provenance
        timeout-minutes: 2
        env:
          BENCHMARK_SHA256: ${{ needs.bench.outputs.sha256 }}
          FRONTEND_SMOKE_ROOT: ${{ runner.temp }}/frontend-lifecycle-smoke
        run: |
          echo "FRONTEND_SMOKE_ROOT=$FRONTEND_SMOKE_ROOT" >> "$GITHUB_ENV"
          bash .github/scripts/benchmark-handoff.sh verify codspeed-analysis.tar
          mkdir -p target/codspeed "$FRONTEND_SMOKE_ROOT"/profiles
          tar -C target/codspeed -xf codspeed-analysis.tar
          mapfile -t binaries < <(find target/codspeed/analysis -type f -perm -111)
          [[ ${#binaries[@]} -eq 1 ]]
          sha256sum "${binaries[0]}" | cut -d ' ' -f 1 > "$FRONTEND_SMOKE_ROOT/executable.sha256"
          git rev-parse HEAD > "$FRONTEND_SMOKE_ROOT/source.txt"
          sha256sum Cargo.lock codspeed-analysis.tar > "$FRONTEND_SMOKE_ROOT/inputs.sha256"
          uname -a > "$FRONTEND_SMOKE_ROOT/machine.txt"
          lscpu >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          cat /etc/os-release >> "$FRONTEND_SMOKE_ROOT/machine.txt"
          printf 'order=original,cold_first_analysis,conditioning_inclusive,extract_after_recorded_prefix,extract_after_recorded_prefix,conditioning_inclusive,cold_first_analysis,original\nsamplesPerMode=2\nrayonWorkers=4\nrunner=5.4.0\ncriterion=5.0.1\nbenchLto=false\nbenchCodegenUnits=16\nfeatures=test-instrumentation\nnoDefaultFeatures=true\n' > "$FRONTEND_SMOKE_ROOT/design.txt"
          echo "libc=$(dpkg-query --showformat='${Version}' --show libc6)" >> "$GITHUB_OUTPUT"
      - name: Measure the declared eight fresh processes
        id: samples
        timeout-minutes: 6
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        env:
          TMPDIR: ${{ runner.temp }}/frontend-lifecycle-smoke/profiles
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          mode: memory
          runner-version: "5.4.0"
          instruments-cache-dir: ~/.cache/codspeed-action/libc6-${{ steps.provenance.outputs.libc }}
          config: .github/frontend-lifecycle-smoke.yml
      - name: Verify all raw profiles and CI execution identity
        timeout-minutes: 1
        env:
          SAMPLE_RUN_ID: ${{ steps.samples.outputs.run-id }}
          SAMPLE_CI_RUN: ${{ github.run_id }}
          SAMPLE_CI_ATTEMPT: ${{ github.run_attempt }}
          SAMPLE_CI_JOB: ${{ github.job }}
        run: python3 .github/scripts/frontend-lifecycle-profile.py all
      - name: Retain all separate sample profiles and timelines
        if: ${{ always() && steps.provenance.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-lifecycle-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-lifecycle-smoke/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
  benchmark-gate:
    name: Benchmarks
    needs:
      - changes
      - bench
      - benchmark-shards
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Check benchmark results
        timeout-minutes: 1
        env:
          BENCHMARKS_CHANGED: ${{ needs.changes.outputs.benchmarks }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.bench.result }}
          SHARD_RESULT: ${{ needs.benchmark-shards.result }}
        run: |
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Benchmark change detection failed." >&2
            exit 1
          fi

          if [[ "$BENCHMARKS_CHANGED" != "true" ]]; then
            echo "Benchmarks skipped: no benchmark-relevant change, or a pull request without the benchmarks opt-in marker."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "Benchmark build or execution failed." >&2
            exit 1
          fi

  retain-linux-runtime-cache:
    name: Retain linux-runtime cache
    needs: linux-runtime
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.linux-runtime.result == 'success' }}
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ./.github/workflows/cache-retention.yml
    with:
      best_effort: true

  retain-native-build-cache:
