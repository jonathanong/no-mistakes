  retain-native-test-build-macos-cache:
    name: Retain native-test-build-macos cache
    needs: native-test-build-macos
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native-test-build-macos.result == 'success' }}
    permissions:
