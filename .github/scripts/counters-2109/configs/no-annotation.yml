        "**/test-support.*",
        "**/*-fixture.*",
        "**/*-fixtures.*",
        "**/*-test-helper.*",
        "**/*-test-helpers.*",
        "**/*-test-scripts.*",
        "**/*-test-support.*",
        "web/storybook/**"
      ],
      "exclude": [
        "**/packages.lock.json",
        "**/package-lock.json",
        "**/pnpm-lock.yaml",
        "**/yarn.lock",
        "**/Cargo.lock",
        "**/Package.resolved"
      ]
    },
    {
      "name": "Vitest tests do not invoke real timers",
      "rule": "forbidden-calls",
      "scope": "repository",
      "options": {
        "roots": [
          {
            "vitest": true
          }
        ],
        "traversal": "file",
        "unknownCalls": "ignore",
        "targets": [
          {
            "global": "setTimeout"
          },
          {
            "moduleExport": {
              "module": "node:timers",
              "export": "setTimeout"
            }
          },
          {
            "moduleExport": {
              "module": "node:timers/promises",
              "export": "setTimeout"
            }
          }
        ]
      }
    },
    {
      "name": "Playwright tests do not invoke fixed sleeps",
      "rule": "forbidden-calls",
      "scope": "repository",
      "options": {
        "roots": [
          {
            "playwright": true
          }
        ],
        "traversal": "file",
        "unknownCalls": "ignore",
        "targets": [
          {
            "global": "setTimeout"
          },
          {
            "terminal": "waitForTimeout"
          },
          {
            "moduleExport": {
              "module": "node:timers",
              "export": "setTimeout"
            }
          },
          {
            "moduleExport": {
              "module": "node:timers/promises",
              "export": "setTimeout"
            }
          }
        ]
