      "name": "tracked TypeScript files belong to a tsconfig program",
      "rule": "tsconfig-file-coverage",
      "scope": "repository",
      "options": {
        "allow": [
          {
            "path": "test-helpers/vitest.setup.storybook-browser-guard.mts",
            "reason": "Content-free redirect shim so no-mistakes can resolve web-storybook-browser's setupFiles literal to a real repo-root path; Vitest never executes this copy (see test-helpers/tsconfig.json's exclude comment). Its real logic is web/.storybook/vitest.setup.ts, typechecked under web/tsconfig.json. See #8876."
          }
        ],
        "auxiliaryConfigs": [
          {
            "path": "web/tsconfig.dependency-cruiser.json",
            "reason": "Path-alias resolver config consumed only by web/.dependency-cruiser.cjs; never passed to tsc directly. See #9225."
          }
        ]
      }
