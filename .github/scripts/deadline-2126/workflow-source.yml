name: Active deadline CLI diagnostic
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact reviewed protocol fingerprint
        required: true
        type: string
      approved_source_sha:
        description: Exact reviewed published workflow source commit
        required: true
        type: string
      package_manifest_sha256:
        description: Exact reviewed complete package manifest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deadline-2126-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.confirm != 'DRAFT_DISABLED' }} # Exact protocol hash and reviewed status independently required.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PROTOCOL_SHA256: ${{ inputs.confirm }}
      APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      PACKAGE_MANIFEST_SHA256: ${{ inputs.package_manifest_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            source: 21b478d65e404174f32b01f2ac50f64f85db00e3
          - arm: candidate
            source: ff4a5bd0cb5a2d6ad7bcd11c3e9822ba47d557b7
    steps:
      - name: Anchor job budget before checkout and setup
        run: echo "JOB_STARTED_UNIX=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: native
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026.10.09
        with:
          toolchain: 1.99.1
      - name: Fresh ARM release CLI
        timeout-minutes: 42
        run: python3 controller/.github/scripts/deadline-2126/build.py "$GITHUB_WORKSPACE/native" '${{ matrix.arm }}' "$GITHUB_WORKSPACE/result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        timeout-minutes: 2
        with:
          name: deadline-native-${{ matrix.arm }}
          path: result
          if-no-files-found: error
          retention-days: 14
  measure:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PROTOCOL_SHA256: ${{ inputs.confirm }}
      APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      PACKAGE_MANIFEST_SHA256: ${{ inputs.package_manifest_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        diagnostics: ['off', 'on']
        jobs: ['1', '4', default]
    steps:
      - name: Anchor job budget before checkout and setup
        run: echo "JOB_STARTED_UNIX=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 21b478d65e404174f32b01f2ac50f64f85db00e3
          persist-credentials: false
          path: fixture
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deadline-native-baseline
          path: artifacts/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deadline-native-candidate
          path: artifacts/candidate
      - name: Same-VM preflight and fixed schedule
        timeout-minutes: 42
        run: python3 controller/.github/scripts/deadline-2126/measure.py "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/fixture" "$GITHUB_WORKSPACE/evidence" '${{ matrix.diagnostics }}' '${{ matrix.jobs }}'
      - name: Descriptive analysis
        run: python3 controller/.github/scripts/deadline-2126/analyze.py evidence/rows.json > evidence/descriptive.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        timeout-minutes: 2
        with:
          name: deadline-evidence-${{ matrix.diagnostics }}-${{ matrix.jobs }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
