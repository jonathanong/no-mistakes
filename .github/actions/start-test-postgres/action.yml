name: Start isolated PostgreSQL for catalog fixtures
description: >
  Install PostgreSQL 18 with contrib extensions and start it on a unix socket
  in RUNNER_TEMP for catalog-fixture tests. Set timeout-minutes on the caller.

runs:
  using: composite
  steps:
    - name: Start isolated PostgreSQL for catalog fixtures
      shell: bash
      run: |
        # PostgreSQL 18 exactly: the committed catalog fixture uses VIRTUAL generated columns
        # and PostgreSQL 18 deparse text, which differs between major versions. The package
        # includes the contrib extensions that the extension-exclusion tests install.
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-18
        pg_bin=/usr/lib/postgresql/18/bin
        test -f /usr/share/postgresql/18/extension/citext.control
        test -f /usr/share/postgresql/18/extension/pg_stat_statements.control
        echo "$pg_bin" >> "$GITHUB_PATH"
        "$pg_bin/initdb" -D "$RUNNER_TEMP/no-mistakes-postgres" --auth=trust --no-locale -E UTF8
        "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/no-mistakes-postgres" -l "$RUNNER_TEMP/no-mistakes-postgres.log" -o "-k $RUNNER_TEMP -p 56225 -c listen_addresses=" start
        echo "NO_MISTAKES_TEST_POSTGRES_URL=postgresql://$USER@localhost/postgres?host=$RUNNER_TEMP&port=56225" >> "$GITHUB_ENV"
        echo "PGOPTIONS=-cstandard_conforming_strings=off" >> "$GITHUB_ENV"
