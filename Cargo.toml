[workspace]
members = [
    "crates/no-mistakes"
]
resolver = "2"

# Full LTO + single codegen unit for maximum runtime perf (trades ~60–90 s link time).
[profile.release]
lto = true
codegen-units = 1

# Merman's generated parser is not exercised by the core-analysis benchmarks;
# optimizing it under Codspeed's instrumentation can exceed the CI build limit.
[profile.bench.package.merman-analysis]
opt-level = 0
