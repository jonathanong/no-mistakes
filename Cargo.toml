[workspace]
members = [
    "crates/no-mistakes",
    "crates/no-mistakes-invocation",
    "crates/no-mistakes-postgres-sql",
    "crates/no-mistakes-ts-facts",
    "crates/no-mistakes-ts-analysis",
    "crates/no-mistakes-rule-kernel",
    "crates/no-mistakes-coverage",
]
resolver = "2"

[workspace.package]
version = "0.109.124"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/jongleberry/no-mistakes"

[workspace.dependencies]
no-mistakes-rule-kernel = { version = "=0.109.124", path = "crates/no-mistakes-rule-kernel" }
no-mistakes-invocation = { version = "=0.109.124", path = "crates/no-mistakes-invocation" }
no-mistakes-postgres-sql = { version = "=0.109.124", path = "crates/no-mistakes-postgres-sql" }
no-mistakes-ts-facts = { version = "=0.109.124", path = "crates/no-mistakes-ts-facts" }
no-mistakes-ts-analysis = { version = "=0.109.124", path = "crates/no-mistakes-ts-analysis" }

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_methods = "warn"

# Keep local, CI, and release validation artifacts small. Debug assertions remain enabled.
# Use CARGO_PROFILE_DEV_DEBUG=2 / CARGO_PROFILE_TEST_DEBUG=2 for debugger symbols.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Full LTO + single codegen unit for maximum runtime perf (trades ~60–90 s link time).
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
