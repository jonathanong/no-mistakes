id: no-inline-test-fixture-write
valid:
  - |
    fn read_fixture(path: &Path) {
        let bytes = fs::read(path)?;
        let _ = fs::copy(path, dest)?;
        fs::create_dir(path)?;
    }
  - |
    fn write_bytes(file: &mut File, buf: &[u8]) {
        file.write(buf)?;
    }
  - |
    fn open_builder(path: &Path) {
        builder.create(true);
        OpenOptions::new().read(true).write(true).open(path)?;
    }
