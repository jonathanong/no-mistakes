id: no-direct-playwright-route-scan
valid:
  - |
    fn collect_route_edges(root: &Path, facts: Option<&dyn TsFactLookup>) -> Vec<Edge> {
        let routes = match facts {
            Some(facts) => facts.get_or_compute_playwright_routes(&compute_routes),
            None => Arc::new(compute_routes()),
        };
        Vec::new()
    }
  - |
    /// `routes::collect_routes` and `collect_routes_from_snapshot` stay on the shared cache.
    fn collect_route_edges() -> Vec<Edge> {
        Vec::new()
    }
  - |
    fn collect_routes_from_elsewhere(root: &Path) -> Vec<Edge> {
        Vec::new()
    }
  - |
    use crate::routes::Route;

    fn collect_route_edges(routes: Vec<Route>) -> Vec<Edge> {
        Vec::new()
    }
invalid:
  # ast-grep test does not apply the rule's file-level `ignores`, which only
  # exempts edge_playwright_routes.rs during a real `ast-grep scan`.
  - |
    fn collect_playwright_route_edges(root: &Path, facts: Option<&dyn TsFactLookup>) -> Vec<Edge> {
        let compute_routes = || crate::routes::collect_routes(&root, &["page"]);
        Vec::new()
    }
  - |
    fn collect_other_edges(root: &Path, all_files: &[PathBuf]) -> Vec<Edge> {
        let routes = crate::routes::collect_routes(&root, &["page"]);
        Vec::new()
    }
  - |
    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        let routes = crate::routes::collect_routes_from_visible_paths(&root, paths, &["page"]);
        Vec::new()
    }
  - |
    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        routes::collect_routes(&root, &["page"]);
        Vec::new()
    }
  - |
    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        routes::collect_routes_from_visible_paths(&root, paths, &["page"]);
        Vec::new()
    }
  - |
    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        collect_routes_from_visible_paths(&root, paths, &["page"]);
        Vec::new()
    }
  - |
    use crate::routes::collect_routes_from_visible_paths as scan_routes;

    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        scan_routes(&root, paths, &["page"]);
        Vec::new()
    }
  - |
    use crate::routes::{collect_routes, Route};

    fn collect_visible_edges(root: &Path, routes: Vec<Route>) -> Vec<Edge> {
        Vec::new()
    }
  - |
    fn collect_visible_edges(root: &Path, paths: &[PathBuf]) -> Vec<Edge> {
        super::routes::collect_routes_from_visible_paths(&root, paths, &["page"]);
        Vec::new()
    }
  - |
    fn collect_from_snapshot(root: &Path, snapshot: &VisiblePathSnapshot) -> Vec<Route> {
        crate::playwright::routes::collect_routes_from_snapshot(root, snapshot)
    }
  - |
    fn bind_scan() {
        let scan = crate::routes::collect_routes_from_visible_paths;
        let _ = scan;
    }
