id: no-temporary-arc-symbol-facts
valid:
  - |
    fn collect(program: &Program, source: &str) -> Option<Arc<FileSymbols>> {
        Some(Arc::new(extract_symbols_from_program(program, source)))
    }
  - |
    fn share(ts: &mut TsFileFacts, symbols: &Arc<FileSymbols>) {
        ts.symbols = Some(Arc::clone(symbols));
    }
invalid:
  - |
    fn clone_inner(ts: &mut TsFileFacts, symbols: &Arc<FileSymbols>) {
        ts.symbols = Some(symbols.as_ref().clone());
    }
  - |
    fn wrap_owned_clone(ts: TsFileFacts) -> Option<Arc<FileSymbols>> {
        ts.symbols.clone().map(Arc::new)
    }
  - |
    fn wrap_owned_clone_std(ts: TsFileFacts) -> Option<std::sync::Arc<FileSymbols>> {
        ts.symbols.clone().map(std::sync::Arc::new)
    }
