# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
#
# Domain extraction is the canonical TS fact gateway's job. A second caller
# reparses/recollects data that the request plan should have prepared already.
id: no-unprepared-domain-fact-collection
language: rust
severity: error
message: >-
  Direct domain fact collection outside the canonical TS fact gateway. Add the
  domain to the prepared TsFactPlan and consume the request's TsFactLookup
  instead, so all consumers share one parse and fact collection pass.
rule:
  any:
    - pattern: collect_domain_facts($$$)
    - pattern: domain::collect_domain_facts($$$)
    - pattern: facts::domain::collect_domain_facts($$$)
    - pattern: crate::codebase::ts_source::facts::domain::collect_domain_facts($$$)
files:
  - "crates/no-mistakes/src/**"
ignores:
  # These are the scheduling and per-file halves of the single canonical owner
  # that translates a declared fact plan into domain facts. Keep every consumer
  # outside this gateway caught.
  - "crates/no-mistakes/src/codebase/ts_source/facts/collect.rs"
  - "crates/no-mistakes/src/codebase/ts_source/facts/collect/file.rs"
  # The unified check-fact pass also owns a declared graph fact plan so checks
  # and graph construction share the same per-file program.
  - "crates/no-mistakes/src/codebase/check_facts/file/program.rs"
  - "crates/no-mistakes/src/**/tests/**"
  - "crates/no-mistakes/src/**/*_tests.rs"
  - "crates/no-mistakes/src/**/tests.rs"
  - "crates/no-mistakes/src/**/test_support.rs"
