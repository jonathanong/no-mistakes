# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
#
# Flags the identifiers `collect_routes`, `collect_routes_from_visible_paths`,
# and `collect_routes_from_snapshot` under `codebase/dependencies/graph/**`.
# `get_or_compute_playwright_routes` (`graph/fact_lookup.rs`) is a no-key
# shared cache: every caller within one `no-mistakes check` invocation wants
# the exact same app-wide Playwright route scan, so an edge producer must not
# name those scans directly. The match is the identifier, so a fully qualified
# call, a `routes::` or `super::` path, a bare call, a `use` (including
# `use ... as` and a grouped list), and an uncalled function reference all
# count. See crates/AGENTS.md's "Edge producer smell" note for the historical
# `collect_playwright_route_edges` bug.
#
# `edge_playwright_routes.rs` is the one producer that legitimately computes
# routes when no shared facts are available. Its call lives inside the
# `compute_routes` closure passed to `facts.get_or_compute_playwright_routes`,
# with a `None`-facts fallback that calls the same closure. ast-grep cannot
# require the name to sit inside that closure, so the whole file is
# allowlisted. A second use anywhere else in that file is not caught. Review
# that file's diff by hand for this regression.
id: no-direct-playwright-route-scan
language: rust
severity: error
message: >-
  Route scan name in a DepGraph edge producer. collect_routes,
  collect_routes_from_visible_paths, and collect_routes_from_snapshot
  must go through facts.get_or_compute_playwright_routes (see
  crates/AGENTS.md, "Edge producer smell") instead of being named directly.
rule:
  kind: identifier
  regex: "^collect_routes(_from_visible_paths|_from_snapshot)?$"
files:
  - "crates/no-mistakes/src/codebase/dependencies/graph/**"
ignores:
  - "crates/no-mistakes/src/codebase/dependencies/graph/edge_playwright_routes.rs"
