checks:
  commands:
    - name: jscpd
      include:
        - "crates/**/*.rs"
        - "packages/**/*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
        - .jscpd.json
        - package.json
        - pnpm-lock.yaml
      exclude:
        - "**/crates/no-mistakes/tests/**"
        - "**/src/?*/tests/**"
        - "**/test/**"
        - "**/tests.rs"
        - "**/tests_*.rs"
        - "**/*_tests.rs"
        - "**/test_support.rs"
        - "**/*_test_support.rs"
        - "**/*_test_helpers.rs"
        - "**/test_support/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/fixtures/**"
        - "**/test-cases/**"
        - "**/node_modules/**"
        - "**/target/**"
      command: [pnpm, run, "lint:duplicates"]
      fileArgs: none
    - name: oxlint
      include:
        - "packages/**/*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
        - vitest.config.js
        - .oxlintrc.json
        - package.json
        - pnpm-lock.yaml
      exclude:
        - "packages/**/{node_modules,vendor,coverage}/**"
      command: [pnpm, run, "lint:js"]
      fileArgs: none
    - name: oxfmt
      include:
        - "packages/**"
        - vitest.config.js
        - .oxfmtrc.json
        - package.json
        - pnpm-lock.yaml
      exclude:
        - "packages/**/{node_modules,vendor,coverage}/**"
      command: [pnpm, run, "fmt:js:check"]
      fileArgs: none
    - name: cspell
      include:
        - README.md
        - "docs/**/*.md"
        - "packages/*/README.md"
        - cspell.config.yaml
        - package.json
        - pnpm-lock.yaml
      command: [pnpm, run, "lint:spell"]
      fileArgs: none

rules:
  - rule: github-actions-pinned-hash
    scope: repository
  - rule: rust-max-lines-per-file
    scope: repository
    options:
      srcMax: 200
      testMax: 500
  - rule: rust-no-inline-tests
    scope: repository
    options:
      excludes:
        - test-cases/
  - rule: rust-no-inline-allows
    scope: repository
    options:
      excludes:
        - test-cases/
  - rule: agents-md-max-size
    scope: repository
    options:
      maxLines: 200
      maxChars: 12000
