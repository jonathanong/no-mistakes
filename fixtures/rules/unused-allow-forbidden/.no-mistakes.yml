rules:
  - rule: forbidden-dependencies
    scope: repository
    options:
      roots: [source.ts]
      relationships: [import]
      forbiddenFiles: [target.ts, clean.ts]
      exceptions:
        - roots: [source.ts]
          allowedFiles: [target.ts, clean.ts]
        - roots: [source.ts]
          allowedFiles: [target.ts]
