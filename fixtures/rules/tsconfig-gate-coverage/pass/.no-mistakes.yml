checks:
  commands:
    - name: typecheck-app
      command: [pnpm, exec, tsc, --noEmit, --project, app]
      fileArgs: none
      always: true
    - name: typecheck-tools
      command: [pnpm, exec, tsc, --noEmit, --project, tools/tsconfig.tools.json]
      fileArgs: none
      always: true
rules:
  - rule: tsconfig-gate-coverage
    scope: repository
