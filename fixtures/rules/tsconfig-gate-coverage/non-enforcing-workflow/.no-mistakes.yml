checks:
  commands:
    - name: typecheck-disabled-job
      command: [tsc, --noEmit, --project, disabled-job/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-disabled-step
      command: [tsc, --noEmit, --project, disabled-step/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-nonblocking-job
      command: [tsc, --noEmit, --project, nonblocking-job/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-nonblocking-step
      command: [tsc, --noEmit, --project, nonblocking-step/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-expression
      command: [tsc, --noEmit, --project, expression/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-constant-nonblocking-step
      command: [tsc, --noEmit, --project, constant-nonblocking-step/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-dynamic-expression
      command: [tsc, --noEmit, --project, dynamic-expression/tsconfig.json]
      fileArgs: none
      always: true
rules:
  - rule: tsconfig-gate-coverage
    scope: repository
