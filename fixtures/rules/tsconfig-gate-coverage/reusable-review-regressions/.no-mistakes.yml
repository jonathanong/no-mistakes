checks:
  commands:
    - name: typecheck-matrix
      command: [pnpm, exec, tsc, --noEmit, --project, matrix/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-script
      command: [pnpm, exec, tsc, --noEmit, --project, script/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-env
      command: [pnpm, exec, tsc, --noEmit, --project, env/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-join
      command: [pnpm, exec, tsc, --noEmit, --project, join/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-runner
      command: [pnpm, exec, tsc, --noEmit, --project, runner/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-composite
      command: [pnpm, exec, tsc, --noEmit, --project, composite/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-checkout
      command: [pnpm, exec, tsc, --noEmit, --project, checkout/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-json-error
      command: [pnpm, exec, tsc, --noEmit, --project, json-error/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-hidden-ref
      command: [pnpm, exec, tsc, --noEmit, --project, hidden-ref/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-quoted
      command: [pnpm, exec, tsc, --noEmit, --project, quoted/tsconfig.json]
      fileArgs: none
      always: true
    - name: typecheck-output
      command: [pnpm, exec, tsc, --noEmit, --project, output/tsconfig.json]
      fileArgs: none
      always: true
rules:
  - rule: tsconfig-gate-coverage
    scope: repository
