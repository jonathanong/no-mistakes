version: 2
rules:
  - rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: schedulerIds
          file: schedules.mts
          kind: ts-call-first-string-argument
          target: ai_agents.upsertJobScheduler
        - name: registryIds
          file: registry.mts
          kind: ts-const-array-property
          target: AI_AGENTS_SCHEDULED_JOBS
          property: id
      comparisons:
        - left: schedulerIds
          right: registryIds
