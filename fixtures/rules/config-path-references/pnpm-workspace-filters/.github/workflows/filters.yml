name: pnpm workspace filters

# This comment must not be interpreted as an executable filter:
# pnpm --filter ./comment-only...
jobs:
  check:
    runs-on: ubuntu-latest
    name: pnpm --filter ./non-run-field...
    steps:
      # Only a step's `run` scalar is executable shell.
      - run: some-tool --filter ./not-pnpm...
      - run: pnpm install --filter ./unconditional...
      - run: test -d ./optional; pnpm install --filter ./optional...
      - run: test -d ./and-guarded && pnpm install --filter ./and-guarded...
      - run: if [ -d ./if-guarded ]; then pnpm install --filter ./if-guarded...; fi
      - run: '[[ -d ./bash-and-guarded ]] && pnpm install --filter ./bash-and-guarded...'
      - run: 'if [[ -d ./bash-if-guarded ]]; then pnpm install --filter ./bash-if-guarded...; fi'
      - run: |
          pnpm install --filter '{./packages/app}...' \
            --filter "./src/*..." \
            --filter ./multiline...
runs:
  using: composite
  steps:
    - run: test -d ./composite-guarded && pnpm install --filter ./composite-guarded...
