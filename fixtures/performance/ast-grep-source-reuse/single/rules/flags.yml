id: prefer-shared-flags-client
language: TypeScript
ignores:
  - src/compat/adapter.ts
  - src/generated/registry.ts
message: Use the shared flags client.
severity: warning
rule:
  any:
    - all:
        - pattern: "flags.all($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.clear($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.disable($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.enable($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.evaluate($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.get($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.isEnabled($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.list($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.load($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.refresh($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.set($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "flags.watch($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
