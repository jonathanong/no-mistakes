id: prefer-shared-cache-client
language: TypeScript
ignores:
  - src/compat/adapter.ts
  - src/generated/registry.ts
message: Use the shared cache client.
severity: warning
rule:
  any:
    - all:
        - pattern: "cache.clear($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.delete($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.evict($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.fetch($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.get($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.invalidate($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.keys($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.load($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.put($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.read($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.set($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "cache.touch($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
