id: prefer-shared-sessions-client
language: TypeScript
ignores:
  - src/compat/adapter.ts
  - src/generated/registry.ts
message: Use the shared sessions client.
severity: warning
rule:
  any:
    - all:
        - pattern: "sessions.close($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.create($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.delete($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.expire($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.extend($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.find($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.get($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.list($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.open($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.refresh($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.renew($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
    - all:
        - pattern: "sessions.revoke($$$ARGS)"
        - inside:
            kind: function_declaration
            stopBy: end
