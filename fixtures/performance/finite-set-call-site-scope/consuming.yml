version: 2
rules:
  - rule: unique-exports
    scope: repository
  - rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: schedulers-a
          file: src/schedules/worker-a.ts
          kind: ts-call-first-string-argument
          target: scheduler.register
        - name: schedulers-b
          file: src/schedules/worker-b.ts
          kind: ts-call-first-string-argument
          target: scheduler.register
      comparisons:
        - left: schedulers-a
          right: schedulers-b
