# Planning must not spawn this argv. The relative literal
# `sentinel-should-not-exist` stays absent after `tests plan`.
projects:
  backend:
    type: server
    root: backend
    routes:
      - api/**
  swift-clients:
    type: tests
    root: swift-clients
tests:
  swift:
    packages:
      - swift-clients/core
      - swift-clients/ui
      - swift-clients/android
    baseCommands:
      swift-clients/core:
        - sentinel-should-not-exist
        - test
      swift-clients/ui:
        - sentinel-should-not-exist
        - test
      swift-clients/android:
        - sentinel-should-not-exist
        - test
    projects:
      swift-core:
        include:
          - swift-clients/core/Tests/**/*.swift
      swift-ui:
        include:
          - swift-clients/ui/Tests/**/*.swift
      swift-android:
        include:
          - swift-clients/android/Tests/**/*.swift
test_plan:
  swift:
    fullSuiteTriggers:
      projects:
        swift-clients:
          - core/Package.swift
          - ui/Package.swift
          - android/Package.swift
    environments:
      pre-push:
        groups:
          - type: direct
          - type: dependencies
      all:
        all: true
      coverage-only:
        groups:
          - type: coverage
