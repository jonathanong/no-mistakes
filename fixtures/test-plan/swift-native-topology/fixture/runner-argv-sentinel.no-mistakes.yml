# Planning must not spawn this argv. The relative literal
# `sentinel-should-not-exist` stays absent after `tests plan`.
projects:
  backend:
    type: server
    root: backend
    routes:
      - api/**
  swift-clients:
    type: tests
    root: swift-clients
tests:
  swift:
    packages:
      - swift-clients/core
      - swift-clients/ui
      - swift-clients/android
    # Executing this argv creates sentinel-should-not-exist. `$0` is that
    # name; `--package-path` and `--filter` are later arguments and ignored.
    # Do not replace it with a missing binary: "command not found" creates no file.
    baseCommands:
      swift-clients/core:
        - sh
        - -c
        - touch "$0"
        - sentinel-should-not-exist
      swift-clients/ui:
        - sh
        - -c
        - touch "$0"
        - sentinel-should-not-exist
      swift-clients/android:
        - sh
        - -c
        - touch "$0"
        - sentinel-should-not-exist
    projects:
      swift-core:
        include:
          - swift-clients/core/Tests/**/*.swift
      swift-ui:
        include:
          - swift-clients/ui/Tests/**/*.swift
      swift-android:
        include:
          - swift-clients/android/Tests/**/*.swift
test_plan:
  swift:
    fullSuiteTriggers:
      projects:
        swift-clients:
          - core/Package.swift
          - ui/Package.swift
          - android/Package.swift
    environments:
      pre-push:
        groups:
          - type: direct
          - type: dependencies
      all:
        all: true
      coverage-only:
        groups:
          - type: coverage
