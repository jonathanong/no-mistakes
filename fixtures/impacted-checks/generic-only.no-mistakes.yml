checks:
  commands:
    - name: eslint
      include: ["src/**/*.ts"]
      command: [pnpm, exec, eslint]
      fileArgs: none
    - name: always
      always: true
      command: [echo, always]
      fileArgs: none

tests:
  vitest:
    projects:
      unit:
        include:
          - src/**/*.test.ts
  playwright:
    projects:
      e2e:
        include:
          - e2e/**/*.spec.ts
  swift:
    packages:
      - swift/App
  dotnet:
    projects:
      app:
        project: dotnet/src/App/App.csproj
      app-tests:
        project: dotnet/tests/App.Tests/App.Tests.csproj
        test: true
