name: Retry action attempts
jobs:
  delegated:
    uses: ./.github/workflows/test.yml
  retries:
    runs-on: ubuntu-latest
    steps:
      - uses: Nick-Fields/retry@v3
      - uses: nick-fields/retry@v3
        with:
          max_attempts: " 2 "
      - uses: Wandalen/wretry.action/main@v3
      - uses: Wandalen/wretry.action/pre@v3
        with:
          attempt_limit: "${{ inputs.attempts }}"
      - uses: Wandalen/wretry.action/post@v3
        with:
          attempt_limit: 0
      - uses: nick-fields/retry@v3
        with:
          max_attempts: 1
      - uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: false
      - uses: actions/setup-node@v4
      - uses: ./local/test
      - uses: [nick-fields/retry, v3]
