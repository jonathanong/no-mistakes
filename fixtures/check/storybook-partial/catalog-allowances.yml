projects:
  web:
    type: nextjs
    root: .
unanalyzable: ignore
rules:
  - rule: require-storybook-stories
    projects: [web]
    options:
      include: ["components/Good.tsx"]
      exclude: [components/Excluded.tsx]
      stories: [stories/Barrel.stories.tsx]
      allow_components:
        "components/Good.tsx#Missing": covered elsewhere
        "components/Broken.tsx#Broken": covered elsewhere
