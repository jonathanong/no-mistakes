projects:
  web:
    type: nextjs
    root: web
rules:
  - rule: no-empty-or-comments-only-files
    scope: repository
    options:
      extensions: [.txt]
  - rule: nextjs-no-api-routes
    projects: [web]
  - rule: forbidden-calls
    scope: repository
    options:
      roots: [{file: template.js}]
      targets: [{global: eval}]
