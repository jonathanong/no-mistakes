version: 2
projects:
  app:
    type: server
    root: .
    queues:
      enqueues: ["src/**/*.ts"]
      workers: ["src/**/*.ts"]
tests:
  vitest:
    projects:
      unit:
        include: ["tests/**/*.test.ts"]
queues:
  includeTests: ["tests/orders.test.ts"]
  unboundedJobRetention: true
  jobStateAsRecord: true
