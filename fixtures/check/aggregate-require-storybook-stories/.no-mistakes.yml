version: 2

projects:
  web:
    type: nextjs
    root: web

rules:
  - rule: require-storybook-stories
    projects:
      - web
    options:
      stories:
        - stories/**/*.stories.tsx
      includeAllReactNamedExports: true
      allow_components:
        "components/FileSuppressed.tsx#FileSuppressed": "covered by the parent application shell"
