reportUnusedAllowEntries: report
effects:
  database:
    functions: [read]
rules:
  - rule: query-reached-per-item
    scope: repository
    severity: advisory
    exclude: [src/excluded.mts]
    options:
      effects: [database]
      allow:
        - {file: src/entry.mts, callee: read, line: 3}
        - {file: src/entry.mts, callee: read}
        - {file: src/entry.mts, callee: read, line: 900}
        - {file: src/excluded.mts, callee: retired}
        - {file: src/missing.mts, callee: retired}
  - rule: query-reached-per-item
    enabled: false
    scope: repository
    severity: advisory
    options:
      effects: [database]
      allow: [{file: src/entry.mts, callee: retired}]
