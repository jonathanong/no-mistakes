rules:
  - rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - {name: yaml, file: values.yml, kind: yaml-sequence, key: values}
        - {name: raw, file: raw.ts, kind: ts-array-literal, target: VALUES}
        - {name: json, file: values.json, kind: yaml-sequence, key: values}
      comparisons:
        - {left: yaml, right: raw}
        - {left: json, right: raw}
