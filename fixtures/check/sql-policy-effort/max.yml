version: 2
unanalyzable: report
rules:
  - rule: postgres-explicit-columns
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorNames:
        - query
      include:
        - src/queries.ts
        - src/disabled.ts
      schemaCatalogPath: schema.json
      relations:
        - accounts
      maxColumns: 0
      checkReturning: true
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorNames:
        - query
      include:
        - src/queries.ts
        - src/disabled.ts
      relations:
        - table: accounts
          require:
            - deleted_at IS NULL
effort: max
