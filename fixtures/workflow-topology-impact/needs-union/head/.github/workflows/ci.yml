name: CI
on: push
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: echo prepare
  test-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: pnpm test:web --changed
  publish:
    needs: test-web
    runs-on: ubuntu-latest
    steps:
      - run: echo publish
