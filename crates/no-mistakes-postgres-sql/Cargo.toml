[package]
name = "no-mistakes-postgres-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PostgreSQL SQL parsing, statement facts, and identifier extraction for no-mistakes"
repository.workspace = true
documentation = "https://github.com/jongleberry/no-mistakes"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
test-instrumentation = []

[dependencies]
anyhow = "1"
num_cpus = "1.16"
rayon = "1.10"
regex = "1"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlparser = { version = "0.64", features = ["visitor", "serde"] }

[dev-dependencies]
serde_yaml = "0.9"
