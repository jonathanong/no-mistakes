[package]
name = "no-mistakes-postgres-sql"
version = "0.109.122"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "PostgreSQL SQL parsing, statement facts, and identifier extraction for no-mistakes"
repository = "https://github.com/jonathanong/no-mistakes"
readme = "../../README.md"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
test-instrumentation = []

[dependencies]
anyhow = "1"
num_cpus = "1.16"
rayon = "1.10"
regex = "1"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlparser = { version = "0.64", features = ["visitor", "serde"] }

[dev-dependencies]
serde_yaml = "0.9"
