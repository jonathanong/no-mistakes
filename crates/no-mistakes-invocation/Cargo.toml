[package]
name = "no-mistakes-invocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autotests = false
license.workspace = true
description = "Process-wide invocation locking, deadlines, and child process-tree control for no-mistakes"
repository.workspace = true
documentation = "https://github.com/jongleberry/no-mistakes"
exclude = ["tests/**"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
test-instrumentation = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.32", features = ["process", "signal"] }
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
ignore = "0.4"
rayon = "1.10"

[[test]]
name = "macos_invocation"
path = "tests/macos_invocation.rs"

[[test]]
name = "windows_invocation"
path = "tests/windows_invocation.rs"

[[test]]
name = "windows_job_object"
path = "tests/windows_job_object.rs"

[[test]]
name = "cli_smoke"
path = "tests/cli_smoke.rs"
