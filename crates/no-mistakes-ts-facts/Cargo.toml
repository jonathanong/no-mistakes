[package]
name = "no-mistakes-ts-facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TypeScript AST parsing, module facts, and value-flow extraction for no-mistakes"
repository.workspace = true
documentation = "https://github.com/jongleberry/no-mistakes"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
parse-count = []
test-instrumentation = ["parse-count"]

[dependencies]
anyhow = "1"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_diagnostics = "0.159.0"
oxc_parser = "0.159.0"
oxc_semantic = "0.159.0"
oxc_span = "0.159.0"
oxc_str = "0.159.0"
oxc_syntax = { version = "0.159.0", features = ["to_js_string"] }
rustc-hash = "2.1.3"
self_cell = "1.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlparser = { version = "0.64", features = ["visitor", "serde"] }

[dev-dependencies]
ignore = "0.4"
rayon = "1.10"
tempfile = "3"
