projects:
  db:
    root: legacy-project
    include: ['src/*.mts']
    postgres:
      unanalyzableSql: previously-ignored
      executors:
        importSpecifier: '@example/db'
rules:
  - rule: postgres-no-mutable-sql-registry
    projects: [db]
  - rule: postgres-no-unbounded-sql-identifier
    projects: [db]
