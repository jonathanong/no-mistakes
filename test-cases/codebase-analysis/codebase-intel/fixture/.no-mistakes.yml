rules:
  - rule: route-consistency
    scope: repository
    options:
      backendPattern: packages/api/src/**/*.mts
      backendRegisterObject: app
      backendPrefixes:
        - /api/v1/
      frontendRoot: packages/web/app
      scanPatterns:
        - packages/web/src/**/*.tsx

  - rule: queue-dashboard-reachability
    scope: repository
    options:
      queuePattern: packages/api/src/*.mts
      factorySpecifier: "@example/cache/glide-mq-factory"
      factoryFunction: createQueue

tests:
  playwright:
    frontendRoot: packages/web/app
