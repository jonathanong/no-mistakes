tests:
  vitest:
    configs: vitest.config.mts
    projects:
      web:
        include: [web/covered.test.mts]
        setup_files: [test-helpers/web.setup.mts]
  playwright:
    projects:
      e2e:
        include: [other/uncovered.test.mts]
rules:
  - rule: test-no-unmocked-dynamic-imports
    tests:
      vitest: [web]
      playwright: [e2e]
