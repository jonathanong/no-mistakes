tests:
  vitest:
    projects:
      a:
        include: ['shared/*.test.mts']
        exclude: ['shared/example.test.mts', 'shared/all-excluded.test.mts']
      b:
        include: ['shared/*.test.mts']
        exclude: ['shared/all-excluded.test.mts']
rules:
  - rule: test-no-unmocked-dynamic-imports
    tests:
      vitest: [a, b]
    exclude: ['shared/setup.test.mts']
