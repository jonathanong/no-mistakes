rules:
  - rule: forbidden-dependencies
    scope: repository
    options:
      roots:
        - backend/api/**/*.{ts,mts}
        - backend/services/**/*.mts
        - backend/workers/**/*.mts
        - web/**/*.mts
        - ci/check-*.mts
        - backend/api/routes/get.mts
      excludeRoots:
        - "**/*.test.mts"
        - "**/__tests__/**"
        - backend/workers/ignored.mts
      forbiddenFiles:
        - shared/testing/**/*.{ts,mts}
        - tests/**
      relationships: [import]
      exceptions:
        - roots: [ci/check-coverage.mts]
          allowedFiles: [shared/testing/coverage.mts]
