tests:
  playwright:
    routeCoverageSources:
      - framework: vitest
        project: example
        include: ["**/*.test.ts"]
        routes: ["/api/:id"]
        helpers:
          - {module: ./example.ts, export: example, urlArgument: 0}
          - {module: ./example.ts, export: example, method: "", urlArgument: 0}
