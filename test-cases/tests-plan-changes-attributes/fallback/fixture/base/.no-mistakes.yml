changes:
  categories:
    fixtures:
      paths: ["fixtures/*.json"]
      id: { fromPath: "fixtures/{id}.json" }
      tests: ["tests/**/*.test.ts"]
      match: 'loadFixture("{id}")'
      assertPureJsonLoader: true
    raw:
      paths: ["fixtures/*.txt"]
      tests: ["tests/**/*.test.ts"]
      match: 'loadFixture("{id}")'
      assertPureJsonLoader: true
tests:
  vitest:
    configs: vitest.config.mts
testPlan:
  vitest:
    fullSuiteTriggers:
      triggers:
        - name: fixture-tests
          paths: ["fixtures/**"]
          supersededByChanges: true
