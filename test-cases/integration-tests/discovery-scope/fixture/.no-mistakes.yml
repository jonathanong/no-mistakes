tests:
  vitest:
    configs: []
    projects:
      # Broad runner selection without an integration policy must not widen discovery.
      no-integration-policy:
        include: ['**/*']
      selected:
        include: [selected/**/*.ts]
        exclude: [selected/excluded.ts]
        integration_suites:
          selected: [aws]
  playwright:
    configs: []
    projects:
      selected:
        include: [selected/**/*.spec.ts]
        integration_suites:
          selected: [aws]
