rules:
  - rule: declared-payload-compatibility
    scope: repository
    options:
      effort: low
      unanalyzable: advise
      contracts:
        - name: nested-compatible
          producer: {file: producer.json, pointer: /$defs/nestedCompatible}
          consumer: {file: consumer.json, pointer: /$defs/nestedCompatible}
        - name: flat-required-field
          producer: {file: producer.json, pointer: /$defs/flatRequiredField}
          consumer: {file: consumer.json, pointer: /$defs/flatRequiredField}
  - rule: declared-payload-compatibility
    scope: repository
    options:
      effort: max
      unanalyzable: ignore
      contracts:
        - name: nested-incompatible
          producer: {file: producer.json, pointer: /$defs/nestedIncompatible}
          consumer: {file: consumer.json, pointer: /$defs/nestedIncompatible}
        - name: flat-enum
          producer: {file: producer.json, pointer: /$defs/flatEnum}
          consumer: {file: consumer.json, pointer: /$defs/flatEnum}
