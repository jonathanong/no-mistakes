projects:
  web:
    type: nextjs
    root: web

tests:
  playwright:
    configs: playwright.config.ts
    selectors:
      htmlIds: false
      testIds: [data-testid]
      componentTestIds: { htmlId: id }

rules:
  - rule: playwright-unique-test-ids
    projects: [web]
    options:
      effort: low
      unanalyzable: report

