version: 2
projects:
  backend:
    type: server
    root: .
    queues:
      enqueues:
        - enqueues/*.ts
        - missing/*.ts
      workers:
        - workers/*.ts
queues:
  factories:
    queue:
      - callee: createQueue
        name: 0
    enqueue:
      - callee: createEnqueueFunction
        queue: 0
        job: 1
      - callee: createBulkEnqueueFunction
        queue: 0
        job: 1
    worker:
      - callee: createWorker
        name: 0
        processor: 1
