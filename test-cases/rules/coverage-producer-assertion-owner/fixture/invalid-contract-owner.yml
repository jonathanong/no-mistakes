version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers: [{ file: src/producers.mts, symbol: unrelatedDispatch }]
      assertions: [{ module: "node:assert", export: strictEqual }]
      ownership:
        - producer: { file: src/producers.mts, symbol: unrelatedDispatch }
          owner: { file: src/producers.mts, symbol: absent }
          via: { module: "node:child_process", export: spawn }
