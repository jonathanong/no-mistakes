version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers: [{ file: src/producers.mts, symbol: callback }, { file: src/producers.mts, symbol: directOwnerAndDeepChain }, { file: src/producers.mts, symbol: deepChainOnly }]
      assertions: [{ module: "node:assert", export: strictEqual }]
      maxDepth: 1
