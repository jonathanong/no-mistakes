version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      unanalyzable: report
      producers:
        - { file: src/import-forms.mts, symbol: namedAssertion }
        - { file: src/import-forms.mts, symbol: namespaceAssertion }
        - { file: src/import-forms.mts, symbol: defaultMemberAssertion }
        - { file: src/import-forms.mts, symbol: externalAndAssertion }
        - { file: src/import-forms.mts, symbol: externalOnly }
        - { file: src/import-forms.mts, symbol: strictDefaultEqual }
        - { file: src/import-forms.mts, symbol: strictNamespaceOk }
        - { file: src/import-forms.mts, symbol: bareStrictAssert }
        - { file: src/import-forms.mts, symbol: bareLooseAssert }
        - { file: src/import-forms.mts, symbol: strictPackageEqual }
        - { file: src/import-forms.mts, symbol: bareNodeAssert }
        - { file: src/import-forms.mts, symbol: otherChildExport }
      assertions:
        - { module: 'node:assert', export: strictEqual }
        - { module: 'node:child_process', export: spawn }
        - { module: 'node:assert/strict', export: equal }
        - { module: 'node:assert/strict', export: ok }
        - { module: 'assert', export: ok }
        - { module: 'assert/strict', export: equal }
