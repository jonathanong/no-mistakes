version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers: [{ file: src/suppressed.mts, symbol: lineSuppressed }, { file: src/suppressed.mts, symbol: lineInlineSuppressed }, { file: src/file-suppressed.mts, symbol: fileSuppressed }]
      assertions: [{ module: "node:assert", export: strictEqual }]
