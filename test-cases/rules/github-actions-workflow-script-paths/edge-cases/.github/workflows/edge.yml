name: Edge Cases
on:
  # comment inside on block
  pull_request:
    paths:
      - 'apps/**'
  push:
    paths-ignore:
      - 'scripts/**'
  workflow_dispatch:
defaults:
  run:
    working-directory: scripts
jobs:
  bad_job: 123
  reusable:
    uses: ./.github/workflows/other.yml
  edge:
    runs-on: ubuntu-latest
    steps:
      - "not-a-mapping"
      - run: 42
      - working-directory: .
        run: >
          ./scripts/dup.sh &&
          ./scripts/dup.sh
      - uses: ./.github/actions/${{ matrix.action }}
      - uses: ./.github/actions/missing
      - uses: ./.github/actions/broken
      - uses: ./.github/actions/node
      - uses: ./.github/actions/empty
      - uses: ./.github/actions/no-steps
      - uses: ./
      - uses: ./.github/actions/outer
      - uses: ./.github/actions/opaque
