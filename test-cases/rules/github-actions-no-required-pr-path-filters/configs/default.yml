version: 2
rules:
  - rule: github-actions-no-required-pr-path-filters
    scope: repository
    options:
      workflows:
        - .github/workflows/required.yml
        - .github/workflows/required-target.yml
        - .github/workflows/always.yml
        - .github/workflows/suppressed.yml
        - .github/workflows/suppressed-file.yml
        - .github/workflows/suppressed-line.yml
        - .github/workflows/malformed.yml
