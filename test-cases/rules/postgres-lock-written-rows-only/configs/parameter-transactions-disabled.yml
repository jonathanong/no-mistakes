version: 2
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [PoolQuery, TransactionQuery]
      trustedSqlTags: [{ module: "@example/db", name: sql }]
      unanalyzableSql: advise
