version: 2
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [TransactionQuery]
      unanalyzableSql: fail
      checks:
        row-lock-unwritten-relation: ignore
        table-lock: ignore
        constant-advisory-lock: ignore
        row-lock-outside-transaction: ignore
