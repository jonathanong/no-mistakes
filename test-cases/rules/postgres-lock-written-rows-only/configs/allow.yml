version: 2
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [TransactionQuery]
      unanalyzableSql: fail
      allow:
        - relation: parents
          reason: Explicit parent coordination contract
        - relation: unused_relation
          reason: Stale entry must be reported
