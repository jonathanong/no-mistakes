version: 2
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [TransactionQuery]
      unanalyzableSql: fail
      checks:
        table-lock: ignore
      allow:
        - relation: items
          reason: This exception cannot suppress an ignored check
