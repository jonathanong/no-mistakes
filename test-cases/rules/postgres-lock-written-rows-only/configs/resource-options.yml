version: 2
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      include: [src/**/*.ts]
      importSpecifier: '@example/db'
      executorFactoryNames: [beginTransaction]
      executorOptionProperties: [query]
      checks:
        row-lock-unwritten-relation: fail
        row-lock-outside-transaction: fail
