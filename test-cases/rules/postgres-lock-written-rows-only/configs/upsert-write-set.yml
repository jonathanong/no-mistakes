version: 2
reportUnusedAllowEntries: report
rules:
  - rule: postgres-lock-written-rows-only
    scope: repository
    include: [src/matches.ts]
    options:
      schemaCatalogPath: schema.json
      importSpecifier: '@example/db'
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [TransactionQuery]
      transactionExecutorTypeNames: [TransactionQuery]
      checks:
        row-lock-unwritten-relation: fail
        table-lock: ignore
        constant-advisory-lock: ignore
        row-lock-outside-transaction: ignore
      unanalyzableSql: advise
      writeSets:
        - file: src/matches.ts
          transactionLine: 4
          relations: [jobs]
          reason: Legacy workaround for single-row unconditional upsert write
        - file: src/matches.ts
          transactionLine: 13
          relations: [jobs]
          reason: Legacy workaround for multi-row unconditional upsert write
