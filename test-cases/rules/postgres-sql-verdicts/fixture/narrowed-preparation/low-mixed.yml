rules:
  - rule: postgres-require-query-annotation
    name: low-annotation
    scope: repository
    options:
      importSpecifier: '@db'
      executorNames: [pool]
      trustedSqlTags: [{ module: '@db', name: sql }]
      include: ['low/**/*.ts']
      effort: low
      unanalyzable: report
  - rule: postgres-no-offset
    name: other-profile
    scope: repository
    options:
      importSpecifier: '@other'
      executorNames: [client]
      include: ['other/**/*.ts']
