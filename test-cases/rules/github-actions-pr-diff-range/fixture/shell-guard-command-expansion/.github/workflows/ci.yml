name: Command expansion and unlisted command before guard
on: [pull_request, merge_group]
jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - run: |
          $(echo unset) EVENT_NAME
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi
          echo "$base"
      - run: |
          `echo unset` EVENT_NAME
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi
          echo "$base"
      - run: |
          ${CMD:-unset} EVENT_NAME
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi
          echo "$base"
      - run: |
          prepare_env
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi
          echo "$base"
