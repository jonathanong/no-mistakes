name: Compare
on: [merge_group]
env:
  BASE: ${{ github.event.pull_request.base.sha }}
jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - run: echo "$BASE_REF" "${BASE_REF}" "$BASE2"
      - run: echo "${BASE}-suffix"
        env:
          "BASE": ${{ github.event.pull_request.head.sha }}
      - run: echo "$BASE/suffix"
  fallback:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$BASE"
      - run: echo "$BASE"
        env:
          BASE: 42
