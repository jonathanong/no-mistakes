name: pull
on:
  pull_request:
    branches: [main]
jobs:
  two-argument:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
  two-dot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: git diff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
  base-with-github-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }}
  env-base-with-github-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - run: |
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
