rules:
  - rule: github-actions-pr-diff-range
    scope: repository
    options:
      requireConsistentRevisionPairs: true
      unanalyzable: report
      revisionPairs:
        - baseEnv: DIFF_BASE
          headEnv: DIFF_HEAD
        - baseInput: base-rev
          headInput: head-rev
        - baseFlag: --base
          headFlag: --head
