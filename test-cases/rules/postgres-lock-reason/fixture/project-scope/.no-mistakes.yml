projects:
  api:
    root: .
    include: ["src/**/*.ts", "sql/**/*.sql"]
    postgres:
      schemaCatalogPath: schema-catalog.json
      sqlInclude: ["sql/**/*.sql"]
      executors:
        importSpecifier: "@example/db"
        executorNames: [query]
rules:
  - rule: postgres-lock-reason
    projects: [api]
    severity: error
