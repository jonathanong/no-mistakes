rules:
  - rule: postgres-lock-reason
    scope: repository
    severity: error
    include: ["src/**/*.ts", "sql/**/*.sql"]
    exclude: ["**/*.test.ts"]
    options:
      importSpecifier: "@example/db"
      executorNames: [query]
      executorFactoryNames: [beginTransaction]
      helpers: [reserveJob, acquire_ledger_lock]
      sqlInclude: ["sql/**/*.sql"]
