version: 2
effort: low
rules:
  - rule: postgres-explicit-columns
    scope: repository
    options:
      importSpecifier: '@example/db'
      executorNames: [query]
      include: ['src/**']
      sqlInclude: ['schema.sql']
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: '@example/db'
      executorNames: [query]
      include: ['src/**']
      sqlInclude: ['schema.sql']
