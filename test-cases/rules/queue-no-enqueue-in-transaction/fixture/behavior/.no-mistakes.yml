rules:
  - rule: queue-no-enqueue-in-transaction
    scope: repository
    include: ["src/flows/**/*.ts"]
    exclude: ["src/flows/excluded.ts"]
    options:
      transactions:
        - module: "@sample/database"
          export: transaction
          callbackArgument: 1
      publishers:
        - module: "@sample/jobs"
          export: enqueue
