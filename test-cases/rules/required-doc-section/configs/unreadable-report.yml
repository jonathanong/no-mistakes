reportUnusedDisableDirectives: ignore
rules:
  - rule: required-doc-section
    scope: repository
    options:
      unanalyzable: report
      glob: docs/*.md
      requiredHeading: '## Example'
  - rule: test-no-dependency-pins
    scope: repository
    options:
      unanalyzable: report
      include: [tests/*.test.ts]
