version: 2
rules:
  - rule: postgres-no-offset
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorNames: [query]
      unanalyzableSql: fail
  - rule: postgres-lock-inventory
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorNames: [query]
      helpers: [lock_account_row]
      baselineFile: baseline.json
