rules:
  - rule: no-cross-package-relative-imports
    scope: repository
    include: ["packages/app/src/accepted.mts", "packages/app/src/crossings.mts", "packages/app/nested/crossings.mts"]
    options:
      unanalyzable: advise
      allow:
        - importer: "@sample/a*"
          target: "@sample/sh*"
        - importer: "@sample/nested"
          target: "@sample/app"
