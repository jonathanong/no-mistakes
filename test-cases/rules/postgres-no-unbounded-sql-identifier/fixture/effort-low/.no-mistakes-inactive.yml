effort: low
rules:
  - rule: postgres-no-unbounded-sql-identifier
    scope: repository
    options:
      importSpecifier: "@example/db"
      include: ["src/**/*.ts"]
      exclude: ["src/excluded.ts"]
  - rule: postgres-no-unbounded-sql-identifier
    projects: [missing]
    options:
      effort: max
      executorNames: 12
