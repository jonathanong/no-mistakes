version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 6
      semver-minor-days: 7
      semver-patch-days: 0
      exclude:
        - "@example/internal"
        - external-package
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
