version: 2
unanalyzable: report
rules:
  - rule: github-actions-cache-setup-policy
    scope: repository
    options:
      include:
        - .github/workflows/steps.yml
        - .github/actions/local/action.yml
        - tools/actions/example/notes.yml
      setup:
        - uses: example/setup-package-manager
          maxMinutes: 3
