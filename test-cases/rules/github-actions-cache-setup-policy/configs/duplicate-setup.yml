version: 2
rules:
  - rule: github-actions-cache-setup-policy
    scope: repository
    options:
      caches:
        - uses: example/cache
          path: .cache/widgets
          keyPattern: 'pnpm-\$\{\{\s*runner\.os\s*\}\}-\$\{\{\s*runner\.arch\s*\}\}-\$\{\{\s*hashFiles\(''widgets\.lock''\)\s*\}\}'
      setup:
        - uses: example/setup-package-manager
          maxMinutes: 3
        - uses: EXAMPLE/setup-package-manager
          maxMinutes: 2
