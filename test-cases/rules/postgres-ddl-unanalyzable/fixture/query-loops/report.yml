unanalyzable: report
rules:
  - rule: postgres-constraint-validate
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-fk-index
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-generated-column-predicates
    scope: repository
    options: {executorNames: [], sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-idempotent-insert
    scope: repository
    options: {executorNames: [], sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-identifier-length
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-no-add-column
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-no-generated-column-writes
    scope: repository
    options: {executorNames: [], sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-redundant-index
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-require-fk-on-delete
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-require-named-constraints
    scope: repository
    options: {sqlInclude: ['valid.sql', 'malformed.sql']}
  - rule: postgres-sql-statement-policy
    scope: repository
    options: {executorNames: [], sqlInclude: ['valid.sql', 'malformed.sql'], bannedStatements: [TRUNCATE]}
