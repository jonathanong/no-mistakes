rules:
  - rule: postgres-constraint-validate
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-fk-index
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-identifier-length
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-no-add-column
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-redundant-index
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-require-fk-on-delete
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-require-named-constraints
    scope: repository
    options: {sqlInclude: ['migrations/body-ddl.sql']}
  - rule: postgres-sql-statement-policy
    scope: repository
    options:
      sqlInclude: ['migrations/body-ddl.sql']
      executorNames: []
      bannedStatements: [TRUNCATE]
