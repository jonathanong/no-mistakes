name: Test
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: nick-fields/retry@v3
        with:
          command: pnpm test:unit
          max_attempts: 3
          timeout_minutes: 3
      - uses: nick-fields/retry@v3
        with:
          command: pnpm test:unit
          max_attempts: 1
          timeout_minutes: 3
      - uses: nick-fields/retry@v3
        with:
          command: pnpm test:unit
          timeout_minutes: 3
      - uses: Wandalen/wretry.action@v3
        with:
          command: pnpm test:unit
          attempt_limit: 1
      - uses: Wandalen/wretry.action/main@v3
        with:
          command: pnpm test:unit
      - run: |
          for attempt in 1 2 3; do
            pnpm test:unit && break
          done
