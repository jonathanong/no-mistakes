name: Widgets
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setup runtime
        uses: example/setup-runtime@v2
        with:
          runtime-version-file: .runtime-version
      - name: setup runtime without inputs map
        uses: example/checkout-orders@v1
      - name: publish widgets
        uses: example/publish-widget@v1
        with:
          name: widgets
          path: widgets.log
          retention-days: 3
