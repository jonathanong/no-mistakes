version: 2
rules:
  - rule: postgres-no-test-state-mutation
    scope: repository
    include:
      - tests/mutations.test.ts
    options:
      testGlobs: ["tests/**/*.test.ts"]
      importSpecifier: "@example/db"
      trustedSqlTags: [{ module: "@example/db", name: sql }]
      sqlIdentifierAssertions:
        - {
            module: "@example/identifiers",
            name: assertWhitelistedSqlIdentifier,
            allowlistArgument: 1,
          }
      rawSqlTags: [{ module: "@example/raw-sql", name: sql }]
      unanalyzable: ignore
  - rule: postgres-bounded-statements
    scope: repository
    include:
      - tests/mutations.test.ts
    options:
      schemaCatalogPath: schema.json
      importSpecifier: "@example/db"
      trustedSqlTags: [{ module: "@example/db", name: sql }]
      sqlIdentifierAssertions:
        - {
            module: "@example/identifiers",
            name: assertWhitelistedSqlIdentifier,
            allowlistArgument: 1,
          }
      rawSqlTags: [{ module: "@example/raw-sql", name: sql }]
      unanalyzable: ignore
