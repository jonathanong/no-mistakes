name: custom-token
on: pull_request_target
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checkout_ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: false
