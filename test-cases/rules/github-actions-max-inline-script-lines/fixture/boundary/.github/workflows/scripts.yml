name: Scripts
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo single
      - name: Exactly three
        run: |
          echo one

          echo two
          echo three
      - run: |
          echo one
          echo two
          # Script comments count as nonblank lines.
          echo four
      - run: >-
          echo one
          echo two

          echo three
          echo four
      - uses: actions/github-script@v7
        with:
          script: |
            const value = 1;
            console.log(value);
            console.log('third');
            console.log('fourth');
      - uses: example/other-action@v1
        with:
          script: |
            not a checked script
            one
            two
            three
