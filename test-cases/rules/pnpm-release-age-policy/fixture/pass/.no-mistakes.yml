rules:
  - rule: pnpm-release-age-policy
    scope: repository
    options:
      permanentPackages:
        - name: acme-lib
          reason: first-party
        - name: '@acme/core'
          reason: first-party
      temporaryGroups:
        - selectors:
            - demo-temporary-package@9.9.9
          reason: upstream release regression
          eligibleForRemovalAt: '2027-01-02T03:04:05Z'
      scopedPrefixes:
        - '@acme/'
