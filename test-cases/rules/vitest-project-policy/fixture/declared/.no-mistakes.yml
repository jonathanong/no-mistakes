version: 2
rules:
  - rule: vitest-project-policy
    scope: repository
    options:
      config: vitest.config.ts
      helpers: [helpers/*.mts, suppressed.ts]
      declared:
        forbiddenValues:
          fileParallelism: [false]
          retries: [2]
          mode: [legacy]
          nullable: [null]
        forbidLiteralKinds:
          maxWorkers: [number]
          label: [string]
          enabled: [boolean]
