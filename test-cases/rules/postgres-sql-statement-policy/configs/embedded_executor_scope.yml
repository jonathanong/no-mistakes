version: 2
rules:
  - rule: postgres-sql-statement-policy
    scope: repository
    include: [policy.test.ts, sql/migration.sql]
    options:
      importSpecifier: "@example/db"
      trustedSqlTags:
        - module: "@example/db"
          name: sql
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [TransactionQuery]
      sqlInclude: ["sql/seeds/*.sql"]
      unanalyzableSql: ignore
