version: 2
rules:
  - rule: postgres-sql-statement-policy
    scope: repository
    include: [setting-literals.sql]
    options:
      bannedStatements: [ddl]
      bannedSettings: [session_replication_role, app.guard]
      importSpecifier: "@example/db"
      unanalyzableSql: ignore
      sqlInclude: [setting-literals.sql]
