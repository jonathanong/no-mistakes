version: 2
rules:
  - rule: structured-config-policy
    scope: repository
    options:
      policies:
        - files: ["*.json"]
          valueAssertions:
            - key: overrides.[].rules.no-restricted-properties.[]
              kind: object-shape
              match: any
              requiredKeys: [message]
              forbiddenKeys: [object]
              requiredValues:
                property: bind
