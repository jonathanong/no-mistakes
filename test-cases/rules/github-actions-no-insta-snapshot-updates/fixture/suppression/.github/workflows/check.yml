name: Tests
on: [workflow_dispatch]
env:
  # no-mistakes-disable-next-line github-actions-no-insta-snapshot-updates
  INSTA_UPDATE: unseen
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - run: cargo test
        env:
          INSTA_UPDATE: always # no-mistakes-disable-line github-actions-no-insta-snapshot-updates
  other:
    runs-on: ubuntu-latest
    env:
      INSTA_UPDATE: "1"
    steps:
      - run: cargo test
