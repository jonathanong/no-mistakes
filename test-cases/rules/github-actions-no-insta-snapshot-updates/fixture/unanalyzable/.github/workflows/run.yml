name: Snapshot tests
on: [pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - run: cargo insta test "$FLAGS"
      - run: cargo insta test '
      - run: ${{ vars.SNAPSHOT_COMMAND }}
      - run: ["cargo", "insta"]
      - run: cargo insta accept
        shell: pwsh
      - run: bash -c "$SNAPSHOT_COMMAND"
      - run: cargo "$SUBCOMMAND"
      - run: cargo +$TOOLCHAIN insta test
      - run: cargo insta "$SUBCOMMAND"
      - run: (cargo insta accept)
      - run: (cargo insta test --accept)
      - run: |
          cat <<'SCRIPT'
          cargo insta accept
      - run: echo "$(cargo insta accept"
      - run: 'eval "$SNAPSHOT_COMMAND"'
      - run: echo "$(echo "$(echo "$(echo "$(echo "$(echo ready)")")")")"
      - run: source scripts/insta-setup.sh
      - run: eval 'cargo insta accept'
      - run: echo "$(echo "$(echo "$(echo "$(echo "$(cargo insta accept)")")")")"
      - run: cargo insta test '${{ vars.FLAGS }}'
      - run: cargo insta accept '${{ vars.FLAGS }}'
      - run: 'cargo "$SUBCOMMAND" "'
      - run: '"$COMMAND" "'
      - run: |
          case "$MODE" in
            review) cargo insta accept ;;
          esac
  windows:
    runs-on: windows-latest
    steps:
      - run: cargo insta test
      - run: cargo insta accept
        shell: bash
      - run: ${{ vars.RUN_COMMAND }}
  custom:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: python
    steps:
      - run: print("cargo insta accept")
