name: ci
on: push
jobs:
  unknown:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --not-a-real-flag value -p 5432:5432 postgres
  subst:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 $(date) postgres
  backtick:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p `echo 5432:5432` postgres
  container-run:
    runs-on: ubuntu-latest
    steps:
      - run: docker container run -p 5432:5432 postgres
  sudo:
    runs-on: ubuntu-latest
    steps:
      - run: sudo docker run -p 5432:5432 postgres
  heredoc:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF
          docker run -p 5432:5432 postgres
          EOF
  not-string:
    runs-on: ubuntu-latest
    steps:
      - run:
          script: docker run -p 5432:5432 postgres
  mixed-prefix:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p pre$PORT:5432 postgres
