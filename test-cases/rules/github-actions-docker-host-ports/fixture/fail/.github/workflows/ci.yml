name: ci
on: push
jobs:
  literal:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 postgres
  ip:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 127.0.0.1:5432:5432 postgres
  long:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --publish 8080:80 nginx
  equals:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --publish=8080:80 nginx
  attached:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p5432:5432 postgres
  clustered:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -dp 5432:5432 postgres
  range:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 8000-8002:8000-8002 app
  quoted:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p "5432:5432" postgres
  udp:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432/udp postgres
  chain:
    runs-on: ubuntu-latest
    steps:
      - run: echo starting && docker run --rm -e POSTGRES_PASSWORD=x -p 5432:5432 postgres
  block:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo starting
          docker run -p 5432:5432 postgres
  ipv6:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p "[::1]:5432:5432" postgres
  path:
    runs-on: ubuntu-latest
    steps:
      - run: /usr/bin/docker run -p 5432:5432 postgres
  two:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 -p 6379:6379 postgres
  second-step:
    runs-on: ubuntu-latest
    steps:
      - run: echo skip
      - run: docker run -p 5432:5432 postgres
  env-prefix:
    runs-on: ubuntu-latest
    steps:
      - run: DEBUG=1 docker run -p 5432:5432 postgres
  container-var:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:$PORT postgres
  known-flags:
    runs-on: ubuntu-latest
    steps:
      # Docker drops -p under --network=host. The literal pin stays a finding.
      - run: docker run --rm -d --name db --network=host -p 127.0.0.1:5432:5432 postgres
  continued:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker run -p \
            5432:5432 \
            postgres
  captured:
    runs-on: ubuntu-latest
    steps:
      - run: CID=$(docker run -d -p 5432:5432 postgres)
  subst-value:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 -e PW=$(cat pw) postgres
  subst:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 $(date) postgres
  cap-add-after:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -p 5432:5432 --cap-add SYS_ADMIN postgres
  cap-add-before:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --cap-add SYS_ADMIN -p 5432:5432 postgres
  reservation:
    runs-on: ubuntu-latest
    steps:
      - run: docker run --memory-reservation 1g -p 5432:5432 postgres
  after-heredoc:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF > x.txt
          hi
          EOF
          docker run -p 5432:5432 postgres
  hd-space-after:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat << EOF > x.txt
          hi
          EOF
          docker run -p 5432:5432 postgres
  hd-space-quoted:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat << 'EOF' > x.sh
          hi
          EOF
          docker run -p 5432:5432 postgres
  hd-pipe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF | docker run -i -p 5432:5432 pg
          hi
          EOF
  hd-and:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF && docker run -p 5432:5432 postgres
          hi
          EOF
  container-run:
    runs-on: ubuntu-latest
    steps:
      - run: docker container run -p 5432:5432 postgres
  sudo:
    runs-on: ubuntu-latest
    steps:
      - run: sudo docker run -p 5432:5432 postgres
  if-guard:
    runs-on: ubuntu-latest
    steps:
      - run: if docker run -p 5432:5432 postgres; then echo ok; fi
  subshell:
    runs-on: ubuntu-latest
    steps:
      - run: (docker run -p 5432:5432 postgres)
  env-wrapper:
    runs-on: ubuntu-latest
    steps:
      - run: env FOO=1 docker run -p 5432:5432 postgres
  timeout-wrapper:
    runs-on: ubuntu-latest
    steps:
      - run: timeout 60 docker run -p 5432:5432 postgres
  sudo-preserve:
    runs-on: ubuntu-latest
    steps:
      - run: sudo --preserve-env docker run -p 5432:5432 postgres
  xargs-wrapper:
    runs-on: ubuntu-latest
    steps:
      - run: echo pg | xargs docker run -p 5432:5432
  xargs-equals:
    runs-on: ubuntu-latest
    steps:
      # `--max-args=1` is one word. The `=` must not swallow `docker`.
      - run: echo pg | xargs --max-args=1 docker run -p 5432:5432 postgres
  quiet-short:
    runs-on: ubuntu-latest
    steps:
      - run: docker run -q -p 5432:5432 pg
  docker-create:
    runs-on: ubuntu-latest
    steps:
      - run: docker create -p 5432:5432 postgres
  docker-context:
    runs-on: ubuntu-latest
    steps:
      - run: docker --context ci run -p 5432:5432 postgres
  let-shift:
    runs-on: ubuntu-latest
    steps:
      - run: |
          let n=1<<3
          docker run -p 5432:5432 postgres
  quoted-arith:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat "((" <<EOF
          docker run -p 1111:1111 a
          EOF
          docker run -p 5432:5432 postgres
  service-ports:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres
        ports:
          - 5432:5432
          - $PORT:5432
      scalar:
        image: postgres
        ports: "9:9"
      short:
        image: postgres
        # A one-character publish is not a host pin.
        ports: 8
      bare:
        image: postgres
        ports:
          -
          - 6:6
    container:
      image: ubuntu
      ports:
        - 8080:80
    steps:
      - run: echo ready
  same-indent-ports:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres
        ports:
        - 6001:5432
    steps:
      - run: echo ok
  flow-services:
    runs-on: ubuntu-latest
    services: { pg: { image: postgres, ports: ["6002:5432"] } }
    steps:
      - run: echo ok
  flow-nested:
    runs-on: ubuntu-latest
    services:
      pg: { image: postgres, ports: ["6003:5432"] }
    steps:
      - run: echo ok
  flow-container:
    runs-on: ubuntu-latest
    container: { image: ubuntu, ports: ["6007:80"] }
    steps:
      - run: echo ok
  service-options:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres
        options: --publish 6010:5432
    steps:
      - run: echo ok
  bash-c:
    runs-on: ubuntu-latest
    steps:
      - run: bash -c "docker run -p 5434:5432 pg"
  sh-c:
    runs-on: ubuntu-latest
    steps:
      - run: sh -c 'docker run -p 5435:5432 pg'
  bash-lc:
    runs-on: ubuntu-latest
    steps:
      - run: bash -lc "sudo docker run -p 5436:5432 pg"
  sudo-sh-c:
    runs-on: ubuntu-latest
    steps:
      - run: sudo sh -c "docker run -p 5469:5432 pg"
  eval-wrapper:
    runs-on: ubuntu-latest
    steps:
      - run: eval "docker run -p 5449:5432 pg"
  sudo-end:
    runs-on: ubuntu-latest
    steps:
      - run: sudo -- docker run -p 5440:5432 pg
  sudo-user:
    runs-on: ubuntu-latest
    steps:
      - run: sudo --user=root docker run -p 5474:5432 pg
  env-path:
    runs-on: ubuntu-latest
    steps:
      - run: /usr/bin/env docker run -p 5473:5432 pg
  env-chdir:
    runs-on: ubuntu-latest
    steps:
      - run: env -C /tmp docker run -p 5445:5432 pg
  env-split:
    runs-on: ubuntu-latest
    steps:
      - run: env -S "A=1" docker run -p 5444:5432 pg
  timeout-signal:
    runs-on: ubuntu-latest
    steps:
      - run: timeout -s KILL 60 docker run -p 5446:5432 pg
  docker-tls:
    runs-on: ubuntu-latest
    steps:
      - run: docker --tls run -p 5441:5432 pg
  docker-tlsverify:
    runs-on: ubuntu-latest
    steps:
      - run: docker --tlsverify run -p 5443:5432 pg
  docker-short-context:
    runs-on: ubuntu-latest
    steps:
      - run: docker -c ctx run -p 5442:5432 pg
