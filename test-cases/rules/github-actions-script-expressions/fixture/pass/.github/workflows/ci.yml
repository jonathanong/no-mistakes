# Synthetic workflow. Constant contexts stay inline. Untrusted values use env.
name: ci
on: push
env:
  EVENT: ${{ github.event.head_commit.message }}
jobs:
  call:
    uses: org/repo/.github/workflows/reuse.yml@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    with:
      name: ${{ github.actor }}
  build:
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event.head_commit.message }}
    defaults:
      run:
        shell: bash
    steps:
      - name: constants
        run: |
          echo "${{ github.repository }}"
          echo "${{ github.repository_owner }}"
          echo "${{ github.server_url }}"
          echo "${{ github.run_id }}"
          echo "${{ github.run_number }}"
          echo "${{ github.run_attempt }}"
          echo "${{ github.sha }}"
          echo "${{ github.event_name }}"
          echo "${{ github.workspace }}"
          echo "${{ runner.os }}"
          echo "${{ runner.arch }}"
          echo "${{ runner.temp }}"
          echo "${{ job.services.redis.ports['6379'] }}"
          echo "${{ job.services.my-db.ports["5432"] }}"
          echo "${{  github.sha  }}"
      - name: pass through env
        env:
          TITLE: ${{ github.event.pull_request.title }}
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.build.outputs.value }}
          INPUT: ${{ inputs.name }}
          VAR: ${{ vars.FOO }}
          FROM_ENV: ${{ env.EVENT }}
        run: echo "$TITLE"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "${{ github.sha }}"
      - uses: example/action@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          script: console.log("${{ github.actor }}")
      - uses: actions/github-script/extra@v7
        with:
          script: console.log("${{ github.actor }}")
      - uses: actions/github-script@v7
        env:
          ACTOR: ${{ github.actor }}
        with:
          script: return process.env.ACTOR + "${{ github.sha }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
