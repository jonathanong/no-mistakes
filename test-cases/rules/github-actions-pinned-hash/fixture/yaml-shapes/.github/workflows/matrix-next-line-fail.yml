# The indented matrix value is not an action. It must not steal the step comment.
on: [push]
jobs:
  block:
    strategy:
      matrix:
        include:
          - uses:
              ubuntu-latest
    steps:
      - { uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd } # v6.0.2
      - { uses: actions/checkout@v4 }
