# Script text that looks like a flow uses is not an action line.
- run: |
    echo { uses: actions/checkout@v4 }
- uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
# The unpinned action after a folded script is reported on its own line.
- run: >
    echo { uses: actions/checkout@v4 }
- uses: actions/checkout@v4
# A block scalar uses value is still the action ref.
- uses: |
    actions/checkout@v4
