# The dash shares a column with steps. Both unpinned actions are steps.
# The include entry named uses is not an action. The pinned step is quiet.
jobs:
  build:
    strategy:
      matrix:
        include:
        - uses: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
