# `7` and `true` are a number and a bool. A null job, a reused job, and a
# step without a string `run` are not downloads.
name: odd-jobs
on: push
jobs:
  7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 3
      - "plain"
      - null
      - run: curl -fsSL https://example.invalid/num.tgz -o num.tgz
  true:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL https://example.invalid/bool.tgz -o bool.tgz
  absent: ~
  reused:
    uses: ./.github/workflows/other.yml
