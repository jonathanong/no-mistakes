name: Download integrity low effort argv boundaries
on: push

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: literal-assignment-command
        run: |
          FETCH=curl
          $FETCH -fsSL https://untrusted.example.invalid/fetch.tgz -o fetch.tgz
      - name: prefixed-command
        run: |
          WRAP=sudo
          $WRAP curl -fsSL https://untrusted.example.invalid/wrapped.tgz -o wrapped.tgz
      - name: configured-helper-command
        run: |
          FETCH=ci_download_to
          $FETCH https://untrusted.example.invalid/helper.tgz
      - name: non-downloader-command
        run: |
          EXEC=python
          $EXEC https://untrusted.example.invalid/not-a-download.tgz
      - name: dynamic-output-flags
        run: |
          FLAGS=--output
          curl $FLAGS https://untrusted.example.invalid/output-is-not-a-url.tgz
      - name: dynamic-output-operand
        run: curl -o "$OUTPUT_FILE" https://api.github.com/repos/example/project
      - name: dynamic-header-operand
        run: curl --header "$HEADER" https://api.github.com/repos/example/project
      - name: dynamic-inline-option-operands
        run: curl --output="$OUTPUT_FILE" --header="$HEADER" https://api.github.com/repos/example/project
      - name: dynamic-attached-short-operands
        run: curl -o"$OUTPUT_FILE" -H"$HEADER" https://api.github.com/repos/example/project
      - name: dynamic-cluster-option-operand
        run: curl -fsSo"$OUTPUT_FILE" https://api.github.com/repos/example/project
      - name: dynamic-option-looking-header-operand
        run: curl --header "--$HEADER" https://api.github.com/repos/example/project
      - name: dynamic-wget-output-operand
        run: wget --output-document="$OUTPUT_FILE" https://objects.githubusercontent.com/releases/project.tar.gz
      - name: static-host-dynamic-path
        run: curl "https://untrusted.example.invalid/tool-${VERSION}.sha256" -o latest.tgz
      - name: mixed-literal-and-dynamic-url-command
        run: curl -fsSL https://untrusted.example.invalid/literal.tgz "$DYNAMIC_URL" -o mixed.tgz
      - name: literal-command-separators
        run: |
          FETCH='echo setup; curl'
          $FETCH https://untrusted.example.invalid/separator.tgz
      - name: unicode-non-url-operand
        run: curl 漢字漢
      - name: elided-wrapper-command
        run: |
          WRAP=''
          $WRAP curl -fsSL https://untrusted.example.invalid/elided.tgz
      - name: heredoc-command-prefix
        run: |
          FETCH='curl -fsSL https://untrusted.example.invalid/heredoc-prefix.tgz <<EOF'
          $FETCH
          payload
          EOF
