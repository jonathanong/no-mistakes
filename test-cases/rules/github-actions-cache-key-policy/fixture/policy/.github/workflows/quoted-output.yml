name: Widgets
on: push
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - id: lock
        run: |
          digest=$(sha256sum widgets.lock)
          OUT=$GITHUB_OUTPUT
          echo "digest=${digest}" > "$OUT"
      - uses: actions/cache@v4
        with:
          path: .cache/widgets
          key: widgets-${{ runner.os }}-${{ runner.arch }}-${{ steps.lock.outputs.digest }}
