name: Widgets
on: push
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: .cache/widgets
          # no-mistakes-disable-next-line github-actions-cache-key-policy
          key: widgets-shared
          # no-mistakes-disable-next-line github-actions-cache-key-policy
          restore-keys: widgets-
