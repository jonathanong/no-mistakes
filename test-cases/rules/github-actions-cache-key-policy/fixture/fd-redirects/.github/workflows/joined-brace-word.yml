name: Widgets
on: push
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - id: lock
        shell: bash
        run: |
          digest=$(sha256sum widgets.lock)
          OUT="$GITHUB_OUTPUT"
          printf "digest=$digest\n" widgets{fd}>"$OUT"
      - uses: actions/cache@v4
        with:
          path: .cache/widgets
          key: widgets-${{ runner.os }}-${{ runner.arch }}-${{ steps.lock.outputs.digest }}
