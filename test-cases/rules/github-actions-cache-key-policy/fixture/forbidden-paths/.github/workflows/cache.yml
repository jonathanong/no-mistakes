name: Example Store Cache
on: push
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/example-store
          key: store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('widgets.lock') }}
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/example-store/
          key: store-${{ runner.os }}
      - uses: actions/cache/save@v4
        with:
          path: |
            .cache/other
            ./.cache/example-store/
          key: store-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path:
            - ~/.local/share/other-store
            - ~/.local/share/example-store
          key: store-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/other-store
          key: other-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/example-store-extra
          key: extra-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: .cache/widgets
          key: widgets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('widgets.lock') }}
      - uses: actions/checkout@v4
        with:
          path: ~/.local/share/example-store
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/example-store # no-mistakes-disable-line github-actions-cache-key-policy
          key: suppressed-${{ runner.os }}
