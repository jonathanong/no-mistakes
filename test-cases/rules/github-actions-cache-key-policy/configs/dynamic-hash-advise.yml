version: 2
unanalyzable: report
rules:
  - rule: github-actions-cache-key-policy
    scope: repository
    options:
      unanalyzable: advise
      caches:
        - path: .cache/example
          lockfile: example.lock
          keyParts: [runner.os]
      allowHashFiles: true
      forbidBroadHashFiles: true
      rejectRestoreKeys: false
