rules:
  - rule: github-actions-cache-key-policy
    scope: repository
    options:
      rejectRestoreKeys: true
      allowHashFiles: true
      caches:
        - path: .cache/widgets
          lockfile: widgets.lock
          keyParts: [runner.os, runner.arch]
      forbiddenPaths:
        - ~/.local/share/example-store
        - ./.cache/example-store/
