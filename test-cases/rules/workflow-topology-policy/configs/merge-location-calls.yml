version: 2
unanalyzable: ignore
rules:
  - rule: workflow-topology-policy
    scope: repository
    options:
      requiredDirectEdges:
        - [".github/workflows/partial-caller.yml#call", ".github/workflows/partial-caller.yml#post"]
      exactCallerJobs:
        .github/workflows/callee.yml:
          - .github/workflows/caller.yml#known
          - .github/workflows/partial-caller.yml#call
        .github/workflows/partial-callee.yml:
          - .github/workflows/caller.yml#explicit
