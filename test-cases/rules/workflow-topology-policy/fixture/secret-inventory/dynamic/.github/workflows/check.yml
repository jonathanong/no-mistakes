on: push
env:
  dyn: '${{ secrets[inputs.secret] }}'
jobs:
  selectors:
    runs-on: ubuntu-latest
    env:
      selected: '${{ secrets[inputs.secret] }}'
      everything: '${{ toJSON(secrets) }}'
    steps:
      - run: echo ready
  dynamic_environment:
    runs-on: ubuntu-latest
    environment: '${{ inputs.environment }}'
    env:
      selected: '${{ secrets.KNOWN }}'
      missing: '${{ secrets.NOT_LISTED }}'
      maybe: '${{ secrets.ENV_ONLY }}'
      token: '${{ secrets.GITHUB_TOKEN }}'
      extra: '${{ secrets.EXTRA }}'
    steps:
      - run: echo ready
