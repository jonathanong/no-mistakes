projects:
  app:
    root: missing-project
tests:
  playwright:
    configs: missing-playwright.config.ts
testPlan:
  vitest:
    fullSuiteTriggers:
      projects:
        app: [src/missing.ts, "!src/optional.ts"]
      triggers:
        - name: root
          paths: [missing-trigger.ts, "!optional-trigger.ts"]
rules:
  - rule: config-path-references
    scope: repository
    options:
      presets:
        - oxlintrc
        - knip
        - dependabot
        - sgconfig
        - syncpack
        - coverage-rules
        - pnpm-workspace-filters
        - no-mistakes
      tsconfig: missing-tsconfig.json
      roots: [missing-entry.mts]
      excludePaths: [missing-until-created/**]
