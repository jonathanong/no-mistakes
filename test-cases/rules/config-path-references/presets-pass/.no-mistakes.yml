projects:
  app:
    root: packages/app
tests:
  playwright:
    configs: playwright.config.ts
testPlan:
  vitest:
    fullSuiteTriggers:
      projects:
        app: [src/index.ts, "!src/optional.ts"]
      triggers:
        - name: root
          paths: [src/app.ts, "!src/optional.ts"]
rules:
  - rule: config-path-references
    scope: repository
    options:
      presets:
        - oxlintrc
        - knip
        - dependabot
        - sgconfig
        - syncpack
        - coverage-rules
        - pnpm-workspace-filters
        - no-mistakes
      excludePaths: [missing-until-created/**]
