name: Verify fixture
on: pull_request
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: example/setup@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - run: docker run --publish 8080:80 example-image
      - run: curl -fsSL https://example.invalid/tool -o example.sh
      - run: |
          until gh run view 123; do
            sleep 2
          done
      - run: git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: pnpm exec vitest run --project example src/item.test.ts
