version: 2
rules:
  - rule: postgres-no-test-state-mutation
    scope: repository
    include: [tests/finite-set-default-capture.test.ts]
    options:
      testGlobs: ["tests/**/*.test.ts"]
      importSpecifier: "@example/db"
      trustedSqlTags: [{ module: "@example/db", name: sql }]
      unanalyzable: report
