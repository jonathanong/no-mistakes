name: ci
on: push
jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure credentials
        uses: ./.github/actions/setup-aws
        timeout-minutes: 2
        with:
          role-arn: ${{ vars.ROLE_ARN }}
      - name: Direct third-party
        uses: aws-actions/configure-aws-credentials@v4
        timeout-minutes: 2
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          action-timeout-s: 90
