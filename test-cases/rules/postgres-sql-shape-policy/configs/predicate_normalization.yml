version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [sql/002.sql]
    options:
      sqlInclude: [sql/002.sql]
      importSpecifier: "@example/db"
      bannedShapes: [keyset-only-sweep]
      shapeOptions:
        keysetOnlySweep:
          nonSelectivePredicates:
            - |-
              status = E'a\' or x = \'b'
            - |-
              status = U&'a\0027 or x = \0027b'
            - score = 1e3
            - status = $tag$idle$tag$
            - flags = X'DEAD'
