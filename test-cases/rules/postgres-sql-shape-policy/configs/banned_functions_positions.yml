version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [positions.sql]
    options:
      bannedShapes: [banned-function-call]
      shapeOptions:
        bannedFunctionCall:
          functions: [pg_sleep, pg_sleep_for, pg_sleep_until]
      importSpecifier: "@example/db"
      trustedSqlTags:
        - module: "@example/db"
          name: sql
      unanalyzableSql: ignore
