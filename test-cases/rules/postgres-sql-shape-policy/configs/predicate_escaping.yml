version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [sql/001.sql]
    options:
      sqlInclude: [sql/001.sql]
      importSpecifier: "@example/db"
      bannedShapes: [keyset-only-sweep]
      shapeOptions:
        keysetOnlySweep:
          nonSelectivePredicates:
            # Mixed outside spaces, tabs and newlines are formatting, not predicate contents.
            - |-
              status  	=
                'a'' or x = ''b'
            - '"a"" or x = ""b"'
            - "status = 'a  b'"
            - |-
              status = E'a\' or x = \'b'
