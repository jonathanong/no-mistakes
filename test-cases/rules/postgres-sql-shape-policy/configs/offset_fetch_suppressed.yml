version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [sql/offset-fetch.sql]
    options:
      bannedShapes: [literal-limit]
      shapeOptions:
        literalLimit:
          allowedValues: []
      sqlInclude: [sql/offset-fetch.sql]
      importSpecifier: "@example/db"
