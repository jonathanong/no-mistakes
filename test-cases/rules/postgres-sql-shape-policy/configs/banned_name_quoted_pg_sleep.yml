version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [names.sql]
    options:
      bannedShapes: [banned-function-call]
      shapeOptions:
        bannedFunctionCall:
          functions: ["\"PG_SLEEP\""]
      importSpecifier: "@example/db"
      trustedSqlTags:
        - module: "@example/db"
          name: sql
      unanalyzableSql: ignore
