version: 2
rules:
  - rule: postgres-sql-shape-policy
    scope: repository
    include: [sql/001.sql]
    options:
      sqlInclude: [sql/001.sql]
      importSpecifier: "@example/db"
      bannedShapes: [literal-limit, keyset-only-sweep]
      shapeOptions:
        literalLimit:
          allowedValues: [1, 20]
        keysetOnlySweep:
          nonSelectivePredicates: [deleted_at=FALSE]
          ignoreTables: [Currencies]
