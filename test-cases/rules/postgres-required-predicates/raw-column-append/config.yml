version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    include: [src/list.ts, src/discoverable.ts]
    options:
      importSpecifier: "@example/db"
      relations:
        - table: candidates
          requireColumns: [owner_id]
      trustedSqlTags:
        - module: sql-template-strings
          name: default
      schemaCatalogPath: schema.json
