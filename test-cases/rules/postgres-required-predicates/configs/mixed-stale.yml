version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: "@example/db"
      include: ["sql/mixed.sql"]
      sqlInclude: ["sql/mixed.sql"]
      schemaCatalogPath: schema.json
      partitionKeys: require
      partitionKeyExemptions:
        - table: absent
          reason: reviewed
      allow:
        - object: "table:absent"
          reason: reviewed
