version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: "@example/db"
      include: ["src/imported-tag-suppressed.ts"]
      trustedSqlTags:
        - module: "@example/db"
          name: sql
      relations:
        - table: topics
          require: ["parent_id IS NOT NULL"]
