version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: "@example/db"
      include: ["sql/qualified.sql"]
      sqlInclude: ["sql/qualified.sql"]
      schemaCatalogPath: schema.json
      partitionKeys: require
      partitionKeyExemptions:
        - table: mixed
          reason: expression
        - table: missing
          reason: stale snapshot
