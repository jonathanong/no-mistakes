version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    options:
      importSpecifier: "@example/db"
      sqlInclude: ["sql/pass-qualified.sql"]
      schemaCatalogPath: schema.json
      partitionKeys: require
      partitionKeyExemptions:
        - table: bare
          reason: legacy incomplete snapshot fixture
      relations:
        - table: orders
          requireColumns: [account_id]
