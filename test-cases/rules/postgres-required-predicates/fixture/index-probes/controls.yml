version: 2
rules:
  - rule: postgres-required-predicates
    scope: repository
    options:
      include: ['controls.*']
      sqlInclude: ['controls.sql']
      importSpecifier: '@example/db'
      schemaCatalogPath: schema.json
      partitionKeys: require
      relations:
        - table: topic_posts
          requireColumns: [account_id]
          require: ['account_id IS NOT NULL']
