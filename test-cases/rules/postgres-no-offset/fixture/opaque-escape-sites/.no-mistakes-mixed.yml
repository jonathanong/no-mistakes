rules:
  - rule: postgres-no-unbounded-sql-identifier
    name: preceding-rule
    scope: repository
    options:
      importSpecifier: '@example/db'
      include: ['src/mixed.mts']
      effort: max
      unanalyzable: ignore
  - rule: postgres-no-offset
    name: low-helper
    scope: repository
    options:
      importSpecifier: '@example/db'
      include: ['src/mixed.mts']
      effort: low
      unanalyzable: advise
  - rule: postgres-no-offset
    name: max-helper
    scope: repository
    options:
      importSpecifier: '@example/db'
      include: ['src/mixed.mts']
      effort: max
      unanalyzable: advise
