effects:
  postgres:
    typedExecutors:
      - { module: '@example/executor-types', export: QueryExecutor }
      - { module: '@example/executor-types', export: QueryOptions }
rules:
  - rule: postgres-no-offset
    scope: repository
    options:
      importSpecifier: '@example/db'
      executorNames: [read]
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [QueryExecutor, QueryOptions]
      effort: low
      unanalyzable: ignore
      include: ["src/**/*.ts"]
  - rule: postgres-no-unbounded-sql-identifier
    scope: repository
    options:
      importSpecifier: '@example/db'
      executorNames: [read]
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [QueryExecutor, QueryOptions]
      effort: low
      unanalyzable: ignore
      include: ["src/**/*.ts"]
  - rule: postgres-no-mutable-sql-registry
    scope: repository
    options:
      importSpecifier: '@example/db'
      executorNames: [read]
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [QueryExecutor, QueryOptions]
      effort: low
      unanalyzable: ignore
      include: ["src/**/*.ts"]
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    options:
      schemaCatalogPath: schema.json
      importSpecifier: '@example/db'
      executorNames: [read]
      executorFactoryNames: [beginTransaction]
      executorTypeNames: [QueryExecutor, QueryOptions]
      effort: low
      unanalyzable: ignore
      include: ["src/**/*.ts"]
