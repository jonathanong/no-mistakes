version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers:
        - { file: src/review-array-from.mts, symbol: emptyFrom }
        - { file: src/review-array-from.mts, symbol: sparsePositive }
        - { file: src/review-array-from.mts, symbol: sparseFrom }
        - { file: src/review-array-from.mts, symbol: mutatedSparseFrom }
      assertions: [{ module: "node:assert", export: strictEqual }]
      unanalyzable: ignore
