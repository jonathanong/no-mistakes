version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers:
        - { file: src/storage-constructor.mts, symbol: staticRun }
        - { file: src/storage-constructor.mts, symbol: staticExit }
        - { file: src/storage-constructor.mts, symbol: instanceRun }
        - { file: src/storage-constructor.mts, symbol: instanceExit }
        - { file: src/storage-constructor.mts, symbol: newInstanceRun }
        - { file: src/storage-constructor.mts, symbol: typedInstanceRun }
        - { file: src/storage-constructor.mts, symbol: unknownRun }
      assertions: [{ module: "node:assert", export: strictEqual }]
