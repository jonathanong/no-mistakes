name: Unparsable
on: push
jobs:
  dynamic:
    runs-on: ubuntu-latest
    steps:
      - name: Dynamic command name
        run: $CMD api -f x=1 repos/my-org/my-repo/labels
      - name: Eval invocation
        run: eval "gh api -f x=1 repos/my-org/my-repo/labels"
      - name: Unterminated quote
        run: gh api "repos/my-org/my-repo/labels
      - name: Dynamic shell -c
        run: bash -c "$SCRIPT"
      - name: Variable-prefixed literal script path
        run: $GITHUB_ACTION_PATH/build-images.sh --tag "$TAG"
      - name: Variable-prefixed dynamic command segment
        run: $GITHUB_ACTION_PATH/$TOOL --flag
