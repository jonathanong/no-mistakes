effort: low
rules:
  - rule: github-actions-job-timeouts
    scope: repository
    include: [.github/workflows/ci.yml]
    options:
      rejectStepExceedingJob: true
      rejectJobAtOrAboveStepSum: true
      effort: max
  - rule: github-actions-step-timeouts
    scope: repository
    options:
      effort: max
      maxMinutes: 5
