name: Widgets
on: push
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: whole project
        run: pnpm exec vitest run --project widgets
      - name: flags only
        run: vitest run --project widgets --reporter=dot
      - name: config file
        run: pnpm exec vitest run --project widgets --config vitest.config.ts
      - name: allowed name
        run: pnpm exec vitest run --project widgets widgets
      - name: other project
        run: pnpm exec vitest run --project orders src/orders.test.ts
      - name: not vitest
        run: node scripts/build.mjs src/widgets.test.ts
      - name: file filter
        run: pnpm exec vitest run --project widgets src/widgets.test.ts
      - name: equals form
        run: pnpm exec vitest run --project=widgets src/items.test.ts
      - name: filtered package
        run: pnpm --filter widgets exec vitest run --project widgets src/orders.test.ts
      - name: chained
        run: echo ok && pnpm exec vitest run --project widgets src/widgets.test.ts
      - name: suppressed
        run: pnpm exec vitest run --project widgets src/items.test.ts # no-mistakes-disable-line github-actions-vitest-project-selection
      - name: value flags
        run: |
          pnpm exec vitest run --project widgets --root ./apps/web
          pnpm exec vitest run --project widgets -r ./apps/web
          pnpm exec vitest run --project widgets --workspace ./vitest.workspace.ts
          pnpm exec vitest run --project widgets --exclude 'src/legacy/**'
          pnpm exec vitest run --project widgets --coverage.include 'src/**'
          pnpm exec vitest run --project widgets --coverage.exclude 'src/**/*.snap'
          pnpm exec vitest run --project widgets --cacheDir .vitest/cache
          pnpm exec vitest run --project widgets --outputFile reports/widgets.xml
          pnpm exec vitest run --project widgets --outputFile.junit reports/widgets.xml
          pnpm exec vitest run --project widgets --setupFiles ./src/setup.ts
          pnpm exec vitest run --project widgets --changed origin/main
          pnpm exec vitest run --project widgets --root=./apps/web --workspace=./vitest.workspace.ts --coverage.include='src/**' --outputFile.junit=reports/widgets.xml
      - name: folded file
        run: |
          pnpm exec vitest run --project widgets \
            src/folded.test.ts
      - name: shard expression
        run: vitest run --project widgets src/shard.test.ts --shard ${{ matrix.shard }}
      - name: quoted shard
        run: vitest run --project widgets src/quoted.test.ts --shard "${{ matrix.shard }}"
      - name: dynamic config
        run: vitest run --project widgets src/config.test.ts --config "$CONFIG" --outputFile "$OUT"
      - name: shell then
        run: if true; then vitest run --project widgets src/then.test.ts; fi
      - name: shell do
        run: while true; do vitest run --project widgets src/do.test.ts; done
      - name: shell else
        run: if false; then true; else vitest run --project widgets src/else.test.ts; fi
      - name: pnpm dlx
        run: pnpm dlx vitest run --project widgets src/dlx.test.ts
      - name: yarn dlx
        run: yarn dlx vitest run --project widgets src/yarn.test.ts
      - name: wrapper
        run: pnpm exec ./scripts/with-env vitest run --project widgets packages/widgets/widget.test.ts
      - name: package script
        run: pnpm test -- --project widgets src/widgets.test.ts
      - name: dynamic positional
        run: vitest run --project widgets $WIDGETS
      - name: omitted project
        run: vitest run src/omitted.test.ts
  flow:
    runs-on: ubuntu-latest
    steps: [{run: pnpm exec vitest run --project widgets src/flow.test.ts}]
