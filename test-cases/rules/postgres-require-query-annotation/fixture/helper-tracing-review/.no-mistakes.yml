rules:
  - rule: postgres-require-query-annotation
    scope: repository
    options:
      importSpecifier: "@app/db"
      include:
        - "src/query.mts"
        - "src/import-equals.mts"
        - "src/destructured-tag.mts"
        - "src/local-tag.mts"
        - "src/named-tags.mts"
      trustedSqlTags:
        - module: "./tags.mjs"
          name: "customQuery"
