rules:
  - rule: postgres-require-query-annotation
    scope: repository
    options:
      # This helper-tracing fixture intentionally opts into all .query members.
      importSpecifier: ""
      executorNames: [write, query]
      include:
        - "src/query.mts"
        - "src/import-equals.mts"
        - "src/destructured-tag.mts"
        - "src/local-tag.mts"
        - "src/named-tags.mts"
        - "src/raw-assertion.ts"
        - "src/raw-deleted.mts"
        - "src/raw-reassigned.mts"
        - "src/raw-shadowed.mts"
      trustedSqlTags:
        - module: "./tags.mjs"
          name: "customQuery"
