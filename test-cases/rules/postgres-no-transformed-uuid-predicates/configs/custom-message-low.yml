version: 2
rules:
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    message: Keep identity lookups indexable
    include:
      - embedded.ts
      - schema.json
    options:
      schemaCatalogPath: schema.json
      sqlInclude: ["*.sql"]
      importSpecifier: db
      executorNames: [query]
effort: low
