version: 2
rules:
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    include:
      - multi-argument-sites.sql
      - multi-argument-sites.ts
      - schema.json
    options:
      schemaCatalogPath: schema.json
      sqlInclude: ["*.sql"]
      importSpecifier: db
      executorNames: [query]
effort: low
