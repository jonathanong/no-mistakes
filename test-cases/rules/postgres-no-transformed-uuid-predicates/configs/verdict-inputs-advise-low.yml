version: 2
rules:
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    include:
      - verdict-inputs.ts
      - schema.json
    options:
      schemaCatalogPath: schema.json
      sqlInclude: ["*.sql"]
      importSpecifier: db
      executorNames: [query]
      unanalyzableSql: advise
effort: low
