version: 2
effort: low
rules:
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    include: [access-paths/single-row-embedded.mts, access-paths/schema.json]
    options:
      schemaCatalogPath: access-paths/schema.json
      sqlInclude: ["access-paths/*.sql"]
      importSpecifier: db
      executorNames: [query]
      trustedSqlTags:
        - { module: db, name: sql }
      unanalyzableSql: advise
