version: 2
rules:
  - rule: postgres-column-naming
    scope: repository
    options:
      schemaCatalogPath: schema.json
      ignoreTablePatterns: ['^link__']
      foreignKeys:
        reservedSuffixes:
          - suffix: '_user_id'
            types: [uuid]
            tables: [users]
        requireForeignKey:
          types: [uuid]
          namePattern: _id$
          exempt:
            - namePattern: '^only_on_link'
              reason: generated table
