version: 2
rules:
  - rule: postgres-column-naming
    scope: repository
    options:
      schemaCatalogPath: schema.json
      foreignKeys:
        targetMatch: last-word
        targetNames:
          - tablePattern: '^(archived_)?([a-z]+)$'
            name: '$1$2'
          - tablePattern: '^t_(.+)$'
            name: 'item$0'
