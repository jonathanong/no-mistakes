version: 2
rules:
  - rule: postgres-column-naming
    scope: repository
    options:
      schemaCatalogPath: schema.json
      typeRules:
        - types: [date]
          namePattern: _on$
      nameTypeRules:
        - namePattern: _at$
          types: ['timestamp with time zone']
      allow:
        - object: 'column:orders.shipped_at'
          reason: protocol
