version: 2
rules:
  - rule: nextjs-redirect-destinations
    scope: repository
    options:
      includeRewrites: true
  - rule: rust-max-lines-per-file
    scope: repository
    options:
      srcMax: 200
  - rule: rust-no-inline-allows
    scope: repository
    options:
      testMax: 500
  - rule: rust-no-inline-tests
    scope: repository
    options:
      excludes: []
  - rule: postgres-array-columns
    scope: repository
    options:
      schemaCatalogPath: schema.json
      neverAllowElementTypes: ["uuid"]
      allowElementTypes: ["text"]
  - rule: postgres-bounded-statements
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      statements: ["select"]
  - rule: postgres-conflict-ordering
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      include: ["**/*.sql"]
  - rule: postgres-constraint-validate
    scope: repository
    options:
      sqlInclude: ["**/*.sql"]
  - rule: postgres-duplicate-function-body
    scope: repository
    options:
      schemaCatalogPath: schema.json
      minClusterSize: 2
  - rule: postgres-explain-write-rollback
    scope: repository
    options:
      sqlInclude: ["**/*.sql"]
  - rule: postgres-explicit-columns
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      maxColumns: 12
  - rule: postgres-finite-text-columns
    scope: repository
    options:
      schemaCatalogPath: schema.json
      columnTypes: ["text"]
  - rule: postgres-fk-index
    scope: repository
    options:
      allowedColumns: ["id"]
  - rule: postgres-generated-column-predicates
    scope: repository
    options:
      executorNames: []
      functions: ["uuid_extract_timestamp"]
  - rule: postgres-idempotent-insert
    scope: repository
    options:
      executorNames: []
      include: ["**/*.sql"]
  - rule: postgres-identifier-length
    scope: repository
    options:
      maxBytes: 63
  - rule: postgres-json-relation-ids
    scope: repository
    options:
      idKeyPattern: "_id$"
  - rule: postgres-key-column-types
    scope: repository
    options:
      schemaCatalogPath: schema.json
      allowedTypes: ["uuid"]
  - rule: postgres-lock-ordering
    scope: repository
    options:
      executorNames: []
      include: ["**/*.sql"]
  - rule: postgres-lock-written-rows-only
    scope: repository
    options:
      executorNames: []
      checks:
        table-lock: ignore
  - rule: postgres-materialized-view-shape
    scope: repository
    options:
      schemaCatalogPath: schema.json
      windowFunctions: ["row_number"]
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      sqlInclude: ["**/*.sql"]
  - rule: postgres-redundant-index
    scope: repository
    options:
      allowedIndexes: ["orders_pkey"]
  - rule: postgres-require-fk-on-delete
    scope: repository
    options:
      sqlInclude: ["**/*.sql"]
  - rule: postgres-require-named-constraints
    scope: repository
    options:
      sqlInclude: ["**/*.sql"]
  - rule: postgres-require-query-annotation
    scope: repository
    options:
      executorNames: []
      sqlLiteralHelpers: ["@example/sql#tag"]
  - rule: postgres-required-comments
    scope: repository
    options:
      schemaCatalogPath: schema.json
      objects: ["table"]
  - rule: postgres-sql-statement-policy
    scope: repository
    options:
      bannedStatements: ["TRUNCATE"]
  - rule: postgres-status-with-lifecycle-timestamps
    scope: repository
    options:
      schemaCatalogPath: schema.json
      statusColumns: ["status"]
