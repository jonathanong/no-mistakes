version: 2
rules:
  - rule: vitest-ci-path-coverage
    scope: repository
    options:
      includeVitestProjectGlobs: false
  - rule: vitest-default-excludes
    scope: repository
    options:
      files:
        - "src/**/*.test.ts"
  - rule: vitest-project-mapping
    scope: repository
    options:
      explicitProjectsOnly: false
  - rule: vitest-test-correspondence
    scope: repository
    options:
      direction: both
  - rule: tsconfig-alias-folder-mapping
    scope: repository
    options:
      checkExists: false
  - rule: tsconfig-file-coverage
    scope: repository
    options:
      requiredBasename: tsconfig.json
  - rule: tsconfig-gate-coverage
    scope: repository
    options:
      allowProjects: {}
