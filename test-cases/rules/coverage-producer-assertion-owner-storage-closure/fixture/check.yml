version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      producers:
        - { file: src/producers.mts, symbol: forwarded }
        - { file: src/producers.mts, symbol: ambiguous }
        - { file: src/producers.mts, symbol: missing }
      assertions: [{ module: "node:assert", export: strictEqual }]
