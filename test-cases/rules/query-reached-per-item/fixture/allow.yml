effects:
  postgres:
    functions: [read]
    transactionFunctions: [tx.query]
    batchFunctions: [batch]
rules:
  - rule: query-reached-per-item
    scope: repository
    options:
      effects: [postgres]
      allow: [{file: src/entry.mts, callee: lookup, line: 5}, {file: src/entry.mts, callee: read}, {file: src/helpers.mts}]
