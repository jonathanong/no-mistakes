effects:
  postgres:
    targets:
      - { module: './psql.mjs', export: read }
      - { module: './psql.mjs', export: executeHandlerWithCursorInBatches }
      - { module: './psql.mjs', export: createAsyncGeneratorFromCursor }
    returnedExecutors:
      - { module: '@vendor/opaque-database', export: begin, category: transaction }
    transactionFunctions: [rejected, finalize]
  valkey:
    targets:
      - { module: '@vendor/valkey', export: primary.get }
      - { module: '@vendor/valkey-imported-receiver-mutations', export: primary.get }
      - { module: '@vendor/valkey-default-origin-mutations', export: primary.get }
      - { module: '@vendor/valkey-destructured-parameters', export: primary.get }
      - { module: '@vendor/valkey', export: session.info }
      - { module: '@vendor/valkey-imported-receiver-mutations', export: session.info }
      - { module: '@vendor/valkey-default-origin-mutations', export: session.info }
      - { module: '@vendor/valkey-destructured-parameters', export: session.info }
      - { module: '@vendor/valkey', export: session.scan }
      - { module: '@vendor/valkey-imported-receiver-mutations', export: session.scan }
      - { module: '@vendor/valkey-default-origin-mutations', export: session.scan }
      - { module: '@vendor/valkey-destructured-parameters', export: session.scan }
rules:
  - rule: query-reached-per-item
    scope: repository
    options:
      effects: [postgres, valkey]
