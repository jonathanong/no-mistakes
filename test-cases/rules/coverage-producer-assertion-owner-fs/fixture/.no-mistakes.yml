version: 2
rules:
  - rule: coverage-producer-assertion-owner
    scope: repository
    options:
      unanalyzable: report
      producers:
        - { file: src/fs-io.mts, symbol: fsAsserted }
        - { file: src/fs-io.mts, symbol: fsUnasserted }
        - { file: src/fs-io.mts, symbol: pureAsserted }
        - { file: src/fs-io.mts, symbol: pureUnasserted }
        - { file: src/fs-io.mts, symbol: namespaceAsserted }
        - { file: src/fs-io.mts, symbol: namespaceUnasserted }
        - { file: src/fs-io.mts, symbol: defaultAsserted }
        - { file: src/fs-io.mts, symbol: defaultUnasserted }
        - { file: src/fs-io.mts, symbol: bareDefaultAsserted }
        - { file: src/fs-io.mts, symbol: bareDefaultUnasserted }
        - { file: src/fs-io.mts, symbol: defaultPromisesAsserted }
        - { file: src/fs-io.mts, symbol: defaultPromisesUnasserted }
        - { file: src/fs-io.mts, symbol: promisesAsserted }
        - { file: src/fs-io.mts, symbol: promisesUnasserted }
        - { file: src/fs-io.mts, symbol: computedMember }
        - { file: src/fs-io.mts, symbol: aliasedDefault }
        - { file: src/fs-io.mts, symbol: otherModuleAsserted }
        - { file: src/fs-io.mts, symbol: dynamicRequire }
        - { file: src/fs-io.mts, symbol: callbackAsserted }
        - { file: src/fs-io.mts, symbol: writeOnly }
        - { file: src/fs-io.mts, symbol: fsSuppressed }
        - { file: src/fs-io.mts, symbol: paramCallback }
        - { file: src/fs-io.mts, symbol: deadFs }
        - { file: src/fs-io.mts, symbol: ternaryCallback }
        - { file: src/fs-io.mts, symbol: logicalCallback }
        - { file: src/fs-io.mts, symbol: computedCallback }
        - { file: src/fs-io.mts, symbol: literalLastArgument }
        - { file: src/fs-io.mts, symbol: templateLiteralArgument }
        - { file: src/fs-io.mts, symbol: typedLiteralArgument }
        - { file: src/fs-io.mts, symbol: dynamicTemplateArgument }
        - { file: src/fs-io.mts, symbol: spreadArguments }
        - { file: src/fs-io.mts, symbol: noArguments }
        - { file: src/fs-io.mts, symbol: applyLiteralArgument }
        - { file: src/fs-io.mts, symbol: applyTemplateLiteralArgument }
        - { file: src/fs-io.mts, symbol: applyCallbackArgument }
        - { file: src/fs-io.mts, symbol: applyNoArguments }
        - { file: src/fs-io.mts, symbol: applyNullArguments }
        - { file: src/fs-io.mts, symbol: applySpreadArguments }
        - { file: src/fs-io.mts, symbol: callLiteralArgument }
        - { file: src/fs-io.mts, symbol: callCallbackArgument }
        - { file: src/fs-io.mts, symbol: streamOptions }
        - { file: src/fs-io.mts, symbol: mkdirOptions }
        - { file: src/fs-io.mts, symbol: typedStreamOptions }
        - { file: src/fs-io.mts, symbol: arrayOptions }
        - { file: src/fs-io.mts, symbol: callObjectOptions }
        - { file: src/fs-io.mts, symbol: applyObjectOptions }
        - { file: src/fs-io.mts, symbol: applyArrayOptions }
        - { file: src/fs-io.mts, symbol: ternaryOptions }
        - { file: src/fs-io.mts, symbol: fnPropertyOptions }
        - { file: src/fs-io.mts, symbol: functionPropertyOptions }
        - { file: src/fs-io.mts, symbol: classPropertyOptions }
        - { file: src/fs-io.mts, symbol: nestedFnPropertyOptions }
        - { file: src/fs-io.mts, symbol: unknownPropertyOptions }
        - { file: src/fs-io.mts, symbol: memberPropertyOptions }
        - { file: src/fs-io.mts, symbol: callPropertyOptions }
        - { file: src/fs-io.mts, symbol: conditionalPropertyOptions }
        - { file: src/fs-io.mts, symbol: logicalPropertyOptions }
        - { file: src/fs-io.mts, symbol: arrayFunctionOptions }
        - { file: src/fs-io.mts, symbol: arrayUnknownOptions }
        - { file: src/fs-io.mts, symbol: methodOptions }
        - { file: src/fs-io.mts, symbol: getterOptions }
        - { file: src/fs-io.mts, symbol: shorthandOptions }
        - { file: src/fs-io.mts, symbol: spreadOptions }
        - { file: src/fs-io.mts, symbol: arraySpreadOptions }
        - { file: src/fs-io.mts, symbol: arrayHoleOptions }
        - { file: src/fs-io.mts, symbol: computedKeyOptions }
        - { file: src/fs-io.mts, symbol: computedStaticKeyOptions }
        - { file: src/fs-io.mts, symbol: templatePropertyOptions }
        - { file: src/fs-io.mts, symbol: callFnPropertyOptions }
        - { file: src/fs-io.mts, symbol: applyFnPropertyOptions }
        - { file: src/fs-io.mts, symbol: depthOptions }
        - { file: src/fs-io.mts, symbol: nestedDataOptions }
