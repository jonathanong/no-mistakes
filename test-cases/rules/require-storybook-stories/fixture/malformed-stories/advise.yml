version: 2
unanalyzable: advise
projects:
  web:
    type: nextjs
    root: web
  other:
    type: nextjs
    root: other
rules:
  - rule: require-storybook-stories
    projects: [web]
    options:
      include: ["components/*.tsx"]
      stories: ["stories/*.stories.tsx"]
  - rule: require-storybook-stories
    projects: [other]
    options:
      include: ["components/*.tsx"]
      stories: ["stories/*.stories.tsx"]
