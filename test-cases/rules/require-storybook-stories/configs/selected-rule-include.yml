version: 2
projects:
  web:
    type: nextjs
    root: .
rules:
  - rule: require-storybook-stories
    projects: [web]
    include: ["outside/**"]
    exclude: ["components/GenericExcluded.tsx"]
    options:
      include: ["components/*.tsx"]
      exclude: ["components/Excluded.tsx"]
      ignoreIndexAndPrivateFiles: true
      allowFiles:
        "components/Allowed.tsx": "Covered by a separate harness"
