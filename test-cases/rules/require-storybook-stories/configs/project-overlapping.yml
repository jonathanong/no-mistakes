version: 2
projects:
  web:
    type: nextjs
    root: web
  admin:
    type: nextjs
    root: admin
rules:
  - rule: require-storybook-stories
    projects: [web]
    include: [components/**/*.tsx]
    options:
      includeAllReactNamedExports: true
  - rule: require-storybook-stories
    projects: [admin]
    include: [components/**/*.tsx]
    options:
      includeAllReactNamedExports: true
