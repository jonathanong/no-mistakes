version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      executorNames: []
      schemaCatalogPath: schema.json
      sqlInclude: [sql/lookups.sql]
      include: [sql/lookups.sql]
      maxDomainRows: 5000
      allow:
        - object: table:mixed
          reason: one lookup stays outside the finite suffix
        - object: table:notes
          reason: notes have no finite unique key
