version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      executorNames: []
      schemaCatalogPath: catalog.json
      sqlInclude: [sql/view-allow.sql]
      viewBounds:
        "public.unbounded_archive": unbounded
      allow:
        - object: "view:public.unbounded_archive"
          reason: The bounded-statement owner accepts this intentionally unbounded relation.
