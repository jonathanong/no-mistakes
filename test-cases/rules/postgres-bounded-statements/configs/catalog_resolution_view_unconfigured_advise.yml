version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      importSpecifier: "@example/db"
      executorNames: [query]
      include: [src/unconfigured-view.ts]
      sqlInclude: [sql/view-unconfigured.sql]
      schemaCatalogPath: catalog.json
      unanalyzableSql: advise
