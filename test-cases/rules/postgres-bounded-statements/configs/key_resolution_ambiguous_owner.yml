# ambiguous owners must report public.customer_accounts and public.owner_jobs; the unique catalog case stays empty
version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      schemaCatalogPath: catalog-ambiguous-owner.json
      executorNames: []
      sqlInclude: [sql/key-resolution.sql]
      include: [sql/key-resolution.sql]
