# currentDatabase other must leave every statement unbounded
version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      schemaCatalogPath: catalogs/current-db-search-path-other.json
      executorNames: []
      sqlInclude: [copied/temporary-current-database-search-path.sql]
      include: [copied/temporary-current-database-search-path.sql]
