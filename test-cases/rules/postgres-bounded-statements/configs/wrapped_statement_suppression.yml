# after suppression only the unsuppressed write lines remain (17 and 19)
version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      sqlInclude: [sql/wrapped-statement-suppression.sql]
      include: [sql/wrapped-statement-suppression.sql]
      exclude: ["src/**"]
