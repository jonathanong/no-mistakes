version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    include: [imported.ts, templates.ts, schema.json]
    options:
      schemaCatalogPath: schema.json
      importSpecifier: '@example/db'
      executorNames: [query]
      trustedSqlTags: [{module: "@example/db", name: sql}]
      materializedBodies: report
      sqlInclude: []
