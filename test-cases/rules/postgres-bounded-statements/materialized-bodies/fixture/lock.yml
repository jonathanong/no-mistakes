version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    include: [embedded.ts, schema.json]
    options:
      schemaCatalogPath: schema.json
      importSpecifier: '@example/db'
      executorNames: [query]
      materializedBodies: report
      sqlInclude: []
  - rule: postgres-lock-written-rows-only
    scope: repository
    include: [embedded.ts]
    options:
      importSpecifier: '@example/db'
      executorNames: [query]
