version: 2
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      executorNames: []
      schemaCatalogPath: schema.json
      sqlInclude: [sql/lookups.sql]
      include: [sql/lookups.sql]
      maxDomainRows: 5000
      allow:
        - object: table:finite_codes
          reason: the enum key covers every lookup
        - object: table:open_notes
          reason: the body scan stays unbounded
