# Standard suppression directives apply to findings in SQL files.
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      importSpecifier: "@example/db"
      schemaCatalogPath: schema.json
      importSpecifier: "@example/db"
      executorNames: [query, read, write]
      exclude: ['src/**']
      sqlInclude: ['sql/suppress.sql']
