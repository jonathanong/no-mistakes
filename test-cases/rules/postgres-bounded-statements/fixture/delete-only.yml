# Only the listed statement kinds are judged.
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      importSpecifier: "@example/db"
      schemaCatalogPath: schema.json
      importSpecifier: "@example/db"
      executorNames: [query, read, write]
      exclude: ['src/**']
      sqlInclude: ['sql/invalid.sql']
      statements: [delete]
