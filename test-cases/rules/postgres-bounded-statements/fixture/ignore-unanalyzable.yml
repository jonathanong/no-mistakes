# unanalyzableSql: ignore skips SQL that cannot be recovered or parsed, like its sibling rules.
rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      importSpecifier: "@example/db"
      schemaCatalogPath: schema.json
      executorNames: [query, read, write]
      # Keep this recovery-only config independent of the statement-suppression fixture.
      exclude: ['src/jobs.ts', 'src/templates.mts', 'src/statement-suppressions.mts', 'src/wrapped-statement-suppression.mts', 'src/issue-2961-lines.mts']
      sqlInclude: ['sql/broken.sql']
      unanalyzableSql: ignore
