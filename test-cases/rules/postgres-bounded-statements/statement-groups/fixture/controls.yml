rules:
  - rule: postgres-bounded-statements
    scope: repository
    options:
      schemaCatalogPath: schema.json
      executorNames: []
      viewBounds: {activity: unbounded}
      sqlInclude: ['sql/*.sql']
      allow:
        - object: table:topics
          reason: Fixed finite topic vocabulary
      columnBounds:
        items.feed_id:
          reason: A feed contains a fixed finite set of items
