version: 2
effort: max
rules:
  - rule: postgres-no-transformed-uuid-predicates
    scope: repository
    include: [casts-multiword.ts, schema.json]
    options:
      schemaCatalogPath: schema.json
      importSpecifier: db
      executorNames: [query]
      trustedSqlTags: [{module: db, name: sql}]
