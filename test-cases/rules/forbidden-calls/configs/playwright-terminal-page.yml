version: 2
tests:
  playwright:
    configs: playwright.config.ts
rules:
  - rule: forbidden-calls
    scope: repository
    options:
      roots: [{ playwright: true }]
      traversal: file
      unknownCalls: ignore
      targets:
        - global: setTimeout
        - terminal: waitForTimeout
        - moduleExport: { module: node:timers, export: setTimeout }
