changes:
  categories:
    fixtures:
      paths: ["fixtures/responses/**/*.json"]
      id:
        fromPath: fixtures/responses/{id}.json
        separator: "."
      rules:
        - paths: ["fixtures/manifest.json"]
          id:
            keysOf: { format: json, array: fixtures, idField: id }
      exclude: ["generated/**"]
    contracts:
      paths: ["contracts/**", "generated/**"]
    dotted:
      paths: ["dotted/*.json"]
      id: { fromPath: "dotted/{id}.json" }
