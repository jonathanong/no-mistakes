changes:
  categories:
    fixtures:
      paths: ["fixtures/*.json"]
      exclude: ["fixtures/ignored.json"]
      id:
        fromPath: "fixtures/{id}.json"
      tests: ["tests/**/*.test.ts"]
      match: 'loadFixture("{id}")'
      fallback: fixture-tests
tests:
  vitest:
    configs: vitest.config.mts
testPlan:
  vitest:
    fullSuiteTriggers:
      triggers:
        - name: fixture-tests
          paths: ["fixtures/**"]
          supersededByChanges: true
