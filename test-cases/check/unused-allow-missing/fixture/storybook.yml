effort: max
reportUnusedAllowEntries: report
projects:
  web:
    type: nextjs
    root: src
rules:
  - rule: require-storybook-stories
    projects: [web]
    include: ['**']
    exclude: [excluded.mts]
    options:
      allowFiles:
        deleted.tsx: retired
        excluded.mts: excluded
        'unmatched-*.tsx': unmatched
      allowComponents:
        'deleted.tsx#Retired': retired
        'excluded.mts#Excluded': excluded
        'unmatched-*.tsx#Retired': unmatched
